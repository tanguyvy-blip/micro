<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Le choix intertemporel</title>
  <style>
    :root {
      --paper:#f8f5ed; --panel:#fffdf8; --ink:#132536; --muted:#66747d;
      --line:#e4e2dc; --green:#176b52; --blue:#1737ff; --red:#b6483b;
      --gold:#c98c2d; --soft:#edf3f0; --button:#e8edf0;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;
         font-size:18px;line-height:1.5;overflow:hidden;}
    .app{height:100vh;height:100dvh;display:grid;
         grid-template-columns:minmax(290px,34%) 1fr;
         grid-template-rows:auto minmax(0,1fr);gap:18px;padding:18px;overflow:hidden;}
    .progress-strip{grid-column:1/-1;display:flex;gap:6px;align-items:center;
         overflow-x:auto;padding:7px;border:1px solid var(--line);border-radius:14px;
         background:rgba(255,253,248,.92);box-shadow:0 8px 20px rgba(19,37,54,.04);}
    .progress-step{flex:1 1 0;min-width:0;padding:6px 11px;border:1px solid #d6ded9;
         border-radius:9px;background:#fbfaf5;color:var(--muted);font-size:14px;
         font-weight:700;text-align:center;white-space:nowrap;}
    .progress-step.done{color:var(--green);background:#edf6f2;}
    .progress-step.current{color:#fff;background:var(--green);border-color:var(--green);}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
           padding:20px;box-shadow:0 14px 34px rgba(19,37,54,.06);min-height:0;overflow:hidden;}
    .left-panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
    h1{margin:0 0 14px;color:var(--muted);text-transform:uppercase;font-size:24px;letter-spacing:.02em;}
    .narration-text{flex:1;min-height:200px;padding:20px;border:1px solid var(--line);
         border-radius:14px;background:#fffefa;font-size:21px;overflow:auto;line-height:1.55;}
    .controls{display:flex;flex-wrap:wrap;gap:11px;margin-top:16px;}
    button{border:0;border-radius:999px;padding:11px 18px;color:var(--ink);
           background:var(--button);font:700 17px Georgia,serif;cursor:pointer;
           transition:transform .15s,opacity .15s;}
    button:hover:not(:disabled){transform:translateY(-1px);}
    button:disabled{opacity:.5;cursor:default;}
    button.primary{background:var(--green);color:#fff;}
    button.action-focus{box-shadow:0 0 0 3px rgba(23,107,82,.18),0 8px 20px rgba(23,107,82,.22);transform:translateY(-1px);}
    .btn-dev{font-size:12px;padding:4px 11px;background:transparent;border:1px dashed #b0b8bc;
             color:var(--muted);border-radius:999px;font-family:Georgia,serif;font-weight:700;cursor:pointer;align-self:center;}
    .btn-dev.on{border-color:var(--gold);color:var(--gold);background:#fdf6e3;}
    .score-card{margin-top:14px;padding:13px 15px;border:1px solid #d5e0dc;border-radius:12px;
                background:#f5f9f7;display:none;}
    .score-card.visible{display:block;}
    .score-title{color:var(--green);font-weight:700;font-size:18px;margin-bottom:8px;}
    .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .score-item{padding:8px 10px;border-radius:10px;background:#fff;border:1px solid #dfe8e4;}
    .score-label{color:var(--muted);font-size:13px;font-weight:700;}
    .score-value{color:var(--ink);font-size:24px;font-weight:700;line-height:1.05;}
    .main{display:grid;gap:16px;grid-template-rows:minmax(0,1fr) auto;min-height:0;}
    .main.no-exercise{grid-template-rows:minmax(0,1fr);}
    .main.no-exercise .interaction{display:none;}
    .main>.panel:first-child{display:grid;grid-template-rows:minmax(0,1fr);}
    .stage{min-height:0;height:100%;display:grid;place-items:center;overflow:hidden;}
    .interaction{min-height:140px;max-height:30vh;overflow:auto;}
    .interaction.titleless h2{display:none;}
    .interaction.action-focus{border-color:rgba(23,107,82,.55);
      box-shadow:0 0 0 3px rgba(23,107,82,.12),0 14px 30px rgba(23,107,82,.12);}
    .interaction.action-focus h2{color:var(--green);font-weight:700;}
    h2{margin:0 0 10px;color:var(--muted);text-transform:uppercase;font-size:20px;}
    .action-hint{margin:-2px 0 10px;padding:7px 11px;border:1px solid #c9d8d2;border-radius:999px;
                 width:fit-content;max-width:100%;color:var(--green);background:#edf6f2;
                 font-size:15px;font-weight:700;}
    .feedback{min-height:30px;margin-top:10px;color:var(--green);font-weight:700;font-size:17px;}
    .feedback.err{color:var(--red);}
    .button-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;}
    .choice-prompt{margin:0 0 10px;font-size:21px;line-height:1.45;}
    .formula{color:var(--green);font-size:24px;font-weight:700;text-align:center;
             padding:10px 14px;background:var(--soft);border-radius:10px;margin:8px 0;}
    .formula-card{padding:15px 18px;border:1px solid #d5e0dc;border-radius:12px;background:#fbfaf5;}
    .banner{padding:14px 18px;border:1px solid #d5e0dc;border-radius:12px;background:var(--soft);
            color:var(--green);font-size:22px;font-weight:700;text-align:center;}
    .cover-page{width:min(820px,100%);display:grid;gap:18px;padding:28px;
                border:1px solid #c9d8d2;border-radius:16px;background:#fffefa;}
    .cover-title{color:var(--green);font-size:36px;font-weight:700;line-height:1.15;}
    .cover-list{display:grid;gap:8px;margin:0;padding-left:20px;font-size:20px;}
    .cover-author{color:var(--muted);font-size:14px;font-weight:700;}
    .graph-wrap{width:min(880px,100%);display:grid;gap:12px;justify-items:center;}
    .graph-wrap.wide{width:100%;justify-items:stretch;}
    svg{width:min(600px,100%,62vh);height:auto;border:1px solid #d5e0dc;border-radius:14px;
        background:#f7fafb;}
    svg.full{width:100%;max-height:520px;}
    .result-statement{padding:22px 26px;border:1px solid #c9d8d2;border-radius:14px;
                      background:#edf6f2;color:var(--green);font-size:26px;font-weight:700;
                      line-height:1.3;text-align:center;}
    .token-build{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;
                 border:1px solid #cfd8dc;border-radius:12px;background:#fff;min-height:60px;}
    .token-slot{min-width:44px;min-height:38px;display:inline-grid;place-items:center;
                padding:6px 10px;border:2px dashed #a8bbc3;border-radius:8px;
                color:var(--green);font-weight:700;background:#f5fbf8;}
    .token-slot.filled{border-style:solid;border-color:var(--green);}
    .token-palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
    .token-palette button{min-width:50px;padding:8px 13px;}
    .note-box{margin-top:10px;padding:12px 14px;border:1px solid #d5e0dc;border-radius:10px;
              background:#fbfaf5;color:var(--muted);font-size:16px;}
    .slider-wrap{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;}
    .slider-wrap label{font-weight:700;color:var(--ink);white-space:nowrap;}
    .slider-wrap input[type=range]{flex:1;min-width:120px;accent-color:var(--green);}
    .slider-val{font-weight:700;color:var(--green);min-width:40px;}
    .two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
    .info-card{padding:14px;border:1px solid #d5e0dc;border-radius:12px;background:#fbfaf5;}
    .info-card h3{font-size:15px;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
    .quiz-wrap{display:grid;gap:14px;}
    .quiz-q{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfaf5;}
    .quiz-q p{font-size:19px;margin-bottom:10px;}
    .elicit-card{max-width:680px;padding:24px;border:1px solid var(--line);border-radius:16px;
                 background:#fffefa;display:grid;gap:16px;}
    .elicit-amount{font-size:28px;font-weight:700;color:var(--green);text-align:center;padding:12px;}
    .elicit-badges{display:flex;gap:10px;flex-wrap:wrap;}
    .badge{padding:6px 14px;border-radius:999px;font-size:15px;font-weight:700;}
    .badge-green{background:#edf6f2;color:var(--green);border:1px solid rgba(23,107,82,.2);}
    .badge-gold{background:#fdf6e3;color:#7a4f11;border:1px solid rgba(201,140,45,.2);}
    .badge-red{background:#fdf0ee;color:var(--red);border:1px solid rgba(182,72,59,.2);}
    .bank-slider-wrap{display:grid;gap:10px;padding:16px;border:1px solid #d5e0dc;border-radius:12px;background:#fbfaf5;}
    .bank-display{font-size:22px;font-weight:700;padding:12px;border-radius:10px;
                  background:#edf6f2;color:var(--green);text-align:center;}
    .bank-display.bad{background:#fdf0ee;color:var(--red);}
    select{min-width:140px;border:1px solid #cfd8dc;border-radius:10px;padding:9px 11px;
           background:#fff;color:var(--ink);font:700 17px Georgia,serif;}
    /* nav panel */
    .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(19,37,54,.28);z-index:999;}
    .nav-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
               background:var(--panel);border:1px solid var(--line);border-radius:16px;
               box-shadow:0 20px 50px rgba(19,37,54,.18);padding:18px;z-index:1000;
               max-height:80vh;overflow-y:auto;width:min(360px,92vw);}
    .nav-panel-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
                     letter-spacing:.04em;margin-bottom:12px;}
    .nav-panel-item{display:block;width:100%;text-align:left;padding:8px 11px;margin-bottom:3px;
                    border-radius:8px;border:1px solid transparent;background:transparent;
                    color:var(--ink);font:400 15px Georgia,serif;cursor:pointer;}
    .nav-panel-item:hover{background:var(--soft);}
    .nav-panel-item.nav-current{background:#edf6f2;color:var(--green);border-color:#c0ddd4;font-weight:700;}
    @media(max-width:860px){
      .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);padding:12px;}
      .narration-text{min-height:160px;}
    }
    @media(max-height:820px){
      body{font-size:16px;}
      .app{gap:12px;padding:12px;}
      .panel{padding:14px;}
      .narration-text{min-height:160px;padding:16px;font-size:18px;}
      .interaction{min-height:110px;max-height:26vh;}
      h1,h2{font-size:20px;margin-bottom:8px;}
      button{padding:8px 14px;font-size:15px;}
    }
    @media(max-height:700px){
      .app{gap:8px;padding:8px;}
      .panel{padding:10px;border-radius:12px;}
      .narration-text{min-height:120px;padding:12px;font-size:16px;}
      .interaction{min-height:90px;max-height:24vh;}
      svg{width:min(480px,100%,52vh);}
    }
  </style>
</head>
<body>
<div id="navBackdrop" class="nav-backdrop"></div>
<div id="navPanel" class="nav-panel">
  <div class="nav-panel-title">Aller à la diapositive</div>
  <div id="navPanelItems"></div>
</div>
<main class="app">
  <nav id="progressStrip" class="progress-strip" aria-label="Progression"></nav>
  <section class="panel left-panel">
    <h1 id="seqTitle">Progression</h1>
    <div id="narration" class="narration-text"></div>
    <div class="controls">
      <button id="backBtn">Retour</button>
      <button id="nextBtn" class="primary">Suivant</button>
      <button id="devBtn" class="btn-dev" title="Passer (dev)">dev →</button>
      <button id="navBtn" class="btn-dev" title="Navigation">↗ aller à</button>
    </div>
    <div id="scoreCard" class="score-card">
      <div class="score-title">Score</div>
      <div class="score-grid">
        <div class="score-item"><div class="score-label">Réussites</div><div id="scoreP" class="score-value">0</div></div>
        <div class="score-item"><div class="score-label">1er coup</div><div id="scorePr" class="score-value">0</div></div>
      </div>
    </div>
  </section>
  <section class="main" id="mainSection">
    <section class="panel"><div id="stage" class="stage"></div></section>
    <section class="panel interaction" id="intPanel">
      <h2 id="intTitle">Exercice</h2>
      <div id="hint" class="action-hint" style="display:none"></div>
      <div id="interaction"></div>
      <div id="feedback" class="feedback"></div>
    </section>
  </section>
</main>

<script>
'use strict';
// ─── Config ───────────────────────────────────────────────────────
const G = {
  R1:100, R2:110, r:.10, rC:.05, rD:.15, rho:.10,
  sz:460, mg:54, mc:240,
  get delta(){return 1/(1+this.rho);},
  get W(){return this.R1+this.R2/(1+this.r);},
  get WF(){return this.R1*(1+this.r)+this.R2;},
};

// ─── Elicitation state ────────────────────────────────────────────
const elic={phase:0, q1:null, q2:null, q3:null, rhoEst:.10, consistent:null};

// ─── App state ────────────────────────────────────────────────────
const S={
  step:0,
  answered:new Set(),
  active:null,
  missed:new Set(),
  score:{p:0,pr:0},
};

// ─── DOM refs ─────────────────────────────────────────────────────
const $=(id)=>document.getElementById(id);
const narration=$('narration'), stage=$('stage'), interaction=$('interaction');
const feedback=$('feedback'), mainSection=$('mainSection'), intPanel=$('intPanel');
const intTitle=$('intTitle'), hint=$('hint'), seqTitle=$('seqTitle');
const scoreCard=$('scoreCard'), scoreP=$('scoreP'), scorePr=$('scorePr');
const backBtn=$('backBtn'), nextBtn=$('nextBtn');
const navBackdrop=$('navBackdrop'), navPanel=$('navPanel'), navPanelItems=$('navPanelItems');

// ─── SVG helpers ──────────────────────────────────────────────────
function sx(x){return G.mg+(x/G.mc)*(G.sz-2*G.mg);}
function sy(y){return G.sz-G.mg-(y/G.mc)*(G.sz-2*G.mg);}
function sxR(px){return Math.max(0,Math.min(G.mc,(px-G.mg)/(G.sz-2*G.mg)*G.mc));}
function syR(py){return Math.max(0,Math.min(G.mc,(G.sz-G.mg-py)/(G.sz-2*G.mg)*G.mc));}
function svgE(tag,attrs={}){
  const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  return e;
}

function makeSVG(label=''){
  const svg=svgE('svg',{viewBox:`0 0 ${G.sz} ${G.sz}`,'aria-label':label||'Graphique'});
  // grid
  for(let i=0;i<=G.mc;i+=40){
    svg.appendChild(svgE('line',{x1:sx(i),y1:sy(0),x2:sx(i),y2:sy(G.mc),stroke:'#d7e0e4','stroke-width':1}));
    svg.appendChild(svgE('line',{x1:sx(0),y1:sy(i),x2:sx(G.mc),y2:sy(i),stroke:'#d7e0e4','stroke-width':1}));
  }
  // axes
  svg.appendChild(svgE('line',{x1:sx(0),y1:sy(0),x2:sx(G.mc)+10,y2:sy(0),stroke:'#132536','stroke-width':3}));
  svg.appendChild(svgE('line',{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(G.mc)-10,stroke:'#132536','stroke-width':3}));
  svg.appendChild(svgE('polygon',{points:`${sx(G.mc)+10},${sy(0)} ${sx(G.mc)},${sy(0)-6} ${sx(G.mc)},${sy(0)+6}`,fill:'#132536'}));
  svg.appendChild(svgE('polygon',{points:`${sx(0)},${sy(G.mc)-10} ${sx(0)-6},${sy(G.mc)} ${sx(0)+6},${sy(G.mc)}`,fill:'#132536'}));
  // axis ticks & labels
  for(let i=40;i<=G.mc;i+=40){
    svg.appendChild(svgE('text',{x:sx(i)-8,y:sy(0)+22,fill:'#66747d','font-size':13,'text-anchor':'middle'})).textContent=i;
    svg.appendChild(svgE('text',{x:sx(0)-12,y:sy(i)+5,fill:'#66747d','font-size':13,'text-anchor':'end'})).textContent=i;
  }
  // axis names
  const lx=svgE('text',{x:sx(G.mc)-40,y:sy(0)+34,fill:'#132536','font-size':18,'font-weight':700});
  lx.textContent='c₁'; svg.appendChild(lx);
  const ly=svgE('text',{x:sx(0)-28,y:sy(G.mc)+60,fill:'#132536','font-size':18,'font-weight':700,
    transform:`rotate(-90 ${sx(0)-28} ${sy(G.mc)+60})`});
  ly.textContent='c₂'; svg.appendChild(ly);
  return svg;
}

function drawBL(svg, r=G.r, R1=G.R1, R2=G.R2, color='#b6483b', width=3.5){
  const W=R1+R2/(1+r), WF=R1*(1+r)+R2;
  const x1=0, y1=Math.min(WF,G.mc);
  const x2=Math.min(W,G.mc), y2=Math.max(0,WF-(1+r)*Math.min(W,G.mc));
  svg.appendChild(svgE('path',{
    d:`M ${sx(x1)} ${sy(y1)} L ${sx(x2)} ${sy(y2)}`,
    fill:'none',stroke:color,'stroke-width':width,'stroke-linecap':'round'
  }));
}

function drawKinkedBL(svg, rC=G.rC, rD=G.rD, R1=G.R1, R2=G.R2){
  // Left segment (saver): from (0, R2+(1+rC)*R1) to E=(R1,R2)
  const WF_c = R1*(1+rC)+R2;
  svg.appendChild(svgE('path',{
    d:`M ${sx(0)} ${sy(Math.min(WF_c,G.mc))} L ${sx(R1)} ${sy(R2)}`,
    fill:'none',stroke:'#176b52','stroke-width':3.5,'stroke-linecap':'round'
  }));
  // Right segment (borrower): from E=(R1,R2) to (R1+R2/(1+rD), 0)
  const W_d = R1+R2/(1+rD);
  svg.appendChild(svgE('path',{
    d:`M ${sx(R1)} ${sy(R2)} L ${sx(Math.min(W_d,G.mc))} ${sy(0)}`,
    fill:'none',stroke:'#b6483b','stroke-width':3.5,'stroke-linecap':'round'
  }));
}

function drawIC(svg, k, delta=G.delta, highlighted=false, color=null){
  const pts=[];
  for(let c1=5;c1<=G.mc;c1+=1){
    const lnc2=(k-Math.log(c1))/delta;
    const c2=Math.exp(lnc2);
    if(c2>1&&c2<=G.mc) pts.push(`${sx(c1).toFixed(1)},${sy(c2).toFixed(1)}`);
  }
  if(pts.length<2)return;
  const d='M '+pts.join(' L ');
  const sc=color||(highlighted?'#1737ff':'#6c85ff');
  const sw=highlighted?4:2.5;
  svg.appendChild(svgE('path',{d,fill:'none',stroke:sc,'stroke-width':sw,'stroke-linecap':'round',opacity:highlighted?.95:.62}));
}

function icLevel(c1,c2,delta=G.delta){return Math.log(c1)+delta*Math.log(c2);}

function optPoint(r=G.r,R1=G.R1,R2=G.R2,rho=G.rho){
  // U=ln(c1)+delta*ln(c2), BC: c1+c2/(1+r)=W
  // FOC: 1/c1 = delta*(1+r)/c2 => c2=delta*(1+r)*c1
  // => c1(1+delta)=W
  const delta=1/(1+rho), W=R1+R2/(1+r);
  const c1=W/(1+delta), c2=delta*(1+r)*c1;
  return{c1,c2};
}

function drawPt(svg,c1,c2,label,color='#176b52',dx=10,dy=-12){
  svg.appendChild(svgE('circle',{cx:sx(c1),cy:sy(c2),r:7,fill:color,stroke:'#fff','stroke-width':3}));
  const t=svgE('text',{x:sx(c1)+dx,y:sy(c2)+dy,fill:color,'font-size':16,'font-weight':700});
  t.textContent=label; svg.appendChild(t);
}

function svgText(svg,txt,c1,c2,color,size=15){
  const t=svgE('text',{x:sx(c1),y:sy(c2),fill:color,'font-size':size,'font-weight':700});
  t.textContent=txt; svg.appendChild(t);
}

// ─── Feedback helpers ─────────────────────────────────────────────
function setFB(txt,ok=true){
  feedback.innerHTML=txt;
  feedback.className='feedback'+(ok?'':' err');
  if(!S.active)return;
  if(!ok){S.missed.add(S.active);}
  else if(/^(Exact|Très bien|Correct|Oui|Bien)/i.test(String(txt))){
    if(!S.score.p||!S.answered.has(S.active)){
      S.score.p++;
      if(!S.missed.has(S.active))S.score.pr++;
      S.answered.add(S.active);
      scoreP.textContent=S.score.p; scorePr.textContent=S.score.pr;
      scoreCard.classList.add('visible');
    }
  }
}
function setActive(key){S.active=key;}

// ─── Progress strip ───────────────────────────────────────────────
const sections=[
  {label:'1. Préférences',from:0,to:6},
  {label:'2. Contrainte',from:7,to:14},
  {label:'3. Choix',from:15,to:19},
  {label:'4. Extensions',from:20,to:25},
];
function renderStrip(){
  $('progressStrip').innerHTML=sections.map((s,i)=>{
    const cur=S.step>=s.from&&S.step<=s.to;
    const done=S.step>s.to;
    return`<span class="progress-step${cur?' current':done?' done':''}">${s.label}</span>`;
  }).join('');
}

// ─── Steps ────────────────────────────────────────────────────────
const steps=[
  // 0 — Cover
  {label:'Présentation',text:'Ce module porte sur le choix intertemporel. Comment un individu choisit-il entre consommer aujourd\'hui et consommer demain ?',
   render:renderCover},
  // 1 — Élicitation
  {label:'Vos préférences',text:'Avant toute théorie, une expérience : je vais vous soumettre trois choix pour révéler votre propre taux de préférence pour le présent.',
   render:renderElicit,gate:()=>S.answered.has('elic_done')},
  // 2 — ρ et δ
  {label:'ρ et δ',text:'Le taux de préférence pour le présent ρ et le facteur d\'actualisation δ sont les deux faces d\'une même pièce. Voyons le lien.',
   render:renderDelta,gate:()=>S.answered.has('delta_done')},

function updateNav(){
  renderStrip();
  const cur=steps[S.step];
  narration.innerHTML=cur.text;
  seqTitle.textContent=`${S.step+1}/${steps.length}`;
  backBtn.disabled=S.step===0;
  const gated=cur.gate&&!cur.gate();
  nextBtn.disabled=(gated||S.step===steps.length-1);
  nextBtn.classList.toggle('action-focus',!gated&&S.step<steps.length-1);
  intPanel.classList.toggle('action-focus',!!gated);
  mainSection.classList.toggle('no-exercise',false);
  feedback.textContent=''; feedback.className='feedback';
  hint.style.display='none'; hint.textContent='';
  intTitle.textContent='Exercice';
  intPanel.classList.remove('titleless');
  interaction.innerHTML='';
  S.active=null;
  cur.render();
  // build nav panel
  navPanelItems.innerHTML=steps.map((s,i)=>
    `<button class="nav-panel-item${i===S.step?' nav-current':''}" onclick="goStep(${i})">${i+1}. ${s.label}</button>`
  ).join('');
}

function goStep(i){
  S.step=i; hideNavPanel(); updateNav();
}
function hideNavPanel(){
  navPanel.style.display='none'; navBackdrop.style.display='none';
}
function noExercise(){
  mainSection.classList.add('no-exercise');
}
function setStage(html){stage.innerHTML=html;}
function setInt(html){interaction.innerHTML=html;}

backBtn.addEventListener('click',()=>{if(S.step>0){S.step--;updateNav();}});
nextBtn.addEventListener('click',()=>{if(S.step<steps.length-1){S.step++;updateNav();}});
$('devBtn').addEventListener('click',()=>{
  // force-unlock current gate
  const cur=steps[S.step];
  if(cur.gate){
    // add all gate keys for this step manually
    const gateStr=cur.gate.toString();
    const keys=gateStr.match(/'([^']+)'/g)||[];
    keys.forEach(k=>S.answered.add(k.replace(/'/g,'')));
  }
  updateNav();
});
$('navBtn').addEventListener('click',()=>{
  navPanel.style.display='block'; navBackdrop.style.display='block';
});
navBackdrop.addEventListener('click',hideNavPanel);

function renderTMS(){
  setActive('tms_done');
  const svg=makeSVG('TMS intertemporel');
  const delta=G.delta;
  const k=icLevel(100,110,delta);
  drawIC(svg,k,delta,true);
  drawPt(svg,100,110,'A','#176b52');
  // tangent line at (100,110): slope = -1/(delta) (for log utility)
  // TMS = -dc2/dc1 = c2/(delta*c1)
  const tms=(110/(delta*100));
  // draw tangent segment
  const x0=70,x1=130;
  const y0=110+tms*(100-x0), y1=110+tms*(100-x1);
  svg.appendChild(svgE('line',{x1:sx(x0),y1:sy(y0),x2:sx(x1),y2:sy(y1),
    stroke:'#c98c2d','stroke-width':2.5,'stroke-dasharray':'6 3'}));
  svgText(svg,`pente = −${tms.toFixed(2)}`,135,y1-5,'#c98c2d',14);
  setStage(`<div class="graph-wrap">
    <div class="banner">Le TMS intertemporel = pente de la courbe d'indifférence</div>
    <div id="svgMount"></div>
    <div class="formula-card" style="max-width:540px">
      <div class="formula">TMS₁₂ = − u′(c₁) / [δ · u′(c₂)]</div>
      <p style="margin-top:8px;color:var(--muted);font-size:15px">Pour u(c) = ln(c) : TMS = c₂ / (δ · c₁) = ${tms.toFixed(2)} au point A.</p>
    </div>
  </div>`);
  document.getElementById('svgMount').appendChild(svg);
  setInt(`<div class="choice-prompt">Que représente le TMS intertemporel ?</div>
    <div class="button-row">
      <button onclick="chkTMS('a')">Le taux d'intérêt du marché</button>
      <button onclick="chkTMS('b')">La quantité de c₂ que l'individu accepte de sacrifier pour une unité de c₁ de plus, sans changer d'utilité</button>
      <button onclick="chkTMS('c')">Le rapport des revenus R₁/R₂</button>
    </div>`);
}
window.chkTMS=function(ans){
  if(ans==='b'){
    setFB('Exact ! Le TMS mesure le taux d\'échange subjectif entre la consommation présente et future, le long d\'une courbe d\'indifférence.');

function renderUtility(){
  setActive('util_done');
  // Token puzzle to build U = u(c1) + delta*u(c2)
  const slots=['A','B','C','D'];
  const correct=['u(c₁)','+','δ','u(c₂)'];
  let filled=Array(4).fill(null);
  setStage(`<div class="graph-wrap" style="max-width:700px;gap:16px">
    <div class="banner">Construire la fonction d'utilité intertemporelle</div>
    <div class="formula-card">
      <p>Pour deux périodes, l'utilité totale est une somme actualisée de <em>félicités</em> u(cₜ) :</p>
      <div id="tokenBuild" class="token-build" style="font-size:22px;gap:14px">
        <span id="sl0" class="token-slot" data-i="0">?</span>
        <span id="sl1" class="token-slot" data-i="1">?</span>
        <span id="sl2" class="token-slot" data-i="2">?</span>
        <span id="sl3" class="token-slot" data-i="3">?</span>
      </div>
      <p style="margin-top:10px;color:var(--muted);font-size:15px">Cliquez sur les tokens dans le bon ordre pour assembler U.</p>
    </div>
  </div>`);
  setInt(`<div class="token-palette" id="palette">
    ${['u(c₁)','u(c₂)','+','δ'].map(t=>`<button onclick="placeToken('${t}')" data-tok="${t}">${t}</button>`).join('')}
  </div>
  <div class="note-box">u(·) est la <b>fonction de félicité</b> (utilité instantanée). δ = 1/(1+ρ) actualise la félicité future.</div>`);

  let nextSlot=0;
  window.placeToken=function(tok){
    if(nextSlot>=4)return;
    filled[nextSlot]=tok;
    const sl=document.getElementById(`sl${nextSlot}`);
    sl.textContent=tok; sl.classList.add('filled');
    nextSlot++;
    if(nextSlot===4){
      if(filled.join('')===correct.join('')){
        setFB('Exact ! U = u(c₁) + δ·u(c₂). La félicité future est actualisée par δ < 1, ce qui traduit l\'impatience.');
        S.answered.add('util_done'); updateNav();
      } else {
        setFB('Pas tout à fait. Réessayez en remettant les tokens.',false);
        setTimeout(()=>{filled=Array(4).fill(null);nextSlot=0;
          [0,1,2,3].forEach(i=>{const sl=document.getElementById(`sl${i}`);sl.textContent='?';sl.classList.remove('filled');});
          feedback.textContent='';
        },1800);
      }
    }
  };
}

function renderBank(){

    const c1=G.R1+E, repay=E*(1+G.r), ok=repay<=G.R2;
    const disp=document.getElementById('bankDisp');
    const bdisp=document.getElementById('bankBig');
    if(!disp)return;
    if(E===0){
      disp.textContent=`Tu ne demandes rien. C₁ = R₁ = ${G.R1} €.`;
      disp.className='bank-display';
      if(bdisp)bdisp.textContent=`C₁ = ${G.R1} €`;
    } else if(!ok){
      disp.innerHTML=`❌ Le banquier refuse ! Tu devrais rembourser ${repay.toFixed(0)} € mais tu n'auras que R₂ = ${G.R2} €.`;
      disp.className='bank-display bad';
      if(bdisp)bdisp.textContent=`C₁ = ${c1} € — REFUSÉ`;
    } else {
      const rest=G.R2-repay;
      disp.innerHTML=`✓ Accordé ! C₁ = ${c1} €. En période 2 tu rembourses ${repay.toFixed(0)} €, il te reste ${rest.toFixed(0)} €.`;
      disp.className='bank-display';
      if(bdisp)bdisp.textContent=`C₁ = ${c1} €`;
    }
    // enable confirm button when E is exactly the max (or very close)
    const confirmBtn=document.getElementById('bankConfirm');

function renderNPer(){
  noExercise();
  setStage(`<div class="graph-wrap" style="max-width:740px;gap:16px">
    <div class="banner">Généralisation à N périodes</div>
    <div class="formula-card">
      <p><b>Fonction d'utilité :</b></p>
      <div class="formula">U = Σₜ₌₁ᴺ δᵗ⁻¹ · u(cₜ)</div>
      <p style="margin-top:10px"><b>Contrainte budgétaire (valeur actuelle) :</b></p>
      <div class="formula">Σₜ₌₁ᴺ cₜ / (1+r)ᵗ⁻¹ = Σₜ₌₁ᴺ Rₜ / (1+r)ᵗ⁻¹ = W</div>
      <p style="margin-top:10px;color:var(--muted);font-size:16px">La richesse actualisée totale W est la valeur présente de tous les revenus futurs. La contrainte dit que la valeur présente de la consommation totale ne peut pas dépasser W.</p>
    </div>
    <div class="two-cols">
      <div class="info-card"><h3>Exemple N=3</h3>r=10%, R₁=100, R₂=110, R₃=121<br>W = 100 + 110/1,1 + 121/1,21 = 300 €</div>
      <div class="info-card"><h3>Interprétation</h3>À chaque paire de périodes adjacentes, la logique de tangence s'applique → équation d'Euler.</div>
    </div>
  </div>`);
}

function renderEuler(){
  setActive('euler_done');
  setStage(`<div class="graph-wrap" style="max-width:740px;gap:16px">
    <div class="banner">L'équation d'Euler — condition d'optimalité en N périodes</div>
    <div class="formula-card">
      <p>La condition d'optimalité entre deux périodes adjacentes t et t+1 :</p>
      <div class="formula">u′(cₜ) = δ · (1+r) · u′(cₜ₊₁)</div>
      <p style="margin-top:10px;color:var(--muted);font-size:16px">Pour u(c) = ln(c) : 1/cₜ = δ(1+r)/cₜ₊₁ ⟹ cₜ₊₁/cₜ = δ(1+r) = (1+r)/(1+ρ)</p>
    </div>
    <div class="formula-card" style="margin-top:0">
      <p><b>Interprétation :</b></p>
      <ul style="padding-left:18px;margin-top:6px;font-size:16px;color:var(--muted)">
        <li>Si r = ρ : cₜ₊₁ = cₜ → profil de consommation plat.</li>
        <li>Si r &gt; ρ : cₜ₊₁ &gt; cₜ → consommation croissante (épargne).</li>
        <li>Si r &lt; ρ : cₜ₊₁ &lt; cₜ → consommation décroissante (désépargne).</li>
      </ul>
    </div>
  </div>`);
  setInt(`<div class="choice-prompt">Si r = 8 % et ρ = 12 %, le profil de consommation optimal est…</div>
    <div class="button-row">
      <button onclick="chkEuler('a')">Croissant dans le temps</button>
      <button onclick="chkEuler('b')">Décroissant dans le temps</button>
      <button onclick="chkEuler('c')">Plat (cₜ constant)</button>
    </div>`);
}

  if(ans==='b'){

    S.answered.add('euler_done'); updateNav();
  } else setFB('Consultez l\'équation d\'Euler : quel est le signe de cₜ₊₁/cₜ − 1 quand r < ρ ?',false);
};

// ─── Generic quiz runner ───────────────────────────────────────────
function runQuiz(qs,doneKey){
  let qi=0, correct=0, firstAttempt=true;
  function showQ(){
    if(qi>=qs.length){
      stage.innerHTML=`<div class="result-statement">Quiz terminé : ${correct}/${qs.length}</div>`;
      interaction.innerHTML=`<div class="button-row"><button class="primary" onclick="quizDone()">Continuer →</button></div>`;
      window.quizDone=()=>{S.answered.add(doneKey);updateNav();};
      return;
    }
    const q=qs[qi];
    stage.innerHTML=`<div class="graph-wrap" style="max-width:700px">
      <div class="banner">Question ${qi+1}/${qs.length}</div>
      <div class="formula-card"><p style="font-size:20px">${q.q}</p></div>
    </div>`;
    interaction.innerHTML=`<div class="quiz-wrap">
      <div class="button-row">${q.opts.map((o,i)=>`<button onclick="qAns(${i})" style="text-align:left">${o}</button>`).join('')}</div>
    </div>`;
    firstAttempt=true;
  }
  window.qAns=function(i){
    const q=qs[qi];
    if(i===q.ok){
      if(firstAttempt)correct++;
      setFB(q.fb);
      qi++;
      setTimeout(()=>{feedback.textContent='';showQ();},1800);
    } else {
      firstAttempt=false;
      setFB('Pas encore. Reconsidérez.',false);
    }
  };
  showQ();
}
