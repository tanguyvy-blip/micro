<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fonction de dépense et demandes compensées</title>
  <style>
    :root {
      --paper: #f8f5ed;
      --panel: #fffdf8;
      --ink: #132536;
      --muted: #66747d;
      --line: #e4e2dc;
      --green: #176b52;
      --blue: #2156c5;
      --red: #b6483b;
      --gold: #c98c2d;
      --violet: #6d4bc2;
      --soft: #edf3f0;
      --button: #e8edf0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.34;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(320px, 58%) minmax(280px, 42%);
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .app.no-visual {
      grid-template-columns: minmax(0, 1fr);
      max-width: 1180px;
      margin: 0 auto;
    }

    .app.no-visual .main {
      display: none;
    }

    .progress-strip {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      align-items: stretch;
      min-width: 0;
      overflow-x: auto;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 253, 248, 0.94);
      box-shadow: 0 10px 26px rgba(19, 37, 54, 0.04);
    }

    .progress-step {
      flex: 1 1 0;
      min-width: 105px;
      padding: 6px 9px;
      border: 1px solid #d6ded9;
      border-radius: 8px;
      background: #fbfaf5;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .progress-step.done {
      color: var(--green);
      background: #edf6f2;
    }

    .progress-step.current {
      color: white;
      background: var(--green);
      border-color: var(--green);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(19, 37, 54, 0.06);
      min-height: 0;
      overflow: hidden;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h1, h2 {
      margin: 0;
      color: #5f6e77;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 23px;
      line-height: 1.05;
    }

    .course-credit {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .jump-nav select {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      border: 1px solid #cfd8dc;
      border-radius: 10px;
      padding: 8px 10px;
      background: white;
      color: var(--ink);
      font: 700 15px Georgia, "Times New Roman", serif;
    }

    .statement,
    .feedback,
    .hint-box {
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffefa;
      overflow: auto;
    }

    .statement {
      min-height: 0;
      flex: 0 1 auto;
      font-size: 17px;
      line-height: 1.3;
    }

    .statement p,
    .feedback p,
    .hint-box p { margin: 0 0 6px; }
    .statement p:last-child,
    .feedback p:last-child,
    .hint-box p:last-child { margin-bottom: 0; }

    .feedback {
      min-height: 46px;
      border-color: #d3ded9;
      background: #f7fbf8;
      color: var(--green);
      font-weight: 700;
      font-size: 15px;
      line-height: 1.28;
    }

    .feedback.error {
      border-color: #ecd0c9;
      background: #fff6f3;
      color: var(--red);
    }

    .controls {
      display: grid;
      gap: 8px;
      min-height: 0;
      overflow: auto;
    }

    .button-row,
    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 13px;
      min-height: 44px;
      color: var(--ink);
      background: var(--button);
      font: 700 15px Georgia, "Times New Roman", serif;
      cursor: pointer;
    }

    button.primary {
      background: var(--green);
      color: white;
    }

    button.selected {
      background: var(--green);
      color: white;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--green);
    }

    .slider-box,
    .formula-box,
    .reveal-box {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffefa;
    }

    .app.no-visual .formula-box {
      gap: 7px;
      padding: 9px 11px;
    }

    .token-palette {
      align-content: flex-start;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .token-palette button {
      padding: 6px 9px;
      font-size: 14px;
    }

    .palette-box {
      display: grid;
      gap: 7px;
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 9px 11px;
      border: 1px solid #cadbd3;
      border-left: 5px solid var(--green);
      border-radius: 10px;
      background: #f7fbf8;
      box-shadow: 0 8px 18px rgba(19, 37, 54, 0.08);
    }

    .palette-title {
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .step-feedback {
      display: none;
      padding: 8px 10px;
      border: 1px solid #d3ded9;
      border-radius: 8px;
      background: #f7fbf8;
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }

    .step-feedback.error {
      border-color: #ecd0c9;
      background: #fff6f3;
      color: var(--red);
    }

    .step-feedback.visible {
      display: block;
    }

    .foc-group {
      display: grid;
      grid-template-columns: minmax(190px, max-content) max-content minmax(170px, 1fr);
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }

    .foc-pair {
      display: grid;
      gap: 6px;
    }

    .foc-brace {
      font-size: 58px;
      line-height: 0.9;
      color: var(--green);
    }

    .foc-arrow {
      display: inline-block;
      margin-right: 8px;
      color: var(--green);
      font-weight: 700;
    }

    .formula {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 7px;
      background: #f2f5f3;
      border: 1px solid #d9e2de;
      color: var(--ink);
      font-weight: 700;
      white-space: nowrap;
      max-width: 100%;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
    }

    .graph-title {
      color: #5f6e77;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .graph-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
    }

    svg {
      width: min(760px, 100%, 78vh);
      height: auto;
      border: 1px solid #d5e0dc;
      border-radius: 10px;
      background: #fbfaf5;
      touch-action: none;
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 24px;
      height: 5px;
      border-radius: 999px;
      background: var(--green);
    }

    .nav-bar {
      position: fixed;
      bottom: 14px;
      left: 14px;
      display: flex;
      gap: 5px;
      z-index: 50;
    }

    .nav-bar button {
      min-height: 0 !important;
      height: 28px;
      min-width: 28px;
      padding: 0 8px;
      border-radius: 7px;
      font-size: 13px;
      background: rgba(248, 245, 237, 0.95);
      border: 1px solid #d5ddd9;
      color: var(--muted);
      box-shadow: 0 1px 5px rgba(19,37,54,0.08);
    }

    .nav-bar button.primary {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }

    .step-done {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 12px;
      border-left: 3px solid var(--green);
      background: #f7fbf8;
      border-radius: 0 8px 8px 0;
      font-size: 14px;
    }

    .step-done + .step-done { margin-top: 5px; }

    .step-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    @media (max-height: 850px) {
      body { font-size: 17px; }
      .app { gap: 12px; padding: 12px; }
      .panel { padding: 13px; }
      .progress-strip { padding: 4px; gap: 4px; }
      .progress-step { font-size: 12px; padding: 4px 8px; }
    }

    @media (max-height: 720px) {
      body { font-size: 15px; }
      .app { gap: 10px; padding: 10px; }
      .panel { padding: 10px; }
      .course-credit { display: none; }
      .progress-step { min-width: 80px; font-size: 11px; }
      svg { width: min(100%, 46vh); }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
        font-size: 16px;
      }

      .app {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        gap: 12px;
        padding: 10px;
      }

      .panel {
        padding: 12px;
      }

      h1, h2 {
        font-size: 20px;
      }

      .course-credit {
        display: none;
      }

      .statement {
        font-size: 16px;
      }

      .formula {
        white-space: normal;
        overflow-wrap: anywhere;
      }

      svg { width: min(100%, 64vh); }
    }
    /* ── TTS ── */
    #ttsToggle{position:fixed;bottom:20px;right:20px;z-index:1000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(48,67,82,.14);background:rgba(255,255,255,.92);backdrop-filter:blur(6px);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#9aabbb;box-shadow:0 2px 10px rgba(19,37,54,.10);transition:color .2s,border-color .2s;}
    #ttsToggle:hover{color:#176b52;border-color:rgba(23,107,82,.3);}
    #ttsToggle.tts-active{color:#176b52;border-color:rgba(23,107,82,.25);background:rgba(237,246,242,.95);}
    #ttsToggle svg{width:18px;height:18px;display:block;}
    /* ── Progress ── */
    #pgHUD{position:fixed;bottom:20px;left:20px;z-index:999;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid rgba(48,67,82,.14);background:rgba(255,255,255,.92);backdrop-filter:blur(6px);font-size:14px;color:#5f6e77;box-shadow:0 2px 10px rgba(19,37,54,.10);pointer-events:none;}
    .pg-sc{color:#176b52;font-weight:700;display:flex;align-items:center;gap:4px;}
    .pg-pr{color:#c98c2d;font-weight:700;display:flex;align-items:center;gap:4px;}
    .pg-sep{opacity:.3;font-size:12px;}
    #pgOverlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(19,37,54,.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
    .pg-card{background:#fff;border-radius:20px;padding:28px 32px;max-width:460px;width:90%;box-shadow:0 24px 64px rgba(19,37,54,.22);}
    .pg-card h3{margin:0 0 20px;font-size:22px;color:#132536;}
    .pg-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f2;gap:12px;}
    .pg-row:last-of-type{border-bottom:none;margin-bottom:16px;}
    .pg-mod-name{color:#132536;font-weight:500;font-size:16px;}
    .pg-mod-pts{font-size:14px;color:#5f6e77;white-space:nowrap;}
    .pg-mod-pts .s{color:#176b52;font-weight:700;}
    .pg-mod-pts .p{color:#c98c2d;font-weight:700;}
  </style>
</head>
<body>
  <div class="app">
    <div class="progress-strip" id="progress"></div>

    <aside class="panel side">
      <h1>Fonction de dépense et demandes compensées</h1>
      <div class="jump-nav">
        <select id="jumpSelect" aria-label="Aller à une étape"></select>
      </div>
      <div class="statement" id="statement"></div>
      <div class="controls" id="controls"></div>
      <div class="feedback" id="feedback">Les droites sont parallèles car le rapport des prix ne change pas.</div>
      <div class="nav-bar" id="navBar"></div>
    </aside>

    <main class="panel main">
      <div class="graph-title" id="graphTitle">Prix et pente</div>
      <div class="graph-wrap" id="graphWrap"></div>
      <div class="legend" id="legend"></div>
    </main>
  </div>

  <script>
    const config = {
      size: 560,
      margin: 64,
      maxB: 11,
      maxC: 11,
      pB: 20,
      pC: 20,
      oldPB: 20,
      newPB: 50,
      income: 160,
      uBar: 4
    };

    const screens = [
      {
        title: "Introduction",
        short: "Intro",
        mode: "cover",
        html: `
          <p><strong>Ce module étudie le problème dual du choix du consommateur</strong> : minimiser la dépense pour atteindre un niveau de satisfaction donné.</p>
          <p>Nous construisons la <strong>fonction de dépense</strong> et les <strong>demandes compensées (hicksiennes)</strong>, puis nous établissons l'<strong>équation de Slutsky</strong> qui décompose l'effet d'une variation de prix en effet de substitution et effet revenu.</p>
          <ul style="margin:10px 0 0 16px;padding:0;line-height:1.9;">
            <li>Rappel sur la droite budgétaire et sa pente</li>
            <li>Minimisation de la dépense sous contrainte d'utilité</li>
            <li>Demandes hicksiennes et fonction de dépense</li>
            <li>Dualité marshallien / hicksien</li>
            <li>Décomposition de Slutsky</li>
          </ul>
          <p style="color:var(--muted);font-size:15px;margin-top:12px;">Prérequis : modules 3 (choix sous contrainte), 6 (fonction d'utilité), 4 (effets substitution / revenu).</p>
          <p class="course-credit" style="margin-top:18px;">Auteur : Tanguy van Ypersele — Tous droits réservés<br>Programmation effectuée à l'aide de l'IA.</p>`
      },
      {
        title: "Rappel : prix et pente",
        short: "Pente",
        mode: "parallel-slider",
        html: `
          <p>Lorsque les prix <span class="formula">p<sub>B</sub></span> et <span class="formula">p<sub>C</sub></span> sont donnés, la pente de la droite de budget est fixée : <span class="formula">-p<sub>B</sub>/p<sub>C</sub></span>.</p>
          <p>Le revenu ne change pas cette pente : il déplace seulement la droite parallèlement.</p>`
      },
      {
        title: "Une infinité de droites budgétaires",
        short: "Famille",
        mode: "income-family",
        html: `
          <p>Pour un même système de prix, il existe autant de droites budgétaires parallèles qu'il existe de niveaux de revenu.</p>
          <p>Augmenter le revenu élargit l'ensemble budgétaire sans modifier le rapport des prix.</p>`
      },
      {
        title: "Fixer une courbe d'indifférence cible",
        short: "u cible",
        mode: "target-ci",
        html: `
          <p>On fixe maintenant un niveau d'utilité à atteindre : <span class="formula">ū</span>.</p>
          <p>Graphiquement, cela revient à choisir une courbe d'indifférence particulière.</p>
          <p><span class="formula">u(B,C)=ū</span></p>
          <p>Avec Cobb-Douglas : <span class="formula">B<sup>1/2</sup>C<sup>1/2</sup>=ū</span>.</p>`
      },
      {
        title: "Chercher le revenu minimal",
        short: "Min R",
        mode: "minimal-income",
        html: `
          <p>On cherche le plus petit revenu permettant d'atteindre cette courbe d'indifférence.</p>
          <p>Déplacez une droite de budget parallèle : une droite trop basse ne permet pas d'atteindre <span class="formula">ū</span>, tandis qu'une droite plus haute coûte davantage.</p>
          <p>Essayez de trouver la droite la plus basse qui permet encore d'atteindre la courbe verte.</p>`
      },
      {
        title: "Les demandes compensées",
        short: "Hicks",
        mode: "hicksian",
        html: `
          <p>Le panier tangent donne les quantités choisies lorsque l'on minimise la dépense pour atteindre <span class="formula">ū</span>.</p>
          <p>Ces quantités sont appelées demandes compensées ou demandes hicksiennes.</p>
          <p>On les note avec un exposant <span class="formula">h</span>, comme Hicks : <span class="formula">B<sup>h</sup></span> et <span class="formula">C<sup>h</sup></span>.</p>
          <p>Cela signifie : quantité demandée du bien lorsque l'on raisonne avec le problème hicksien, c'est-à-dire à utilité cible donnée.</p>
          <p><span class="formula">B<sup>h</sup>(p<sub>B</sub>,p<sub>C</sub>,ū)</span></p>
          <p><span class="formula">C<sup>h</sup>(p<sub>B</sub>,p<sub>C</sub>,ū)</span></p>`
      },
      {
        title: "La fonction de dépense",
        short: "Dépense",
        mode: "expenditure",
        html: `
          <p>La fonction de dépense donne le revenu minimal nécessaire pour atteindre <span class="formula">ū</span> lorsque les prix sont <span class="formula">p<sub>B</sub></span> et <span class="formula">p<sub>C</sub></span>.</p>
          <p><span class="formula">e(p<sub>B</sub>,p<sub>C</sub>,ū)=p<sub>B</sub>B<sup>h</sup>(p<sub>B</sub>,p<sub>C</sub>,ū)+p<sub>C</sub>C<sup>h</sup>(p<sub>B</sub>,p<sub>C</sub>,ū)</span></p>`
      },
      {
        title: "Le programme de minimisation",
        short: "Programme",
        mode: "program",
        html: `
          <p>Mathématiquement, on résout une minimisation sous contrainte.</p>
          <p>On cherche le panier le moins coûteux qui permet d'atteindre le niveau d'utilité <span class="formula">ū</span>.</p>
          <p>Le Lagrangien ne sert pas seulement à maximiser une fonction d'utilité : il sert plus généralement à optimiser une fonction sous contrainte.</p>
          <p>Ici, l'objectif n'est donc plus de maximiser l'utilité. On minimise la dépense, avec la contrainte d'atteindre exactement <span class="formula">ū</span>.</p>
          <p><span class="formula">min<sub>B,C</sub> p<sub>B</sub>B+p<sub>C</sub>C</span></p>
          <p>sous contrainte : <span class="formula">u(B,C)=ū</span></p>
          <p>Lagrangien : <span class="formula">L=p<sub>B</sub>B+p<sub>C</sub>C+λ(ū-u(B,C))</span></p>
          <p>Le <strong>multiplicateur de Lagrange</strong> <span class="formula">λ</span> mesure le coût marginal d'atteindre une unité d'utilité supplémentaire : de combien la dépense minimale augmente si la cible <span class="formula">ū</span> monte d'une unité.</p>
          <div class="foc-group">
            <div class="foc-pair">
              <span class="formula">p<sub>B</sub>=λ UM<sub>B</sub></span>
              <span class="formula">p<sub>C</sub>=λ UM<sub>C</sub></span>
            </div>
            <div class="foc-brace">}</div>
            <div><span class="foc-arrow">⇒</span><span class="formula">p<sub>B</sub>/p<sub>C</sub> = UM<sub>B</sub>/UM<sub>C</sub></span></div>
          </div>
          <p><span class="formula">ū=u(B,C)</span></p>`
      },
      {
        title: "Exemple Cobb-Douglas",
        short: "Calcul",
        mode: "cobb-reveal",
        html: `
          <p>Dans le cas <span class="formula">u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup></span>, on peut calculer explicitement les demandes compensées.</p>
          <p>On déroule toute la méthode : Lagrangien, conditions du premier ordre, tangence, puis résolution du système.</p>`
      },
      {
        title: "Exercice : autre Cobb-Douglas",
        short: "Exercice",
        mode: "cobb-practice",
        html: `
          <p>Appliquez maintenant exactement la même méthode à une autre Cobb-Douglas :</p>
          <p><span class="formula">u(B,C)=B<sup>1/3</sup>C<sup>2/3</sup></span></p>
          <p>On cherche les demandes compensées qui minimisent la dépense pour atteindre <span class="formula">ū</span>.</p>`
      },
      {
        title: "Lien avec demandes marshalliennes",
        short: "Dualité",
        mode: "marshall-hicks",
        html: `
          <p>Les demandes marshalliennes partent d'un revenu donné et maximisent l'utilité.</p>
          <p>Les demandes compensées partent d'un niveau d'utilité donné et minimisent la dépense.</p>
          <p>Par convention, on note souvent la demande marshallienne avec <span class="formula">x</span> : c'est le panier choisi quand les prix et le revenu sont donnés.</p>
          <p>On note souvent la demande hicksienne avec <span class="formula">h</span> : c'est le panier le moins coûteux qui permet d'atteindre une utilité cible.</p>
          <p>Marshallien : <span class="formula">x(p<sub>B</sub>,p<sub>C</sub>,R)</span> — panier qui maximise <span class="formula">u(B,C)</span> sous <span class="formula">p<sub>B</sub>B+p<sub>C</sub>C ≤ R</span></p>
          <p>Hicksien : <span class="formula">h(p<sub>B</sub>,p<sub>C</sub>,ū)</span> — panier qui minimise <span class="formula">p<sub>B</sub>B+p<sub>C</sub>C</span> sous <span class="formula">u(B,C)=ū</span></p>`
      },
      {

    const state = {
      phase: 0,
      income: 160,
      selectedIncome: 160,
      tangentIncome: 130,
      minimalIncomeFound: false,
      revealStep: 0,
      substitutionRevealStep: 0,
      slutskyPB1: 50,
      slutskyDP: 1,
      slutskyRevealStep: 0,
      slutskyEquationRevealStep: 0,
      slutskyIncomeRevealStep: 0,
      cobbPracticeStep: 1,
      cobbPracticeAttempts: 0,
      practiceChecked: false,
      practiceProgress: {}
    };

    const progress = document.querySelector("#progress");
    const statement = document.querySelector("#statement");
    const controls = document.querySelector("#controls");
    const feedback = document.querySelector("#feedback");
    const graphWrap = document.querySelector("#graphWrap");
    const graphTitle = document.querySelector("#graphTitle");
    const legend = document.querySelector("#legend");
    const jumpSelect = document.querySelector("#jumpSelect");
    const app = document.querySelector(".app");

    function utility(B, C) {
      return Math.sqrt(B * C);
    }

    function marginalUtilityB(B, C) {
      return 0.5 * Math.sqrt(C / B);
    }

    function marginalUtilityC(B, C) {
      return 0.5 * Math.sqrt(B / C);
    }

    function tms(B, C) {
      return marginalUtilityB(B, C) / marginalUtilityC(B, C);
    }

    function marshallianDemand(pB, pC, R) {
      return { b: R / (2 * pB), c: R / (2 * pC) };
    }

    function hicksianDemand(pB, pC, uBar) {
      return {
        b: uBar * Math.sqrt(pC / pB),
        c: uBar * Math.sqrt(pB / pC)
      };
    }

    function expenditure(pB, pC, uBar) {
      return 2 * uBar * Math.sqrt(pB * pC);
    }

    function formatNumber(value, digits = 2) {
      if (Math.abs(value - Math.round(value)) < 0.001) return String(Math.round(value));
      return value.toFixed(digits).replace(".", ",");
    }

    function noVisualMode(mode) {
      return [
        "cover",
        "end",
        "cobb-practice",
        "slutsky-total-derivative",
        "slutsky-substitution-derivative",
        "slutsky-income-loss",
        "slutsky-income-response",
        "slutsky-equation",
        "slutsky-general",
        "slutsky-signs"
      ].includes(mode);
    }

    function svgEl(name, attrs = {}) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
      return element;
    }

    function sx(B) {
      const inner = config.size - 2 * config.margin;
      return config.margin + (B / config.maxB) * inner;
    }

    function sy(C) {
      const inner = config.size - 2 * config.margin;
      return config.size - config.margin - (C / config.maxC) * inner;
    }

    function drawAxes(svg = graphWrap.currentSvg) {
      for (let b = 0; b <= config.maxB; b += 1) {
        svg.appendChild(svgEl("line", { x1: sx(b), y1: sy(0), x2: sx(b), y2: sy(config.maxC), stroke: "#d7e0e4", "stroke-width": 1 }));
      }
      for (let c = 0; c <= config.maxC; c += 1) {
        svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(c), x2: sx(config.maxB), y2: sy(c), stroke: "#d7e0e4", "stroke-width": 1 }));
      }
      svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(0), x2: sx(config.maxB), y2: sy(0), stroke: "#132536", "stroke-width": 2 }));
      svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(0), x2: sx(0), y2: sy(config.maxC), stroke: "#132536", "stroke-width": 2 }));
      for (let b = 0; b <= config.maxB; b += 2) {
        const label = svgEl("text", { x: sx(b), y: sy(0) + 24, fill: "#66747d", "font-size": 13, "text-anchor": "middle" });
        label.textContent = b;
        svg.appendChild(label);
      }
      for (let c = 0; c <= config.maxC; c += 2) {
        const label = svgEl("text", { x: sx(0) - 15, y: sy(c) + 4, fill: "#66747d", "font-size": 13, "text-anchor": "end" });
        label.textContent = c;
        svg.appendChild(label);
      }
      const bLabel = svgEl("text", { x: sx(config.maxB) - 6, y: sy(0) + 42, fill: "#132536", "font-size": 18, "font-weight": 700 });
      bLabel.textContent = "B";
      svg.appendChild(bLabel);
      const cLabel = svgEl("text", { x: sx(0) - 34, y: sy(config.maxC) + 5, fill: "#132536", "font-size": 18, "font-weight": 700 });
      cLabel.textContent = "C";
      svg.appendChild(cLabel);
    }

    function drawBudgetLine(pB, pC, R, color, label = "", dash = "none", width = 3, opacity = 1) {
      const bMax = R / pB;
      const cMax = R / pC;
      const b1 = Math.max(0, Math.min(config.maxB, bMax));
      const cAtB1 = (R - pB * b1) / pC;
      const c1 = Math.max(0, Math.min(config.maxC, cAtB1));
      const c2 = Math.max(0, Math.min(config.maxC, cMax));
      const bAtC2 = (R - pC * c2) / pB;
      const b2 = Math.max(0, Math.min(config.maxB, bAtC2));
      const line = svgEl("path", {
        d: `M ${sx(b2)} ${sy(c2)} L ${sx(b1)} ${sy(c1)}`,
        fill: "none",
        stroke: color,
        "stroke-width": width,
        "stroke-dasharray": dash,
        opacity
      });
      graphWrap.currentSvg?.appendChild(line);
      if (label) {
        const text = svgEl("text", { x: sx(Math.min(config.maxB - 0.4, Math.max(0.4, b1 - 0.25))), y: sy(Math.max(0.35, c1)) - 8, fill: color, "font-size": 15, "font-weight": 700, "text-anchor": "end" });
        text.textContent = label;
        graphWrap.currentSvg?.appendChild(text);
      }
    }

    function drawIndifferenceCurve(uBar, color, label = "", width = 3, dash = "none", opacity = 1) {
      const points = [];
      const minB = Math.max(0.25, (uBar * uBar) / config.maxC);
      const maxB = config.maxB;
      for (let b = minB; b <= maxB; b += 0.05) {
        const c = (uBar * uBar) / b;
        if (c <= config.maxC) points.push(`${sx(b)} ${sy(c)}`);
      }
      if (!points.length) return;
      graphWrap.currentSvg?.appendChild(svgEl("path", {
        d: `M ${points.join(" L ")}`,
        fill: "none",
        stroke: color,
        "stroke-width": width,
        "stroke-dasharray": dash,
        opacity
      }));
      if (label) {
        const b = Math.min(config.maxB - 1.4, Math.max(1.3, uBar * 1.15));
        const c = (uBar * uBar) / b;
        const text = svgEl("text", { x: sx(b) + 8, y: sy(c) - 8, fill: color, "font-size": 16, "font-weight": 700 });
        text.textContent = label;
        graphWrap.currentSvg?.appendChild(text);
      }
    }

    function drawCobbDouglasCurve(alpha, beta, uBar, color, label = "", width = 3, dash = "none", opacity = 1) {
      const points = [];
      for (let b = 0.25; b <= config.maxB; b += 0.05) {
        const c = Math.pow(uBar / Math.pow(b, alpha), 1 / beta);
        if (c <= config.maxC) points.push(`${sx(b)} ${sy(c)}`);
      }
      if (!points.length) return;
      graphWrap.currentSvg?.appendChild(svgEl("path", {
        d: `M ${points.join(" L ")}`,
        fill: "none",
        stroke: color,
        "stroke-width": width,
        "stroke-dasharray": dash,
        opacity
      }));
      if (label) {
        const b = Math.min(config.maxB - 1.8, Math.max(1.3, uBar * 1.1));
        const c = Math.pow(uBar / Math.pow(b, alpha), 1 / beta);
        const text = svgEl("text", { x: sx(b) + 8, y: sy(c) - 8, fill: color, "font-size": 16, "font-weight": 700 });
        text.textContent = label;
        graphWrap.currentSvg?.appendChild(text);
      }
    }

    function drawPoint(B, C, label, color, radius = 8) {
      graphWrap.currentSvg?.appendChild(svgEl("circle", { cx: sx(B), cy: sy(C), r: radius, fill: color, stroke: "white", "stroke-width": 3 }));
      if (label) {
        const text = svgEl("text", { x: sx(B) + 11, y: sy(C) - 10, fill: color, "font-size": 16, "font-weight": 700 });
        text.textContent = label;
        graphWrap.currentSvg?.appendChild(text);
      }
    }

    function drawArrow(from, to, color) {
      const id = `arrow-${color.replace("#", "")}`;
      if (!graphWrap.currentSvg.querySelector(`#${id}`)) {
        const defs = svgEl("defs");
        const marker = svgEl("marker", { id, viewBox: "0 0 10 10", refX: "8", refY: "5", markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse" });
        marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color }));
        defs.appendChild(marker);
        graphWrap.currentSvg.appendChild(defs);
      }
      graphWrap.currentSvg.appendChild(svgEl("line", { x1: sx(from.b), y1: sy(from.c), x2: sx(to.b), y2: sy(to.c), stroke: color, "stroke-width": 3, "marker-end": `url(#${id})` }));
    }

    function drawText(x, y, text, color = "#132536") {
      const node = svgEl("text", { x: sx(x), y: sy(y), fill: color, "font-size": 16, "font-weight": 700 });
      node.textContent = text;
      graphWrap.currentSvg?.appendChild(node);
    }

    function slutskyPoints(pB1 = config.newPB) {
      const x0 = marshallianDemand(config.oldPB, config.pC, config.income);
      const u0 = utility(x0.b, x0.c);
      const x1 = marshallianDemand(pB1, config.pC, config.income);
      const h1 = hicksianDemand(pB1, config.pC, u0);
      const e1 = expenditure(pB1, config.pC, u0);
      return { x0, u0, x1, h1, e1 };
    }

    function drawSlutskyGraph(mode) {
      const pB1 = mode === "slutsky-small-change" ? state.slutskyPB1 : config.newPB;
      const { x0, u0, x1, h1, e1 } = slutskyPoints(pB1);
      drawIndifferenceCurve(u0, "#176b52", "u0", 4);
      drawBudgetLine(config.oldPB, config.pC, config.income, "#b6483b", "", "none", 3);
      drawBudgetLine(pB1, config.pC, config.income, "#2156c5", "budget final", "none", 3);
      drawBudgetLine(pB1, config.pC, e1, "#c98c2d", "budget compensé", "8 5", 3);
      drawPoint(x0.b, x0.c, "x(p0,R)", "#b6483b", 8);
      drawPoint(h1.b, h1.c, "h(p1,u0)", "#c98c2d", 8);
      drawPoint(x1.b, x1.c, "x(p1,R)", "#2156c5", 8);
      drawArrow(x0, h1, "#c98c2d");
      drawArrow(h1, x1, "#2156c5");
    }

    function setFeedback(message, type = "ok") {
      feedback.textContent = message;
      feedback.classList.toggle("error", type === "error");
    }

    function tangentIncome() {
      return expenditure(config.pB, config.pC, config.uBar);
    }

    function createSvg() {
      graphWrap.innerHTML = "";
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${config.size} ${config.size}`);
      svg.setAttribute("aria-label", "Graphique fonction de dépense et demandes compensées");
      graphWrap.currentSvg = svg;
      drawAxes(svg);
      graphWrap.appendChild(svg);
      return svg;
    }

    function drawGraph() {
      if (noVisualMode(screens[state.phase].mode)) {
        graphWrap.innerHTML = "";
        graphWrap.currentSvg = null;
        return;
      }
      createSvg();
      const screen = screens[state.phase];
      const hOld = hicksianDemand(config.pB, config.pC, config.uBar);
      const eOld = expenditure(config.pB, config.pC, config.uBar);

      if (screen.mode === "parallel-slider") {
        [80, 120, 160, 200].forEach((R) => drawBudgetLine(config.pB, config.pC, R, "#9eb7ad", "", "6 6", 2, 0.7));
        drawBudgetLine(config.pB, config.pC, state.income, "#176b52", `R=${state.income}`, "none", 4);
        drawText(0.7, 10.2, "pB = 20, pC = 20, pente = -1");
      }

      if (screen.mode === "income-family") {
        [80, 120, 160, 220].forEach((R) => drawBudgetLine(config.pB, config.pC, R, R === state.selectedIncome ? "#176b52" : "#9eb7ad", R === state.selectedIncome ? `R=${R}` : "", R === state.selectedIncome ? "none" : "6 6", R === state.selectedIncome ? 4 : 2, R === state.selectedIncome ? 1 : 0.65));
      }

      if (["target-ci", "minimal-income", "hicksian", "expenditure", "program", "cobb-reveal", "marshall-hicks"].includes(screen.mode)) {
        drawIndifferenceCurve(config.uBar, "#176b52", "u(B,C)=ū=4", 4);
      }
      if (screen.mode === "cobb-practice") {
        const alpha = 1 / 3;
        const beta = 2 / 3;
        const b = config.uBar * Math.pow(config.pC / (2 * config.pB), beta);
        const c = config.uBar * Math.pow((2 * config.pB) / config.pC, alpha);
        const e = config.pB * b + config.pC * c;
        drawCobbDouglasCurve(alpha, beta, config.uBar, "#176b52", "u(B,C)=ū", 4);
        drawBudgetLine(config.pB, config.pC, e, "#c98c2d", "budget min.", "none", 4);
        drawPoint(b, c, "solution", "#c98c2d", 9);
      }

      if (screen.mode === "target-ci") {
        drawPoint(2, 8, "U=4", "#176b52", 7);
        drawPoint(4, 4, "U=4", "#176b52", 7);
        drawPoint(8, 2, "U=4", "#176b52", 7);
      }

      if (screen.mode === "minimal-income") {
        drawBudgetLine(config.pB, config.pC, 120, "#b6483b", "trop bas", "6 6", 2);
        drawBudgetLine(config.pB, config.pC, 220, "#2156c5", "plus haut", "6 6", 2);
        drawBudgetLine(config.pB, config.pC, state.tangentIncome, "#c98c2d", `R=${Math.round(state.tangentIncome)}`, "none", 4);
        if (state.minimalIncomeFound || Math.abs(state.tangentIncome - eOld) < 2) {
          drawPoint(hOld.b, hOld.c, `B=${formatNumber(hOld.b)}, C=${formatNumber(hOld.c)}`, "#c98c2d", 9);
          drawText(0.7, 10.2, `Avec pB=pC=20 et R=${Math.round(eOld)}, on atteint au mieux u=4`);
        }
      }

      if (["hicksian", "expenditure", "program", "cobb-reveal", "marshall-hicks"].includes(screen.mode)) {
        drawBudgetLine(config.pB, config.pC, eOld, "#c98c2d", `e=${Math.round(eOld)}`, "none", 4);
        drawPoint(hOld.b, hOld.c, `(${formatNumber(hOld.b)} ; ${formatNumber(hOld.c)})`, "#c98c2d", 9);
      }

      if (screen.mode === "expenditure") {
        drawText(0.7, 10.2, `e = 20×${formatNumber(hOld.b)} + 20×${formatNumber(hOld.c)} = ${Math.round(eOld)}`);
      }

      if (screen.mode === "marshall-hicks") {
        const rMarshall = 240;
        const x = marshallianDemand(config.pB, config.pC, rMarshall);
        drawIndifferenceCurve(utility(x.b, x.c), "#2156c5", `u=${formatNumber(utility(x.b, x.c))}`, 2, "6 4", 0.65);
        drawBudgetLine(config.pB, config.pC, rMarshall, "#2156c5", "R=240", "8 5", 3);
        drawPoint(x.b, x.c, "x(p,R)", "#2156c5", 8);
      }

      if (screen.mode === "substitution-link") {
        const x0 = marshallianDemand(config.oldPB, config.pC, config.income);
        const x1 = marshallianDemand(config.newPB, config.pC, config.income);
        const h1 = hicksianDemand(config.newPB, config.pC, utility(x0.b, x0.c));
        const e1 = expenditure(config.newPB, config.pC, utility(x0.b, x0.c));
        const step = state.substitutionRevealStep;
        drawIndifferenceCurve(utility(x0.b, x0.c), "#176b52", "u0=4", 4);

      } else if (screen.mode === "cobb-practice") {

        let stepHtml = "";

          const hint2 = state.cobbPracticeAttempts >= 2

              <p><span class="formula">C<sup>h</sup>=ū(2p<sub>B</sub>/p<sub>C</sub>)<sup>1/3</sup></span></p>
              <div class="button-row" style="margin-top:10px;"><button data-action="restart-practice">Recommencer l'exercice</button></div>
            </div>`;
        }
        controls.innerHTML = `${done}${stepHtml}${nav}`;
        const hasPB = (v) => v.includes("p_b") || v.includes("pb");
        const hasPC = (v) => v.includes("p_c") || v.includes("pc");
        const hasLambda = (v) => v.includes("λ") || v.includes("lambda");

          const focLOk = (focL.includes("u") || focL.includes("ū")) && focL.includes("b") && focL.includes("c") && focL.includes("1/3") && focL.includes("2/3");
          if (focBOk && focCOk && focLOk) {
            stepFb("#focFb", "Correct. Deux conditions de prix égalent chaque prix à λ × UM, la troisième impose ū = u(B,C).");
            setTimeout(() => { state.cobbPracticeStep = 5; update(); }, 1000);
          } else if (!focLOk) {
            stepFb("#focFb", "∂L/∂λ = 0 doit redonner la contrainte : ū = B^(1/3)C^(2/3).", false);
          } else if (!focBOk) {
            stepFb("#focFb", "∂L/∂B : p_B = λ(1/3)B^(-2/3)C^(2/3). Attention à l'exposant -2/3 sur B.", false);
          } else {
            stepFb("#focFb", "∂L/∂C : p_C = λ(2/3)B^(1/3)C^(-1/3). Attention à l'exposant -1/3 sur C.", false);
          }
        });
        const correctionHtml = `
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
            <p><strong>Correction</strong></p>
            <p>Tangence (CPO 1 ÷ CPO 2) : <span class="formula">C=2(p<sub>B</sub>/p<sub>C</sub>)B</span></p>
            <p>Substitution dans ū = B<sup>1/3</sup>C<sup>2/3</sup> :</p>
            <p><span class="formula">B<sup>1/3</sup>[2(p<sub>B</sub>/p<sub>C</sub>)B]<sup>2/3</sup>=ū → B·(2p<sub>B</sub>/p<sub>C</sub>)<sup>2/3</sup>=ū</span></p>
            <p><span class="formula">B<sup>h</sup>=ū(p<sub>C</sub>/(2p<sub>B</sub>))<sup>2/3</sup></span> &nbsp; <span class="formula">C<sup>h</sup>=ū(2p<sub>B</sub>/p<sub>C</sub>)<sup>1/3</sup></span></p>
          </div>`;
        controls.querySelector("[data-action='check-demands']")?.addEventListener("click", () => {
          const bhVal = controls.querySelector("#bhInput")?.value || "";
          const chVal = controls.querySelector("#chInput")?.value || "";
          const bh = bhVal.toLowerCase().replace(/\s+/g, "");
          const ch = chVal.toLowerCase().replace(/\s+/g, "");
          const bhOk = (bh.includes("u") || bh.includes("ū")) && (bh.includes("p_c/(2p_b)") || bh.includes("pc/(2pb)")) && (bh.includes("2/3") || bh.includes("0.666"));
          const chOk = (ch.includes("u") || ch.includes("ū")) && (ch.includes("2p_b/p_c") || ch.includes("2pb/pc")) && (ch.includes("1/3") || ch.includes("0.333"));
          if (bhOk && chOk) {
            stepFb("#demandsFb", "Excellent ! Vous avez dérivé les demandes compensées pour cette Cobb-Douglas.");
            state.cobbPracticeAttempts = 0;
            setTimeout(() => { state.cobbPracticeStep = 6; update(); }, 1000);
          } else {
            state.cobbPracticeAttempts++;
            let errMsg;
            if (!bhOk && !chOk) errMsg = "Pas encore juste. Consultez les indices ci-dessus et réessayez.";
            else if (!bhOk) errMsg = "C^h semble bon — revérifiez B^h : substituez la tangence dans ū = B^(1/3)C^(2/3).";
            else errMsg = "B^h semble bon — revérifiez C^h : reportez B^h dans la relation de tangence.";
            update();
            const newBhEl = controls.querySelector("#bhInput");
            const newChEl = controls.querySelector("#chInput");
            if (newBhEl) newBhEl.value = bhVal;
            if (newChEl) newChEl.value = chVal;
            stepFb("#demandsFb", errMsg, false);
          }
        });
        controls.querySelector("[data-action='show-correction']")?.addEventListener("click", () => {
          const box = controls.querySelector("#correctionBox");
          if (box) { box.innerHTML = correctionHtml; setFeedback("Correction affichée."); }

        controls.querySelector("[data-action='restart-practice']")?.addEventListener("click", () => {

          state.cobbPracticeAttempts = 0;
          update();
        });
      } else if (screen.mode === "substitution-link") {

        const u0 = utility(x0.b, x0.c);
        const h1 = hicksianDemand(config.newPB, config.pC, u0);
        const e1 = expenditure(config.newPB, config.pC, u0);
        const steps = [
          `<p><strong>1. Situation initiale</strong></p>
           <p>Au départ, <span class="formula">p<sub>B</sub><sup>0</sup>=20</span>, <span class="formula">p<sub>C</sub>=20</span> et <span class="formula">R=160</span>.</p>
           <p>La demande marshallienne donne le panier initial :</p>
           <p><span class="formula">x(p<sup>0</sup>,R)=(${formatNumber(x0.b)} ; ${formatNumber(x0.c)})</span></p>
           <p>Le niveau de satisfaction atteint est <span class="formula">u<sub>0</sub>=${formatNumber(u0)}</span>.</p>`,
          `<p><strong>2. Le prix de B augmente</strong></p>
           <p>Le prix passe de <span class="formula">p<sub>B</sub><sup>0</sup>=20</span> à <span class="formula">p<sub>B</sub><sup>1</sup>=50</span>.</p>
           <p>À revenu inchangé, le pouvoir d'achat baisse : la nouvelle droite de budget pivote vers l'intérieur.</p>`,
          `<p><strong>3. Question de l'effet de substitution</strong></p>
           <p>Quel aurait été mon choix si les prix avaient changé, mais si mon pouvoir d'achat, mesuré par le niveau de satisfaction atteint, n'avait pas changé ?</p>
           <p>On garde donc <span class="formula">u<sub>0</sub></span> et on utilise les nouveaux prix :</p>
           <p><span class="formula">h(p<sup>1</sup>,u<sub>0</sub>)</span> — panier qui minimise <span class="formula">p<sub>B</sub><sup>1</sup>B+p<sub>C</sub>C</span> sous <span class="formula">u(B,C)=u<sub>0</sub></span>.</p>
           <p>Graphiquement, c'est la droite compensée, parallèle à la nouvelle droite de budget, qui atteint juste l'ancienne courbe d'indifférence.</p>`,
          `<p><strong>4. Panier compensé</strong></p>
           <p>La demande hicksienne au nouveau prix est :</p>
           <p><span class="formula">h(p<sup>1</sup>,u<sub>0</sub>)=(${formatNumber(h1.b)} ; ${formatNumber(h1.c)})</span></p>

           <p><span class="formula">h(p<sup>1</sup>,u<sub>0</sub>) - x(p<sup>0</sup>,R)</span></p>

           <p>À retenir : l'effet de substitution va toujours dans le même sens. Quand le prix relatif d'un bien augmente, l'effet de substitution implique toujours une diminution de la consommation de ce bien.</p>`,
          `<p><strong>6. Effet revenu</strong></p>
           <p>Le choix final avec les nouveaux prix et le revenu réel est :</p>

           <p>L'effet revenu compare le panier compensé au panier final :</p>

           <p>L'effet revenu peut être négatif ou positif. Si le bien est normal, la baisse du pouvoir d'achat réduit sa consommation : l'effet revenu est négatif. Si le bien est inférieur, la baisse du pouvoir d'achat augmente sa consommation : l'effet revenu est positif.</p>
           <p>Ici, avec Cobb-Douglas, B est un bien normal : la perte de pouvoir d'achat réduit encore la consommation de B.</p>`,
          `<p><strong>7. Décomposition</strong></p>
           <p><span class="formula">effet total = x(p<sup>1</sup>,R)-x(p<sup>0</sup>,R)</span></p>

      } else if (screen.mode === "slutsky-differences") {

    function updateProgress() {
      progress.innerHTML = screens.map((screen, index) => {
        const status = index < state.phase ? "done" : index === state.phase ? "current" : "";
        return `<div class="progress-step ${status}">${screen.short}</div>`;
      }).join("");
    }

      const items = [];
      if (["target-ci", "minimal-income", "hicksian", "expenditure", "program", "cobb-reveal", "cobb-practice", "marshall-hicks", "substitution-link"].includes(mode)) {
        items.push(["#176b52", "Courbe d'indifférence cible"]);
      }
      if (["parallel-slider", "income-family"].includes(mode)) {
        items.push(["#2156c5", "Droite de budget"]);
      }
      if (mode === "marshall-hicks") {
        items.push(["#c98c2d", "Budget hicksien (min dépense, ū=4)"]);
        items.push(["#2156c5", "Budget marshallien (R=240)"]);
      }
      if (["minimal-income", "hicksian", "expenditure", "program", "cobb-reveal", "cobb-practice", "substitution-link"].includes(mode)) {
        items.push(["#c98c2d", "Budget compensé"]);
      }
      if (mode === "substitution-link") {
        items.push(["#b6483b", "Panier initial"]);
        items.push(["#2156c5", "Panier final"]);

        items.push(["#2156c5", "Effet revenu"]);

    function updateNavBar() {
      const screen = screens[state.phase];
      const navBar = document.querySelector("#navBar");
      if (screen.mode === "cover") {
        navBar.innerHTML = "";
        return;
      }
      if (screen.mode === "cobb-practice") {
        const ps = state.cobbPracticeStep;
        navBar.innerHTML = `<button id="navStepBack" title="Étape précédente">↑</button><button id="navStepFwd" title="Étape suivante">↓</button>`;
        navBar.querySelector("#navStepBack").addEventListener("click", () => {
          if (ps > 1) { state.cobbPracticeStep = ps - 1; state.cobbPracticeAttempts = 0; update(); }
        });
        navBar.querySelector("#navStepFwd").addEventListener("click", () => {
          if (ps < 6) { state.cobbPracticeStep = ps + 1; update(); }
        });
        return;
      }
      if (screen.mode === "end") {
        navBar.innerHTML = `<button id="navBack">←</button><button class="primary" id="navNext">↺</button>`;
      } else {
        navBar.innerHTML = `<button id="navBack">←</button><button id="navNext">→</button>`;
      }
      navBar.querySelector("#navBack")?.addEventListener("click", previous);
      navBar.querySelector("#navNext")?.addEventListener("click", next);
    }

    function renderScreen(index) {
      state.phase = Math.max(0, Math.min(screens.length - 1, index));
      const screen = screens[state.phase];
      document.querySelector(".jump-nav").style.display = screen.mode === "cover" ? "none" : "";
      app.classList.toggle("no-visual", noVisualMode(screen.mode));
      graphTitle.textContent = screen.title;
      statement.innerHTML = screen.html;
      jumpSelect.value = String(state.phase);
      setFeedback(feedbackForMode(screen.mode));
      updateProgress();
      updateLegend();
      renderControls();
      updateNavBar();
      drawGraph();
    }

    function update() {
      renderScreen(state.phase);
    }

    function next() {
      if (state.phase === screens.length - 1) {
        state.phase = 0;
        state.revealStep = 0;
        state.substitutionRevealStep = 0;
        state.minimalIncomeFound = false;
      } else {
        state.phase += 1;
      }
      update();
    }

    function previous() {
      state.phase = Math.max(0, state.phase - 1);
      update();
    }

    function initJumpSelect() {
      jumpSelect.innerHTML = screens.map((screen, index) => `<option value="${index}">${index + 1}. ${screen.title}</option>`).join("");
      jumpSelect.addEventListener("change", () => renderScreen(Number(jumpSelect.value)));
    }

    initJumpSelect();
    update();
  </script>
<button id="ttsToggle" type="button"></button>
<script>
(function(){
  const synth=window.speechSynthesis;
  let voice=null,enabled=localStorage.getItem('tts')!=='0';
  const pick=()=>{const fr=synth.getVoices().filter(v=>v.lang.startsWith('fr'));voice=fr.find(v=>/neural|online/i.test(v.name))||fr.find(v=>/denise|thomas|paul|hortense|amelie|juliette|marie|pierre/i.test(v.name))||fr[0]||null;};
  pick();synth.addEventListener('voiceschanged',pick);
  const speak=t=>{if(!enabled)return;synth.cancel();const s=(t||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();if(!s)return;const u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=0.88;u.pitch=1.05;if(voice)u.voice=voice;synth.speak(u);};
  const upd=()=>{const b=document.getElementById('ttsToggle');if(!b)return;b.classList.toggle('tts-active',enabled);const lbl=enabled?'Désactiver la voix':'Activer la voix';b.title=lbl;b.setAttribute('aria-label',lbl);b.innerHTML=enabled?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';};
  document.getElementById('ttsToggle').addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('tts',enabled?'1':'0');if(!enabled)synth.cancel();upd();});
  upd();
  const el=document.querySelector('#statement');
  if(el){let tid=0;new MutationObserver(()=>{clearTimeout(tid);tid=setTimeout(()=>{speak(el.innerText||'');},80);}).observe(el,{childList:true,subtree:true,characterData:true});}
})();
</script>
<div id="pgHUD"><span class="pg-sc">🏆 <span id="pgScore">0</span></span><span class="pg-sep">│</span><span class="pg-pr">⚡ <span id="pgPrec">0</span></span></div>
<div id="pgOverlay"></div>
<script>
(function(){
var MID='7';
var MODS=[{id:'1a',n:'Préférences'},{id:'2',n:'Contrainte de budget'},{id:'2b',n:'Exercice budget'},{id:'3',n:'Choix sous contrainte'},{id:'4',n:'Substitution & revenu'},{id:'5',n:'Typologies de biens'},{id:'6',n:"Fonction d'utilité"},{id:'7',n:'Demandes compensées'},{id:'8',n:'Choix intertemporel'}];
function ld(id){try{return JSON.parse(localStorage.getItem('prg_'+id)||'{}')}catch(e){return{}}}
function sv(id,d){try{localStorage.setItem('prg_'+id,JSON.stringify(d))}catch(e){}}
var sc=0,pr=0,tried=false;
function upd(){var a=document.getElementById('pgScore'),b=document.getElementById('pgPrec');if(a)a.textContent=sc;if(b)b.textContent=pr;}
var P={
  wrong:function(){tried=true;},
  correct:function(){sc++;if(!tried)pr++;tried=false;var d=ld(MID);d.score=Math.max(d.score||0,sc);d.prec=Math.max(d.prec||0,pr);d.seen=true;sv(MID,d);upd();},
  nav:function(){tried=false;}
};
(function(){var d=ld(MID);d.seen=true;sv(MID,d);})();
var st=(typeof state!=='undefined'&&state&&state.answered instanceof Set)?state:(typeof S!=='undefined'&&S&&S.answered instanceof Set)?S:null;
if(st){var _a=st.answered.add.bind(st.answered);st.answered.add=function(k){if(!st.answered.has(k))P.correct();return _a(k);};}
var fb=document.getElementById('feedback')||document.querySelector('.feedback');
if(fb){new MutationObserver(function(){if(fb.classList.contains('error')||fb.classList.contains('err'))P.wrong();}).observe(fb,{attributes:true,attributeFilter:['class']});}
var nr=document.querySelector('#narration,#statement,#narrationBox');
if(nr){var nt=0;new MutationObserver(function(){clearTimeout(nt);nt=setTimeout(function(){P.nav();},150);}).observe(nr,{childList:true,subtree:true,characterData:true});}
var others=MODS.filter(function(m){return m.id!==MID&&ld(m.id).seen;});
if(others.length){var ov=document.getElementById('pgOverlay');if(ov){
  var rows=others.map(function(m){var d=ld(m.id);return '<div class="pg-row"><span class="pg-mod-name">'+m.n+'</span><span class="pg-mod-pts"><span class="s">'+(d.score||0)+'</span> pts · <span class="p">'+(d.prec||0)+'</span> préc.</span></div>';}).join('');
  ov.innerHTML='<div class="pg-card"><h3>📊 Votre progression</h3>'+rows+'<button id="pgClose" class="primary" type="button" style="width:100%;margin-top:8px">Commencer →</button></div>';
  ov.style.display='flex';
  document.getElementById('pgClose').addEventListener('click',function(){ov.style.display='none';});
}}
upd();
})();
</script>
</body>
