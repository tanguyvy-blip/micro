<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3. le choix sous contrainte</title>
  <style>
    :root {
      --paper: #f8f5ed;
      --panel: #fffdf8;
      --ink: #132536;
      --muted: #66747d;
      --line: #e4e2dc;
      --green: #176b52;
      --blue: #1737ff;
      --red: #b6483b;
      --gold: #c98c2d;
      --soft: #edf3f0;
      --button: #e8edf0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.45;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(300px, 34%) 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 22px;
      padding: 24px;
      overflow: hidden;
    }

    .progress-strip {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
      overflow-x: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 253, 248, 0.92);
      box-shadow: 0 10px 26px rgba(19, 37, 54, 0.04);
    }

    .progress-step {
      flex: 1 1 0;
      min-width: 0;
      padding: 7px 13px;
      border: 1px solid #d6ded9;
      border-radius: 10px;
      background: #fbfaf5;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      white-space: normal;
    }

    .progress-step.done {
      color: var(--green);
      background: #edf6f2;
    }

    .progress-step.current {
      color: white;
      background: var(--green);
      border-color: var(--green);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(19, 37, 54, 0.06);
      min-height: 0;
      overflow: hidden;
    }

    .app > .panel:first-child {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    h1, h2 {
      margin: 0 0 18px;
      color: #5f6e77;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 30px;
    }

    .narration-text {
      min-height: 270px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffefa;
      font-size: 25px;
      overflow: auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 22px;
    }

    .btn-dev {
      font-size: 13px;
      padding: 5px 13px;
      background: transparent;
      border: 1px dashed #b0b8bc;
      color: var(--muted);
      border-radius: 999px;
      font-family: Georgia, serif;
      font-weight: 700;
      cursor: pointer;
      align-self: center;
    }

    .btn-dev.on {
      border-color: var(--gold);
      color: var(--gold);
      background: #fdf6e3;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      color: var(--ink);
      background: var(--button);
      font: 700 20px Georgia, "Times New Roman", serif;
      cursor: pointer;
    }

    button.primary {
      background: var(--green);
      color: white;
    }

    button.action-focus {
      box-shadow: 0 0 0 4px rgba(23, 107, 82, 0.18), 0 10px 24px rgba(23, 107, 82, 0.22);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    select {
      min-width: 150px;
      border: 1px solid #cfd8dc;
      border-radius: 12px;
      padding: 12px 14px;
      background: white;
      color: var(--ink);
      font: 700 20px Georgia, "Times New Roman", serif;
    }

    .score-card {
      margin-top: 18px;
      padding: 16px 18px;
      border: 1px solid #d5e0dc;
      border-radius: 14px;
      background: #f5f9f7;
      display: none;
    }

    .score-card.visible {
      display: block;
    }

    .score-title {
      color: var(--green);
      font-weight: 700;
      font-size: 21px;
      margin-bottom: 10px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: white;
      border: 1px solid #dfe8e4;
    }

    .score-label {
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .score-value {
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.05;
    }

    .main {
      display: grid;
      gap: 18px;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
    }

    .main.no-exercise {
      grid-template-rows: minmax(0, 1fr);
    }

    .main.no-exercise .interaction {
      display: none;
    }

    .main > .panel:first-child {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
    }

    .stage {
      min-height: 0;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .interaction {
      min-height: 150px;
      max-height: 31vh;
      overflow: auto;
    }

    .interaction.titleless h2 {
      display: none;
    }

    .interaction.action-focus {
      border-color: rgba(23, 107, 82, 0.55);
      box-shadow: 0 0 0 4px rgba(23, 107, 82, 0.12), 0 18px 38px rgba(23, 107, 82, 0.12);
    }

    .action-hint {
      margin: -2px 0 12px;
      padding: 9px 13px;
      border: 1px solid #c9d8d2;
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      color: var(--green);
      background: #edf6f2;
      font-size: 17px;
      font-weight: 700;
    }

    .interaction.action-focus h2 {
      color: var(--green);
      font-weight: 700;
    }

    .graph-wrap {
      width: min(980px, 100%);
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .banner,
    .formula-card {
      width: 100%;
      padding: 18px 22px;
      border: 1px solid #d5e0dc;
      border-radius: 14px;
      background: var(--soft);
    }

    .banner {
      color: var(--green);
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    .formula-card {
      background: #fbfaf5;
    }

    .formula {
      margin-top: 10px;
      color: var(--green);
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .exercise-statement {
      width: min(880px, 100%);
      display: grid;
      gap: 14px;
    }

    .token-build {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid #cfd8dc;
      border-radius: 14px;
      background: white;
      min-height: 74px;
    }

    .token-slot {
      min-width: 52px;
      min-height: 44px;
      display: inline-grid;
      place-items: center;
      padding: 8px 12px;
      border: 2px dashed #a8bbc3;
      border-radius: 10px;
      color: var(--green);
      font-weight: 700;
      background: #f5fbf8;
    }

    .token-palette,
    .small-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .token-palette button {
      min-width: 58px;
      padding: 10px 16px;
    }

    .note-box {
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid #d5e0dc;
      border-radius: 12px;
      background: #fbfaf5;
      color: var(--muted);
      font-size: 18px;
    }

    .draw-mode {
      outline: 3px solid rgba(23, 107, 82, 0.22);
    }

    .result-summary {
      width: min(940px, 100%);
      display: grid;
      gap: 22px;
    }

    .result-highlight {
      justify-self: start;
      padding: 30px;
      border: 1px solid #c9d8d2;
      border-left: 10px solid var(--green);
      border-radius: 16px;
      background: linear-gradient(90deg, #edf6f2 0%, #fbfaf5 100%);
      box-shadow: 0 20px 42px rgba(34, 55, 64, 0.08);
    }

    .result-highlight .result-label {
      color: var(--green);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .result-highlight .result-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr);
      gap: 24px;
      align-items: center;
    }

    .result-highlight .result-statement {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.28;
    }

    .result-highlight .equation-stack .formula-card {
      background: rgba(255, 255, 255, 0.72);
      border-color: #c9d8d2;
      box-shadow: 0 10px 22px rgba(34, 55, 64, 0.06);
    }

    .cover-page {
      width: min(880px, 100%);
      display: grid;
      gap: 22px;
      padding: 34px;
      border: 1px solid #c9d8d2;
      border-radius: 18px;
      background: #fffefa;
    }

    .cover-author {
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
    }

    .cover-title {
      color: var(--green);
      font-size: 42px;
      font-weight: 700;
      line-height: 1.15;
    }

    .cover-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 24px;
      font-size: 24px;
    }

    .result-statement {
      padding: 28px 32px;
      border: 1px solid #c9d8d2;
      border-radius: 16px;
      background: #edf6f2;
      color: var(--green);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
    }

    .equation-stack {
      display: grid;
      gap: 12px;
    }

    .frac {
      display: inline-grid;
      grid-template-rows: auto auto;
      align-items: center;
      line-height: 1;
      vertical-align: middle;
      margin: 0 3px;
    }

    .frac .top {
      border-bottom: 2px solid currentColor;
      padding: 0 5px 3px;
    }

    .frac .bottom {
      padding: 3px 5px 0;
    }

    .choice-prompt {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .feedback {
      min-height: 34px;
      margin-top: 14px;
      color: var(--green);
      font-weight: 700;
    }

    svg {
      width: min(680px, 100%, 68vh);
      height: auto;
      border: 1px solid #d5e0dc;
      border-radius: 16px;
      background: #f7fafb;
      touch-action: manipulation;
    }

    svg.zoomed-graph {
      width: 100%;
      max-height: 660px;
    }

    .graph-wrap.zoomed-wrap {
      width: 100%;
      justify-items: stretch;
    }

    .graph-wrap.zoomed-wrap #graphMount {
      width: 100%;
      display: grid;
      justify-items: stretch;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(0, 1fr);
        padding: 14px;
      }

      .narration-text {
        min-height: 190px;
      }
    }

    @media (max-height: 850px) {
      body {
        font-size: 18px;
      }

      .app {
        gap: 14px;
        padding: 14px;
      }

      .progress-strip {
        padding: 6px;
        gap: 6px;
      }

      .progress-step {
        padding: 6px 10px;
        font-size: 14px;
      }

      .panel {
        padding: 16px;
      }

      h1, h2 {
        margin-bottom: 10px;
        font-size: 24px;
      }

      .narration-text {
        min-height: 180px;
        padding: 18px;
        font-size: 21px;
      }

      .controls {
        gap: 10px;
        margin-top: 14px;
      }

      button {
        padding: 9px 16px;
        font-size: 17px;
      }

      select {
        padding: 9px 12px;
        font-size: 17px;
      }

      .score-card {
        margin-top: 12px;
      }

      .score-card {
        padding: 12px 14px;
      }

      .score-title {
        margin-bottom: 8px;
        font-size: 18px;
      }

      .score-item {
        padding: 8px 10px;
      }

      .score-value {
        font-size: 23px;
      }

      .main {
        gap: 12px;
      }

      .interaction {
        min-height: 128px;
        max-height: 28vh;
      }

      .banner,
      .formula-card {
        padding: 12px 16px;
      }

      .banner {
        font-size: 22px;
      }

      .choice-prompt {
        margin-bottom: 10px;
        font-size: 20px;
      }

      .feedback {
        margin-top: 10px;
        min-height: 26px;
      }

      svg {
        width: min(610px, 100%, 62vh);
      }
    }

    @media (max-height: 720px) {
      .app {
        gap: 10px;
        padding: 10px;
      }

      .progress-step {
        padding: 5px 9px;
        font-size: 13px;
      }

      .panel {
        padding: 12px;
        border-radius: 14px;
      }

      h1, h2 {
        font-size: 21px;
        margin-bottom: 8px;
      }

      .narration-text {
        min-height: 150px;
        padding: 14px;
        font-size: 18px;
      }

      .controls {
        margin-top: 10px;
      }

      .score-card {
        padding: 10px;
      }

      .score-title {
        display: none;
      }

      .score-label {
        font-size: 13px;
      }

      .score-value {
        font-size: 20px;
      }

      .interaction {
        min-height: 112px;
        max-height: 26vh;
      }

      .graph-wrap {
        gap: 8px;
      }

      .result-statement {
        padding: 18px 22px;
        font-size: 24px;
      }

      .cover-page {
        gap: 14px;
        padding: 22px;
      }

      .cover-title {
        font-size: 32px;
      }

      .cover-list {
        font-size: 20px;
      }

      .formula {
        font-size: 23px;
      }

      .token-build {
        min-height: 58px;
        padding: 10px 12px;
      }

      .token-slot {
        min-height: 36px;
        padding: 6px 10px;
      }

      svg {
        width: min(540px, 100%, 58vh);
      }
    }

    @media (max-width: 480px) {
      .app {
        gap: 8px;
        padding: 8px;
      }

      .narration-text {
        min-height: 120px;
        padding: 12px;
        font-size: 17px;
      }

      .panel {
        padding: 10px;
      }

      h1, h2 {
        font-size: 18px;
        margin-bottom: 6px;
      }

      button {
        padding: 8px 14px;
        font-size: 16px;
      }

      .interaction {
        min-height: 100px;
        max-height: 34vh;
      }

      .choice-prompt {
        font-size: 17px;
        margin-bottom: 8px;
      }

      .banner {
        font-size: 18px;
        padding: 10px 12px;
      }

      .formula {
        font-size: 20px;
      }

      svg {
        width: min(460px, 100%, 52vh);
      }
    }

    .context-diagram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 28px;
    }

    .context-box {
      width: 200px;
      border-radius: 16px;
      padding: 20px 18px;
      text-align: center;
      border: 2px solid var(--line);
      background: #fbfaf5;
    }

    .context-box.done {
      border-color: #a8d4c2;
      background: #edf6f2;
    }

    .context-box.upcoming {
      opacity: 0.5;
    }

    .context-tag {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .context-box.done .context-tag { color: var(--green); }

    .context-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .context-sub {
      font-size: 16px;
      color: var(--muted);
      font-style: italic;
    }

    .context-op {
      font-size: 36px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }

    .nav-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(19, 37, 54, 0.28);
      z-index: 999;
    }

    .nav-panel {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(19, 37, 54, 0.18);
      padding: 22px;
      z-index: 1000;
      max-height: 80vh;
      overflow-y: auto;
      width: min(380px, 92vw);
    }

    .nav-panel-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    .nav-panel-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 13px;
      margin-bottom: 4px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      font: 400 17px Georgia, serif;
      cursor: pointer;
    }

    .nav-panel-item:hover { background: var(--soft); }

    .nav-panel-item.nav-current {
      background: #edf6f2;
      color: var(--green);
      border-color: #c0ddd4;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="navBackdrop" class="nav-backdrop"></div>
  <div id="navPanel" class="nav-panel">
    <div class="nav-panel-title">Aller à la diapositive</div>
    <div id="navPanelItems"></div>
  </div>
  <main class="app">
    <nav id="progressStrip" class="progress-strip" aria-label="Progression dans la séquence"></nav>

    <section class="panel">
      <h1 id="sequenceTitle">Progression</h1>
      <div id="narration" class="narration-text"></div>
      <div class="controls">
        <button id="backButton" type="button">Retour</button>
        <button id="nextButton" class="primary" type="button">Suivant</button>
        <button id="devSkipButton" class="btn-dev" type="button" title="Avancer sans répondre (dev)">dev →</button>
        <button id="navJumpButton" class="btn-dev" type="button" title="Aller à une diapositive">↗ aller à</button>
      </div>
      <div id="scoreCard" class="score-card" aria-live="polite">
        <div class="score-title">Score</div>
        <div class="score-grid">
          <div class="score-item">
            <div class="score-label">Réussites</div>
            <div id="progressScore" class="score-value">0</div>
          </div>
          <div class="score-item">
            <div class="score-label">Du premier coup</div>
            <div id="precisionScore" class="score-value">0</div>
          </div>
        </div>
      </div>
    </section>

    <section class="main">
      <section class="panel">
        <div id="stage" class="stage"></div>
      </section>
      <section class="panel interaction">
        <h2>Exercice</h2>
        <div id="actionHint" class="action-hint"></div>
        <div id="interaction"></div>
        <div id="feedback" class="feedback"></div>
      </section>
    </section>
  </main>

  <script>
    const state = {
      step: 0,
      answered: new Set(),
      completedChallenges: new Set(),
      missedChallenges: new Set(),
      activeChallenge: null,
      score: {
        progress: 0,
        precision: 0
      }
    };

    const config = {
      max: 10,
      size: 460,
      margin: 54,
      income: 100,
      pB: 10,
      pC: 20
    };

    const target = { b: 5, c: 2.5 };
    const interiorPoint = { b: 2, c: 2 };
    const boundaryPoint = { b: 2, c: 4 };

    const narration = document.getElementById("narration");
    const stage = document.getElementById("stage");
    const interaction = document.getElementById("interaction");
    const feedback = document.getElementById("feedback");
    const mainPanel = document.querySelector(".main");
    const interactionPanel = document.querySelector(".panel.interaction");
    const interactionTitle = interactionPanel.querySelector("h2");
    const actionHint = document.getElementById("actionHint");
    const sequenceTitle = document.getElementById("sequenceTitle");
    const progressStrip = document.getElementById("progressStrip");
    const backButton = document.getElementById("backButton");
    const nextButton = document.getElementById("nextButton");
    const progressScore = document.getElementById("progressScore");
    const precisionScore = document.getElementById("precisionScore");
    const scoreCard = document.getElementById("scoreCard");
    const devSkipButton = document.getElementById("devSkipButton");
    const navJumpButton = document.getElementById("navJumpButton");
    const navBackdrop = document.getElementById("navBackdrop");
    const navPanel = document.getElementById("navPanel");
    const navPanelItems = document.getElementById("navPanelItems");

    const steps = [
      {
        text: "Ce module porte sur le choix du consommateur sous contrainte. Nous allons comprendre comment le choix se fait en mettant en relation la contrainte budgétaire et les préférences.",
        render: renderCoverPage
      },
      {
        text: "Nous réunissons maintenant les deux éléments vus précédemment : les préférences, représentées par des courbes d'indifférence, et la contrainte de budget. Le consommateur choisira le panier qu'il préfère parmi ceux qu'il peut atteindre.",
        render: renderIntro
      },
      {
        text: "Commençons avec un panier situé à l'intérieur de l'ensemble de budget. Il est atteignable, mais cela suffit-il pour être le panier choisi ?",
        render: renderInteriorQuestion,
        gate: () => state.answered.has("dominatesInterior")
      },
      {

    const stepLabels = [
      "Présentation",
      "Préférences et budget",
      "Panier intérieur",
      "Tout le budget",
      "Sur la contrainte",
      "Tangence",

    ];

    const progressSections = [
      { label: "Découvrir", from: 0, to: 1 },
      { label: "Budget et choix", from: 2, to: 6 },
      { label: "TMS", from: 7, to: 9 },
      { label: "Choix de coin", from: 10, to: 11 },

    function renderProgressStrip() {
      progressStrip.innerHTML = progressSections.map((section, index) => {
        const status = state.step >= section.from && state.step <= section.to
          ? "current"
          : state.step > section.to
            ? "done"
            : "";
        return `<span class="progress-step ${status}">${index + 1}. ${section.label}</span>`;
      }).join("");
    }

    function sx(x) {
      const inner = config.size - 2 * config.margin;
      return config.margin + (x / config.max) * inner;
    }

    function sy(y) {
      const inner = config.size - 2 * config.margin;
      return config.size - config.margin - (y / config.max) * inner;
    }

    function toUnitX(pixelX) {
      const inner = config.size - 2 * config.margin;
      return Math.max(0, Math.min(config.max, ((pixelX - config.margin) / inner) * config.max));
    }

    function toUnitY(pixelY) {
      const inner = config.size - 2 * config.margin;
      return Math.max(0, Math.min(config.max, ((config.size - config.margin - pixelY) / inner) * config.max));
    }

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function appendSvgPriceSymbol(parent, good) {
      const p = svgEl("tspan", {});
      p.textContent = "p";
      parent.appendChild(p);
      const sub = svgEl("tspan", { "baseline-shift": "sub", "font-size": "70%" });
      sub.textContent = good;
      parent.appendChild(sub);
    }

    function setSvgMathText(element, text) {
      element.textContent = "";
      const re = /pB|pC/g;
      let lastIndex = 0;
      String(text).replace(re, (match, offset) => {
        if (offset > lastIndex) {
          const plain = svgEl("tspan", {});
          plain.textContent = text.slice(lastIndex, offset);
          element.appendChild(plain);
        }
        appendSvgPriceSymbol(element, match.includes("B") ? "B" : "C");
        lastIndex = offset + match.length;
        return match;
      });
      if (lastIndex < text.length) {
        const plain = svgEl("tspan", {});
        plain.textContent = text.slice(lastIndex);
        element.appendChild(plain);
      }
    }

    function budgetC(b) {
      return (config.income - config.pB * b) / config.pC;
    }

    function utility(point) {
      return point.b * point.c;
    }

    function isAffordable(point, tolerance = 0.001) {
      return config.pB * point.b + config.pC * point.c <= config.income + tolerance;
    }

    function isOnBudget(point, tolerance = 0.22) {
      return Math.abs(point.c - budgetC(point.b)) <= tolerance && point.b >= 0 && point.c >= 0;
    }

    function drawBaseGraph(options = {}) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${config.size} ${config.size}`);
      svg.setAttribute("aria-label", "Plan des biens B et C");

      for (let i = 0; i <= config.max; i += 1) {
        svg.appendChild(svgEl("line", { x1: sx(i), y1: sy(0), x2: sx(i), y2: sy(config.max), stroke: "#d7e0e4", "stroke-width": 1 }));
        svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(i), x2: sx(config.max), y2: sy(i), stroke: "#d7e0e4", "stroke-width": 1 }));
      }

      if (options.budgetArea) {
        drawBudgetArea(svg, Boolean(options.budgetAreaLabel));
      }

      if (options.preferredRegions) {
        drawPreferredRegions(svg, options.preferredRegions, options.preferredRegionOptions || {});
      }

      svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(0), x2: sx(config.max) + 12, y2: sy(0), stroke: "#132536", "stroke-width": 3 }));
      svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(0), x2: sx(0), y2: sy(config.max) - 12, stroke: "#132536", "stroke-width": 3 }));
      svg.appendChild(svgEl("polygon", { points: `${sx(config.max) + 12},${sy(0)} ${sx(config.max)},${sy(0) - 7} ${sx(config.max)},${sy(0) + 7}`, fill: "#132536" }));
      svg.appendChild(svgEl("polygon", { points: `${sx(0)},${sy(config.max) - 12} ${sx(0) - 7},${sy(config.max)} ${sx(0) + 7},${sy(config.max)}`, fill: "#132536" }));

      const labelB = svgEl("text", { x: sx(config.max) - 100, y: sy(0) + 34, fill: "#132536", "font-size": 22, "font-weight": 700 });
      labelB.textContent = "Bien B";
      svg.appendChild(labelB);
      const labelC = svgEl("text", { x: sx(0) - 30, y: sy(config.max) + 86, fill: "#132536", "font-size": 22, "font-weight": 700, transform: `rotate(-90 ${sx(0) - 30} ${sy(config.max) + 86})` });
      labelC.textContent = "Bien C";
      svg.appendChild(labelC);

      drawBudgetLine(svg);

      if (options.curves) {
        options.curves.forEach((level) => drawIndifferenceCurve(svg, level, options.tangentLevel === level));
      }

      if (options.points) {
        options.points.forEach((point) => drawPoint(svg, point));
      }

      if (options.hintText) {
        const text = svgEl("text", { x: sx(2.6), y: sy(0.9), fill: "#176b52", "font-size": 17, "font-weight": 700 });
        text.textContent = options.hintText;
        svg.appendChild(text);
      }

      return svg;
    }

    function lightenZoomedGraph(svg) {
      svg.querySelectorAll("path").forEach((path) => {
        const current = Number(path.getAttribute("stroke-width") || 2);
        path.setAttribute("stroke-width", String(Math.max(0.9, current * 0.55)));
        path.setAttribute("opacity", "0.78");
      });
      svg.querySelectorAll("line").forEach((line) => {
        const current = Number(line.getAttribute("stroke-width") || 1);
        line.setAttribute("stroke-width", String(Math.max(0.55, current * 0.7)));
      });
    }

    function drawBudgetArea(svg, showLabel = false) {
      const maxB = config.income / config.pB;
      const maxC = config.income / config.pC;
      svg.appendChild(svgEl("polygon", {
        points: `${sx(0)},${sy(0)} ${sx(0)},${sy(maxC)} ${sx(maxB)},${sy(0)}`,
        fill: "#dceee7",
        opacity: 0.78
      }));
      if (showLabel) {
        const label = svgEl("text", { x: sx(2.05), y: sy(1.1), fill: "#176b52", "font-size": 17, "font-weight": 700 });
        label.textContent = "ensemble de budget";
        svg.appendChild(label);
      }
    }

    function drawBudgetLine(svg) {
      const maxB = config.income / config.pB;
      const maxC = config.income / config.pC;
      svg.appendChild(svgEl("path", {
        d: `M ${sx(0)} ${sy(maxC)} L ${sx(maxB)} ${sy(0)}`,
        fill: "none",
        stroke: "#b6483b",
        "stroke-width": 4,
        "stroke-linecap": "round"
      }));
    }

    function drawPreferredRegions(svg, referencePoint, options = {}) {
      const level = utility(referencePoint);
      const referenceLabel = options.referenceLabel || "P₃";
      const showIntersection = options.showIntersection !== false;
      const topPoints = [];
      const curvePoints = [];
      const minB = Math.max(level / config.max, 0.2);
      for (let b = minB; b <= config.max; b += 0.08) {
        const c = level / b;
        if (c <= config.max) {
          topPoints.push(`${sx(b)},${sy(config.max)}`);
          curvePoints.push(`${sx(b)},${sy(c)}`);
        }
      }
      const preferredPolygon = [...topPoints, ...curvePoints.reverse()].join(" ");
      svg.appendChild(svgEl("polygon", {
        points: preferredPolygon,
        fill: "#dbe7ff",
        opacity: 0.52
      }));

      const intersections = budgetCurveIntersections(level);
      if (showIntersection && intersections.length === 2 && Math.abs(intersections[1] - intersections[0]) > 0.05) {
        const [left, right] = intersections;
        const budgetTop = [];
        const curveBottom = [];
        for (let b = left; b <= right; b += 0.06) {
          budgetTop.push(`${sx(b)},${sy(budgetC(b))}`);
          curveBottom.push(`${sx(b)},${sy(level / b)}`);
        }
        svg.appendChild(svgEl("polygon", {
          points: [...budgetTop, ...curveBottom.reverse()].join(" "),
          fill: "#98d8bd",
          opacity: 0.82
        }));
      }

      const preferredLabel = svgEl("text", { x: sx(4.2), y: sy(8.4), fill: "#1737ff", "font-size": 16, "font-weight": 700 });
      preferredLabel.textContent = `paniers préférés à ${referenceLabel}`;
      svg.appendChild(preferredLabel);

      if (showIntersection) {
        const intersectionLabel = svgEl("text", { x: sx(3.2), y: sy(3.25), fill: "#176b52", "font-size": 16, "font-weight": 700 });
        intersectionLabel.textContent = "préférés et atteignables";
        svg.appendChild(intersectionLabel);
      }
    }

    function budgetCurveIntersections(level) {
      const a = config.pB;
      const b = -config.income;
      const c = config.pC * level;
      const discriminant = b * b - 4 * a * c;
      if (discriminant < 0) return [];
      const sqrt = Math.sqrt(discriminant);
      return [(-b - sqrt) / (2 * a), (-b + sqrt) / (2 * a)]
        .filter((x) => x >= 0 && x <= config.max)
        .sort((x, y) => x - y);
    }

    function drawIndifferenceCurve(svg, level, isTangent = false) {
      const points = [];
      for (let b = 0.7; b <= config.max; b += 0.06) {
        const c = level / b;
        if (c >= 0.45 && c <= 7.6) {
          points.push(`${points.length ? "L" : "M"} ${sx(b).toFixed(1)} ${sy(c).toFixed(1)}`);
        }
      }
      svg.appendChild(svgEl("path", {
        d: points.join(" "),
        fill: "none",
        stroke: isTangent ? "#1737ff" : "#6c85ff",
        "stroke-width": isTangent ? 4 : 2.6,
        "stroke-linecap": "round",
        opacity: isTangent ? 0.95 : 0.62
      }));
    }

    function drawPoint(svg, point) {
      svg.appendChild(svgEl("circle", {
        cx: sx(point.b),
        cy: sy(point.c),
        r: point.r || 8,
        fill: point.color || "#176b52",
        stroke: "white",
        "stroke-width": 3
      }));
      const label = svgEl("text", {
        x: sx(point.b) + (point.dx ?? 12),
        y: sy(point.c) + (point.dy ?? -12),
        fill: point.color || "#176b52",
        "font-size": point.fontSize || 18,
        "font-weight": 700
      });
      label.textContent = point.label;
      svg.appendChild(label);
    }

    function drawSegment(svg, from, to, color, options = {}) {
      svg.appendChild(svgEl("line", {
        x1: sx(from.b),
        y1: sy(from.c),
        x2: sx(to.b),
        y2: sy(to.c),
        stroke: color,
        "stroke-width": options.width || 3.2,
        "stroke-linecap": "round",
        "stroke-dasharray": options.dash || ""
      }));
    }

    function drawMovingPixelSegment(svg, from, to, color, options = {}) {
      const line = svgEl("line", {
        x1: from.x1,
        y1: from.y1,
        x2: from.x2,
        y2: from.y2,
        stroke: color,
        "stroke-width": options.width || 2.4,
        "stroke-linecap": "round",
        "stroke-dasharray": options.dash || ""
      });
      ["x1", "y1", "x2", "y2"].forEach((attribute) => {
        const animation = svgEl("animate", {
          attributeName: attribute,
          from: from[attribute],
          to: to[attribute],
          dur: options.duration || "0.9s",
          fill: "freeze",
          begin: "0.15s",
          calcMode: "spline",
          keyTimes: "0;1",
          keySplines: "0.2 0 0.2 1"
        });
        line.appendChild(animation);
      });
      svg.appendChild(line);
    }

    function drawGraphText(svg, text, point, color, size = 16) {
      const label = svgEl("text", {
        x: sx(point.b),
        y: sy(point.c),
        fill: color,
        "font-size": size,
        "font-weight": 700
      });
      setSvgMathText(label, text);
      svg.appendChild(label);
    }

    function drawDeltaComparison(svg, data, includeMarket = false) {
      const blueLength = Math.abs(sy(data.sameCI.c) - sy(data.start.c));
      const orangeLength = Math.abs(sy(data.market.c) - sy(data.start.c));
      const blueX = 120;
      const orangeX = 131;
      const bottom = 308;
      const blueFinal = { x1: blueX, y1: bottom, x2: blueX, y2: bottom - blueLength };

      if (includeMarket) {
        svg.appendChild(svgEl("line", {
          ...blueFinal,
          stroke: "#1737ff",
          "stroke-width": 2.4,
          "stroke-linecap": "round"
        }));
        drawMovingPixelSegment(
          svg,
          {
            x1: sx(data.market.b + 0.08),
            y1: sy(data.start.c),
            x2: sx(data.market.b + 0.08),
            y2: sy(data.market.c)
          },
          { x1: orangeX, y1: bottom, x2: orangeX, y2: bottom - orangeLength },
          "#d18a2d",
          { width: 1.8 }
        );
        return;
      }

      drawMovingPixelSegment(
        svg,
        {
          x1: sx(data.sameCI.b - 0.08),
          y1: sy(data.start.c),
          x2: sx(data.sameCI.b - 0.08),
          y2: sy(data.sameCI.c)
        },
        blueFinal,
        "#1737ff",
        { width: 1.8 }
      );
    }

    function drawRightCComparison(svg, data, includeMarket = false) {
      const blueLength = Math.abs(sy(data.sameCIWithMoreB.c) - sy(data.start.c));
      const orangeLength = Math.abs(sy(data.marketWithMoreB.c) - sy(data.start.c));
      const blueX = 118;
      const orangeX = 130;
      const bottom = 328;
      const blueFinal = { x1: blueX, y1: bottom, x2: blueX, y2: bottom - blueLength };

      if (includeMarket) {
        svg.appendChild(svgEl("line", {
          ...blueFinal,
          stroke: "#1737ff",
          "stroke-width": 2.2,
          "stroke-linecap": "round"
        }));
        svg.appendChild(svgEl("line", {
          x1: orangeX,
          y1: bottom,
          x2: orangeX,
          y2: bottom - orangeLength,
          stroke: "#d18a2d",
          "stroke-width": 1.7,
          "stroke-linecap": "round"
        }));
        return;
      }

      svg.appendChild(svgEl("line", {
        ...blueFinal,
        stroke: "#1737ff",
        "stroke-width": 1.7,
        "stroke-linecap": "round"
      }));
    }

    function drawRightBComparison(svg, data, includeMarket = false) {
      const blueLength = Math.abs(sx(data.sameCIWithMoreC.b) - sx(data.start.b));
      const orangeLength = Math.abs(sx(data.marketWithMoreC.b) - sx(data.start.b));
      const left = 118;
      const blueY = 328;
      const orangeY = 316;
      const blueFinal = { x1: left, y1: blueY, x2: left + blueLength, y2: blueY };

      if (includeMarket) {
        svg.appendChild(svgEl("line", {
          ...blueFinal,
          stroke: "#1737ff",
          "stroke-width": 2.2,
          "stroke-linecap": "round"
        }));
        svg.appendChild(svgEl("line", {
          x1: left,
          y1: orangeY,
          x2: left + orangeLength,
          y2: orangeY,
          stroke: "#d18a2d",
          "stroke-width": 1.7,
          "stroke-linecap": "round"
        }));
        return;
      }

      svg.appendChild(svgEl("line", {
        ...blueFinal,
        stroke: "#1737ff",
        "stroke-width": 1.7,
        "stroke-linecap": "round"
      }));
    }

    function setStageWithGraph(title, graph, extra = "") {
      const banner = title ? `<div class="banner">${title}</div>` : "";
      stage.innerHTML = `<div class="graph-wrap">${banner}<div id="graphMount"></div>${extra}</div>`;
      document.getElementById("graphMount").appendChild(graph);

    function setChallenge(key) {
      state.activeChallenge = key;
    }

    function updateActionFocus() {
      const current = steps[state.step];
      const waitsForExercise = Boolean(current.gate && !current.gate());
      const hasExerciseContent = Boolean(waitsForExercise || interaction.textContent.trim() || feedback.textContent.trim());
      mainPanel.classList.toggle("no-exercise", !hasExerciseContent);
      interactionTitle.textContent = current.panelTitle || "Exercice";
      interactionPanel.classList.toggle("titleless", interaction.dataset.titleless === "true");
      interactionPanel.classList.toggle("action-focus", waitsForExercise);
      nextButton.classList.toggle("action-focus", !waitsForExercise && state.step < steps.length - 1);
      if (waitsForExercise) {
        actionHint.textContent = "";
        actionHint.style.display = "none";
      } else {
        actionHint.textContent = "";
        actionHint.style.display = "none";
      }
    }

    function updateScoreboard() {
      progressScore.textContent = String(state.score.progress);
      precisionScore.textContent = String(state.score.precision);
      scoreCard.classList.add("visible");
    }

    function registerMistake() {
      if (!state.activeChallenge || state.completedChallenges.has(state.activeChallenge)) return;
      state.missedChallenges.add(state.activeChallenge);
      updateScoreboard();
    }

    function registerSuccess() {
      if (!state.activeChallenge || state.completedChallenges.has(state.activeChallenge)) return;
      state.completedChallenges.add(state.activeChallenge);
      state.score.progress += 1;
      if (!state.missedChallenges.has(state.activeChallenge)) {
        state.score.precision += 1;
      }
      updateScoreboard();
    }

    function setFeedback(text, type = "ok") {
      feedback.innerHTML = text;
      feedback.style.color = type === "ok" ? "var(--green)" : "var(--red)";
      if (type === "error") {
        registerMistake();
      } else if (/^(Exact|Très bien|Oui)/.test(String(text))) {
        registerSuccess();
      }
    }

    function graphClick(handler) {
      const svg = document.querySelector("#graphMount svg");
      svg.addEventListener("click", (event) => {
        const bounds = svg.getBoundingClientRect();
        const view = svg.viewBox.baseVal;
        const pixelX = view.x + ((event.clientX - bounds.left) / bounds.width) * view.width;
        const pixelY = view.y + ((event.clientY - bounds.top) / bounds.height) * view.height;
        const b = toUnitX(pixelX);
        const c = toUnitY(pixelY);
        handler({ b, c });
      });
    }

    function renderIntro() {
      setChallenge(null);
      setStageWithGraph(
        "Choisir sous contrainte : préférences + budget",
        drawBaseGraph({

    function renderTangencyChoice() {

          <p>À ce point, la pente de la courbe d'indifférence et la pente de la droite de budget coïncident.</p>
        </div>
      `;

    function noEqualityPoints() {
      const level = 10;
      const [left] = budgetCurveIntersections(level);
      const start = { b: left, c: budgetC(left) };
      const deltaB = 1;
      const afterB = start.b + deltaB;
      const sameCI = { b: afterB, c: level / afterB };
      const market = { b: afterB, c: budgetC(afterB) };
      return {
        level,
        start,
        sameCI,
        market,
        deltaB,
        deltaCIndifference: start.c - sameCI.c,
        deltaCMarket: start.c - market.c
      };
    }

    function drawNoEqualityGraph(phase) {
      const data = noEqualityPoints();
      const svg = drawBaseGraph({
        budgetArea: true,
        curves: [data.level],
        points: [{ ...data.start, label: "P₅", color: "#c98c2d", r: 5, dx: -26, dy: -10, fontSize: 13 }]
      });

      if (phase >= 1) {
        const slope = data.start.c / data.start.b;
        drawSegment(
          svg,
          { b: data.start.b - 0.62, c: data.start.c + slope * 0.62 },
          { b: data.start.b + 0.72, c: data.start.c - slope * 0.72 },
          "#176b52",
          { width: 1.15 }
        );
      }

      if (phase >= 2) {
        drawSegment(svg, data.start, { b: data.sameCI.b, c: data.start.c }, "#1737ff", { width: 1.15, dash: "4 4" });
        drawGraphText(svg, "ΔB", { b: data.start.b + 0.4, c: data.start.c + 0.16 }, "#1737ff", 12);
      }

      if (phase >= 3) {
        drawDeltaComparison(svg, data, phase >= 4);
      }

      if (phase >= 4) {
        drawSegment(svg, data.start, data.market, "#d18a2d", { width: 1.25 });
        drawPoint(svg, { ...data.market, label: "P₆", color: "#176b52", r: 5, dx: 9, dy: -9, fontSize: 13 });
      }

      svg.classList.add("zoomed-graph");
      lightenZoomedGraph(svg);
      svg.setAttribute("viewBox", "35 155 360 275");
      return svg;
    }

    function renderNoEquality() {
      const phase = state.noEqualityPhase || 0;
      setChallenge(phase >= 4 ? null : `no-equality-${phase}`);
      setStageWithGraph(
        "",
        drawNoEqualityGraph(phase)
      );

      if (phase === 0) {
        interaction.innerHTML = `
          <div class="formula-card">
            <p>Partons du panier P₅. La courbe d'indifférence coupe la contrainte de budget : les deux pentes ne sont pas égales en ce point.</p>
            <p>Le TMS mesure la quantité de bien C que le consommateur est prêt à sacrifier pour obtenir un peu plus de bien B, tout en restant indifférent.</p>
            <p>Le rapport des prix mesure la quantité de bien C que le marché demande pour obtenir ce supplément de bien B.</p>
          </div>
          <div class="button-row">
            <button data-action="next">Comparer les deux taux</button>
          </div>
        `;
        interaction.querySelector("button").addEventListener("click", () => {
          state.noEqualityPhase = 1;
          renderNoEquality();
        });
        return;
      }

      if (phase === 1) {
        interaction.innerHTML = `
          <p class="choice-prompt">En P₅, que peut-on dire du TMS par rapport au rapport des prix ?</p>
          <div class="button-row">
            <button data-answer="more">TMS > p<sub>B</sub> / p<sub>C</sub></button>
            <button data-answer="equal">TMS = p<sub>B</sub> / p<sub>C</sub></button>
            <button data-answer="less">TMS < p<sub>B</sub> / p<sub>C</sub></button>
          </div>
        `;
        interaction.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.answer === "more") {
              state.noEqualityPhase = 2;
              setFeedback("Exact. La CI est plus pentue que la droite de budget : le consommateur est prêt à céder plus de C que ce que le marché demande.");
              renderNoEquality();
            } else {
              setFeedback("Pas encore. Comparez les pentes en valeur absolue : la CI est plus pentue que la droite de budget en P₅.", "error");
            }
          });
        });
        return;
      }

      if (phase === 2) {
        interaction.innerHTML = `
          <p class="choice-prompt">Pour recevoir ΔB, cliquez sur le graphique au niveau de C le plus bas que le consommateur accepterait en échange de ΔB.</p>
        `;
        graphClick((point) => {
          const data = noEqualityPoints();
          if (Math.abs(point.b - data.sameCI.b) > 0.25) {
            setFeedback("Attention : notre agent a maintenant B + ΔB de bien B dans son panier. Il faut donc chercher le niveau de C pour cette quantité de B.", "error");
          } else if (Math.abs(point.c - data.sameCI.c) <= 0.2) {
            state.noEqualityPhase = 3;
            setFeedback("Exact. Ce point est sur la même courbe d'indifférence : c'est la baisse maximale de C que le consommateur accepterait.");
            renderNoEquality();
          } else if (point.c > data.sameCI.c) {
            setFeedback("Ce panier est au-dessus de la courbe d'indifférence de P₅ : il est préféré à P₅. Le consommateur accepterait donc de céder encore plus de C.", "error");
          } else if (point.c < data.sameCI.c) {
            setFeedback("Pas si bas : avec ce panier, le consommateur serait moins bien qu'avec le panier P₅.", "error");
          } else {
            setFeedback("Pas encore. Le consommateur pourrait accepter de céder davantage de C tout en restant aussi satisfait qu'en P₅.", "error");
          }
        });
        return;
      }

      if (phase === 3) {
        interaction.innerHTML = `
          <div class="formula-card">
            <p>Effectivement, pour recevoir ΔB, le consommateur est prêt à céder ΔC : cela le laisse sur la même courbe d'indifférence.</p>
          </div>
          <p class="choice-prompt">À combien de C le consommateur doit-il renoncer pour obtenir ce même ΔB sur le marché ? Cliquez sur le panier correspondant sur la droite de budget.</p>
        `;
        graphClick((point) => {
          const data = noEqualityPoints();
          if (Math.abs(point.b - data.market.b) > 0.18) {
            setFeedback("Attention : nous regardons toujours le même supplément ΔB. Le panier doit donc contenir B + ΔB de bien B.", "error");
          } else if (Math.abs(point.c - data.market.c) <= 0.12) {
            state.noEqualityPhase = 4;
            state.answered.add("noEqualityDone");
            setFeedback("Exact. Le marché demande une baisse de C plus faible : l'échange permet donc d'atteindre un panier préféré.");
            renderNoEquality();
            updateNav();
          } else if (point.c > data.market.c) {
            setFeedback("Ce panier est au-dessus de la contrainte de budget : il est trop cher. Le marché demande de renoncer à plus de C.", "error");
          } else {
            setFeedback("Ce panier est sous la contrainte de budget : tu renonces à trop de C. Le marché demande de renoncer à moins de C.", "error");
          }
        });
        return;
      }

      interaction.dataset.titleless = "true";
      interaction.innerHTML = `
        <div class="formula-card">
          <p>Pour recevoir ΔB, le consommateur accepterait de céder davantage de bien C que ce que le marché demande.</p>
          <p>Le panier P₆ est donc bien atteignable, et il est préféré au panier précédent.</p>
        </div>
      `;
      feedback.innerHTML = "";
      updateNav();
    }

    function rightNoEqualityPoints() {
      const level = 10;
      const intersections = budgetCurveIntersections(level);
      const startB = intersections[1];
      const start = { b: startB, c: budgetC(startB) };
      const deltaB = 1;
      const moreB = start.b + deltaB;
      const sameCIWithMoreB = { b: moreB, c: level / moreB };
      const marketWithMoreB = { b: moreB, c: budgetC(moreB) };
      const deltaC = 0.5;
      const moreC = start.c + deltaC;
      const sameCIWithMoreC = { b: level / moreC, c: moreC };
      const marketWithMoreC = { b: start.b - (config.pC / config.pB) * deltaC, c: moreC };
      return {
        level,
        start,
        deltaB,
        deltaC,
        sameCIWithMoreB,
        marketWithMoreB,
        sameCIWithMoreC,
        marketWithMoreC
      };
    }

    function drawRightNoEqualityGraph(phase) {
      const data = rightNoEqualityPoints();
      const svg = drawBaseGraph({
        budgetArea: true,
        curves: [data.level],
        points: [{ ...data.start, label: "P₇", color: "#c98c2d", r: 5, dx: 9, dy: -9, fontSize: 13 }]
      });

      if (phase >= 1) {
        const slope = data.start.c / data.start.b;
        drawSegment(
          svg,
          { b: data.start.b - 0.72, c: data.start.c + slope * 0.72 },
          { b: data.start.b + 0.72, c: data.start.c - slope * 0.72 },
          "#176b52",
          { width: 1.15 }
        );
      }

      if (phase >= 2 && phase <= 4) {
        drawSegment(svg, data.start, { b: data.sameCIWithMoreB.b, c: data.start.c }, "#1737ff", { width: 1.15, dash: "4 4" });
        drawGraphText(svg, "ΔB", { b: data.start.b + 0.42, c: data.start.c + 0.13 }, "#1737ff", 12);
      }

      if (phase >= 3 && phase <= 4) {
        drawRightCComparison(svg, data, phase >= 4);
      }

      if (phase >= 4) {
        drawSegment(svg, data.start, data.marketWithMoreB, "#d18a2d", { width: 1.25 });
      }

      if (phase >= 5) {
        drawSegment(svg, { b: data.start.b - 0.08, c: data.start.c + 0.08 }, { b: data.start.b - 0.08, c: data.sameCIWithMoreC.c }, "#1737ff", { width: 1.15, dash: "4 4" });
        drawGraphText(svg, "ΔC", { b: data.start.b - 0.42, c: data.start.c + 0.36 }, "#1737ff", 12);
      }

      if (phase >= 6) {
        drawSegment(svg, { b: data.start.b, c: data.sameCIWithMoreC.c }, data.sameCIWithMoreC, "#1737ff", { width: 1.15, dash: "4 4" });
        drawRightBComparison(svg, data, phase >= 7);
      }

      if (phase >= 7) {
        drawSegment(svg, data.start, data.marketWithMoreC, "#d18a2d", { width: 1.25 });
        drawPoint(svg, { ...data.marketWithMoreC, label: "P₈", color: "#176b52", r: 5, dx: 8, dy: -8, fontSize: 13 });
      }

      svg.classList.add("zoomed-graph");
      lightenZoomedGraph(svg);
      svg.setAttribute("viewBox", "80 215 380 245");
      return svg;
    }

    function renderRightNoEquality() {
      const phase = state.rightNoEqualityPhase || 0;
      setChallenge(phase >= 7 ? null : `right-no-equality-${phase}`);
      if (phase < 2) {
        narration.innerHTML = "Faisons le même raisonnement en un autre point de la contrainte de budget. Ici aussi, le TMS est différent du rapport des prix. Nous allons commencer par comparer ces deux taux.";
      } else if (phase < 4) {
        narration.innerHTML = "Nous venons de voir que le TMS est inférieur au rapport des prix. C'est différent du cas précédent. Essayons tout de même le même type d'échange : obtenir plus de bien B en cédant du bien C.";
      } else if (phase < 7) {
        narration.innerHTML = "Cette première tentative ne fonctionne pas : pour obtenir plus de bien B, le marché demande trop de bien C. Il faut donc essayer l'échange dans l'autre sens : obtenir plus de bien C en cédant du bien B.";
      } else {
        narration.innerHTML = "Dans ce sens, l'échange fonctionne : le marché demande de céder moins de bien B que ce que le consommateur était prêt à céder. Le panier obtenu est donc atteignable et préféré.";
      }
      setStageWithGraph(
        "",
        drawRightNoEqualityGraph(phase)
      );

      if (phase === 0) {
        interaction.innerHTML = `
          <div class="formula-card">
            <p>Partons de P₇, à droite du choix optimal. La courbe d'indifférence coupe encore la contrainte de budget.</p>
            <p>Cette fois, la courbe d'indifférence est moins pentue que la droite de budget.</p>
          </div>
          <div class="button-row">
            <button data-action="next">Comparer les deux taux</button>
          </div>
        `;
        interaction.querySelector("button").addEventListener("click", () => {
          state.rightNoEqualityPhase = 1;
          renderRightNoEquality();
        });
        return;
      }

      if (phase === 1) {
        interaction.innerHTML = `
          <p class="choice-prompt">En P₇, que peut-on dire du TMS par rapport au rapport des prix ?</p>
          <div class="button-row">
            <button data-answer="more">TMS > p<sub>B</sub> / p<sub>C</sub></button>
            <button data-answer="equal">TMS = p<sub>B</sub> / p<sub>C</sub></button>
            <button data-answer="less">TMS < p<sub>B</sub> / p<sub>C</sub></button>
          </div>
        `;
        interaction.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.answer === "less") {
              state.rightNoEqualityPhase = 2;
              setFeedback("Exact. La CI est moins pentue que la droite de budget : le consommateur est prêt à céder peu de C pour obtenir plus de B.");
              renderRightNoEquality();
            } else {
              setFeedback("Pas encore. Comparez les pentes en valeur absolue : la CI est moins pentue que la droite de budget en P₇.", "error");
            }
          });
        });
        return;
      }

      if (phase === 2) {
        interaction.innerHTML = `
          <p class="choice-prompt">Essayons d'abord le même raisonnement que tout à l'heure. Pour recevoir ΔB, cliquez sur le niveau de C le plus bas que le consommateur accepterait en échange de ΔB.</p>
        `;
        graphClick((point) => {
          const data = rightNoEqualityPoints();
          if (Math.abs(point.b - data.sameCIWithMoreB.b) > 0.6) {
            setFeedback("Attention : nous testons un panier avec B + ΔB de bien B.", "error");
          } else if (Math.abs(point.c - data.sameCIWithMoreB.c) <= 0.45) {
            state.rightNoEqualityPhase = 3;
            setFeedback("Exact. Ce point garde le consommateur sur la même courbe d'indifférence que P₇.");
            renderRightNoEquality();
          } else if (point.c > data.sameCIWithMoreB.c) {
            setFeedback("Ce panier est encore préféré à P₇ : le consommateur accepterait de céder un peu plus de C.", "error");
          } else {
            setFeedback("Pas si bas : avec ce panier, le consommateur serait moins bien qu'avec P₇.", "error");
          }
        });
        return;
      }

      if (phase === 3) {
        interaction.innerHTML = `
          <p class="choice-prompt">À combien de C le consommateur doit-il renoncer pour obtenir ce même ΔB sur le marché ? Cliquez sur le panier correspondant sur la droite de budget.</p>
        `;
        graphClick((point) => {
          const data = rightNoEqualityPoints();
          if (Math.abs(point.b - data.marketWithMoreB.b) > 0.75) {
            setFeedback("Attention : nous gardons le même supplément ΔB. Le panier doit contenir B + ΔB de bien B.", "error");
          } else if (Math.abs(point.c - data.marketWithMoreB.c) <= 0.42) {
            state.rightNoEqualityPhase = 4;
            setFeedback("Exact. Ici, le marché demande de céder plus de C que ce que le consommateur acceptait.");
            renderRightNoEquality();
          } else if (point.c > data.marketWithMoreB.c) {
            setFeedback("Ce panier est au-dessus de la contrainte de budget : il est trop cher. Le marché demande de renoncer à plus de C.", "error");
          } else {
            setFeedback("Ce panier est sous la contrainte de budget : tu renonces à trop de C. Le marché demande de renoncer à moins de C.", "error");
          }
        });
        return;
      }

      if (phase === 4) {
        interaction.innerHTML = `
          <div class="formula-card">
            <p>Cette fois, obtenir plus de B ne fonctionne pas : le marché demande de céder plus de C que ce que le consommateur accepterait.</p>
            <p>Essayons donc l'échange inverse : obtenir plus de bien C en cédant du bien B.</p>
          </div>
          <div class="button-row">
            <button data-action="reverse">Essayer l'autre sens</button>
          </div>
        `;
        interaction.querySelector("button").addEventListener("click", () => {
          state.rightNoEqualityPhase = 5;
          renderRightNoEquality();
        });
        return;
      }

      if (phase === 5) {
        interaction.innerHTML = `
          <p class="choice-prompt">Pour recevoir ΔC, cliquez sur le niveau de B le plus bas que le consommateur accepterait en échange de ΔC.</p>
        `;
        graphClick((point) => {
          const data = rightNoEqualityPoints();
          if (Math.abs(point.c - data.sameCIWithMoreC.c) > 0.6) {
            setFeedback("Attention : nous cherchons un panier avec C + ΔC de bien C.", "error");
          } else if (Math.abs(point.b - data.sameCIWithMoreC.b) <= 0.55) {
            state.rightNoEqualityPhase = 6;
            setFeedback("Exact. Ce point est sur la même courbe d'indifférence : il indique combien de B le consommateur accepterait de céder.");
            renderRightNoEquality();
          } else if (point.b > data.sameCIWithMoreC.b) {
            setFeedback("Ce panier est préféré à P₇ : le consommateur accepterait de céder encore plus de B.", "error");
          } else {
            setFeedback("Pas si loin : avec ce panier, le consommateur serait moins bien qu'avec P₇.", "error");
          }
        });
        return;
      }

      if (phase === 6) {
        interaction.innerHTML = `
          <p class="choice-prompt">Pour ce même ΔC, cliquez sur le panier que le marché permet d'acheter sur la droite de budget.</p>
        `;
        graphClick((point) => {
          const data = rightNoEqualityPoints();
          if (Math.abs(point.c - data.marketWithMoreC.c) > 0.38) {
            setFeedback("Attention : nous gardons le même supplément ΔC. Le panier doit contenir C + ΔC de bien C.", "error");
          } else if (Math.abs(point.b - data.marketWithMoreC.b) <= 0.3) {
            state.rightNoEqualityPhase = 7;
            state.answered.add("rightNoEqualityDone");
            setFeedback("Exact. Le marché demande de céder moins de B que ce que le consommateur était prêt à céder : P₈ est préféré et atteignable.");
            renderRightNoEquality();
            updateNav();
          } else if (point.b > data.marketWithMoreC.b) {
            setFeedback("Ce panier est au-dessus de la contrainte de budget : il est trop cher. Le marché demande de céder plus de B.", "error");
          } else {
            setFeedback("Ce panier est sous la contrainte de budget : tu cèdes trop de B. Le marché demande de céder moins de B.", "error");
          }
        });
        return;
      }

      interaction.innerHTML = `
        <div class="formula-card">
          <p>À droite du choix optimal, obtenir plus de B est trop coûteux en C.</p>
          <p>En revanche, obtenir plus de C en cédant du B améliore le panier : P₈ est atteignable et préféré à P₇.</p>
          <p>Au point optimal, aucun de ces deux échanges ne permet d'améliorer la situation : TMS et rapport des prix sont égaux.</p>
        </div>
      `;
      updateNav();
    }

    function drawCornerIndifference(svg, offset = 0, options = {}) {
      const curvature = options.curvature || 0.06;
      const slope = options.slope || 0.72;
      const anchorB = options.anchorB || 10;
      const points = [];
      for (let b = 0; b <= config.max + 1.1; b += 0.08) {
        const distance = anchorB - b;
        const c = curvature * distance * distance + slope * distance + offset;
        if (c >= -1.2 && c <= config.max) {
          points.push(`${points.length ? "L" : "M"} ${sx(b).toFixed(1)} ${sy(c).toFixed(1)}`);
        }
      }
      svg.appendChild(svgEl("path", {
        d: points.join(" "),
        fill: "none",
        stroke: options.color || "#6c85ff",
        "stroke-width": options.width || 2.2,
        "stroke-linecap": "round",
        opacity: options.opacity || 0.72,
        "stroke-dasharray": options.dash || ""
      }));
    }

    function drawCornerGraph(mode = "choice") {
      const showChoice = mode !== "choice";
      const cornerPoints = [];
      if (showChoice) {
        cornerPoints.push({ b: 10, c: 0, label: "P₉", color: "#176b52", r: 7, dx: -38, dy: -12, fontSize: 15 });
      }
      if (mode === "choice" && state.cornerClickedPoint && state.cornerSuggestedPoint) {
        cornerPoints.push({ ...state.cornerClickedPoint, label: "panier pointé", color: "#b6483b", r: 4, dx: 8, dy: -8, fontSize: 11 });
        cornerPoints.push({ ...state.cornerSuggestedPoint, label: "préféré", color: "#176b52", r: 5, dx: 8, dy: -8, fontSize: 11 });
      }
      const svg = drawBaseGraph({
        budgetArea: true,
        points: cornerPoints
      });

      if (mode === "zoom") {
        svg.appendChild(svgEl("line", { x1: sx(10), y1: sy(0), x2: sx(13.1), y2: sy(0), stroke: "#132536", "stroke-width": 3 }));
        svg.appendChild(svgEl("polygon", { points: `${sx(13.1)},${sy(0)} ${sx(12.9)},${sy(0) - 7} ${sx(12.9)},${sy(0) + 7}`, fill: "#132536" }));
        drawCornerIndifference(svg, 0, { color: "#1737ff", width: 2.4, opacity: 0.95, slope: 1.18, curvature: 0.08 });
        drawSegment(svg, { b: 10, c: 0 }, { b: 13.1, c: budgetC(13.1) }, "#b6483b", { width: 1.8, dash: "5 4" });
        const tmsLabel = svgEl("text", { x: sx(8.25), y: sy(1.0), fill: "#1737ff", "font-size": 8.5, "font-weight": 700 });
        setSvgMathText(tmsLabel, "TMS > pB / pC");
        svg.appendChild(tmsLabel);
        svg.classList.add("zoomed-graph");
        svg.setAttribute("viewBox", "180 300 340 240");
      } else {
        [-8.2, -6.15, -4.1, -2.05, 0].forEach((offset) => {
          drawCornerIndifference(svg, offset, { opacity: 0.58, width: 2.2 });
        });
      }

      return svg;
    }

    function renderInteriorResult() {
      setChallenge(null);
      stage.innerHTML = `

          <div class="result-grid">

            <div class="equation-stack">

    function renderCornerChoice() {
      const foundChoice = state.answered.has("cornerPointFound");
      setChallenge(foundChoice ? "corner-confirm" : "corner-choice");
      setStageWithGraph(
        "Allons plus loin",
        drawCornerGraph(foundChoice ? "chosen" : "choice")
      );

      if (!foundChoice) {
        interaction.innerHTML = `
          <p class="choice-prompt">Cliquez sur le panier préféré par le consommateur.</p>
        `;
        graphClick((point) => {
          if (Math.hypot(point.b - 10, point.c) <= 0.45) {
            state.answered.add("cornerPointFound");
            setFeedback("Parfait. On voit bien que l'ensemble de budget est séparé de l'ensemble des paniers préférés à celui choisi. Mais ici, le TMS est différent du rapport des prix.");
            renderCornerChoice();
            updateNav();
          } else if (!isAffordable(point)) {
            setFeedback("Ce panier est sur une courbe d'indifférence plus élevée, mais il n'est pas atteignable. Le meilleur panier atteignable se trouve au coin de la contrainte.", "error");
          } else {
            const suggestedB = Math.min(10, Math.max(point.b + 0.8, point.b));
            state.cornerClickedPoint = point;
            state.cornerSuggestedPoint = { b: suggestedB, c: budgetC(suggestedB) };
