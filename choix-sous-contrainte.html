    const exerciseConfig = {
      income: 120,
      pB: 20,
      pC: 30,
      maxB: 7,
      maxC: 5,
      size: 460,
      paletteWidth: 160,
      margin: 54,
      target: { b: 3, c: 2 },
      tangentLevel: 6
    };

    function exSx(x) {
      const inner = exerciseConfig.size - 2 * exerciseConfig.margin;
      return exerciseConfig.margin + (x / exerciseConfig.maxB) * inner;
    }

    function exSy(y) {
      const inner = exerciseConfig.size - 2 * exerciseConfig.margin;
      return exerciseConfig.size - exerciseConfig.margin - (y / exerciseConfig.maxC) * inner;
    }

    function exToUnitX(pixelX) {
      const inner = exerciseConfig.size - 2 * exerciseConfig.margin;
      return Math.max(0, Math.min(exerciseConfig.maxB, ((pixelX - exerciseConfig.margin) / inner) * exerciseConfig.maxB));
    }

    function exToUnitY(pixelY) {
      const inner = exerciseConfig.size - 2 * exerciseConfig.margin;
      return Math.max(0, Math.min(exerciseConfig.maxC, ((exerciseConfig.size - exerciseConfig.margin - pixelY) / inner) * exerciseConfig.maxC));
    }

    function exerciseBudgetC(b) {
      return (exerciseConfig.income - exerciseConfig.pB * b) / exerciseConfig.pC;
    }

    function tokenLabel(token) {
      const labels = {
        pB: "p<sub>B</sub>",
        pC: "p<sub>C</sub>",
        "10": "10",
        "20": "20",
        "30": "30",
        B: "B",
        C: "C",
        sqrtB: "√B",
        sqrtC: "√C",
        sqrtpB: "√p<sub>B</sub>",
        sqrtpC: "√p<sub>C</sub>",
        "×": "×",
        "+": "+"
      };
      return labels[token] || token;
    }

    function isValidExerciseConstraint(tokens) {
      const terms = [];
      let current = [];
      tokens.forEach((token) => {
        if (token === "+") {
          terms.push(current.filter((item) => item !== "×"));
          current = [];
        } else if (token !== "×") {
          current.push(token);
        }
      });
      terms.push(current.filter((item) => item !== "×"));
      if (terms.length !== 2 || terms.some((term) => term.length !== 2)) return false;
      const normalized = terms.map((term) => term.slice().sort().join("*")).sort();
      return normalized[0] === "20*B" && normalized[1] === "30*C";
    }

    function exerciseCurvePath(level) {
      const points = [];
      for (let b = 0.55; b <= exerciseConfig.maxB; b += 0.05) {
        const c = level / b;
        if (c >= 0.2 && c <= exerciseConfig.maxC) {
          points.push(`${points.length ? "L" : "M"} ${exSx(b).toFixed(1)} ${exSy(c).toFixed(1)}`);
        }
      }
      return points.join(" ");
    }

    function drawExerciseGraph(options = {}) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const viewWidth = exerciseConfig.size + (options.curveReserve ? exerciseConfig.paletteWidth : 0);
      svg.setAttribute("viewBox", `0 0 ${viewWidth} ${exerciseConfig.size}`);
      svg.setAttribute("aria-label", "Exercice de choix sous contrainte");

      for (let i = 0; i <= exerciseConfig.maxB; i += 1) {
        svg.appendChild(svgEl("line", { x1: exSx(i), y1: exSy(0), x2: exSx(i), y2: exSy(exerciseConfig.maxC), stroke: "#d7e0e4", "stroke-width": 1 }));
      }
      for (let i = 0; i <= exerciseConfig.maxC; i += 1) {
        svg.appendChild(svgEl("line", { x1: exSx(0), y1: exSy(i), x2: exSx(exerciseConfig.maxB), y2: exSy(i), stroke: "#d7e0e4", "stroke-width": 1 }));
      }

      if (options.showAccessible) {
        svg.appendChild(svgEl("polygon", {
          points: `${exSx(0)},${exSy(0)} ${exSx(0)},${exSy(4)} ${exSx(6)},${exSy(0)}`,
          fill: "#dceee7",
          opacity: 0.82
        }));
      }

      if (options.showInaccessible) {
        svg.appendChild(svgEl("polygon", {
          points: `${exSx(0)},${exSy(4)} ${exSx(0)},${exSy(exerciseConfig.maxC)} ${exSx(exerciseConfig.maxB)},${exSy(exerciseConfig.maxC)} ${exSx(exerciseConfig.maxB)},${exSy(0)} ${exSx(6)},${exSy(0)}`,
          fill: "#f4d8d1",
          opacity: 0.72
        }));
      }

      svg.appendChild(svgEl("line", { x1: exSx(0), y1: exSy(0), x2: exSx(exerciseConfig.maxB) + 12, y2: exSy(0), stroke: "#132536", "stroke-width": 3 }));
      svg.appendChild(svgEl("line", { x1: exSx(0), y1: exSy(0), x2: exSx(0), y2: exSy(exerciseConfig.maxC) - 12, stroke: "#132536", "stroke-width": 3 }));
      svg.appendChild(svgEl("polygon", { points: `${exSx(exerciseConfig.maxB) + 12},${exSy(0)} ${exSx(exerciseConfig.maxB)},${exSy(0) - 7} ${exSx(exerciseConfig.maxB)},${exSy(0) + 7}`, fill: "#132536" }));
      svg.appendChild(svgEl("polygon", { points: `${exSx(0)},${exSy(exerciseConfig.maxC) - 12} ${exSx(0) - 7},${exSy(exerciseConfig.maxC)} ${exSx(0) + 7},${exSy(exerciseConfig.maxC)}`, fill: "#132536" }));

      const labelB = svgEl("text", { x: exSx(exerciseConfig.maxB) - 105, y: exSy(0) + 34, fill: "#132536", "font-size": 22, "font-weight": 700 });
      labelB.textContent = "Bien B";
      svg.appendChild(labelB);
      const labelC = svgEl("text", { x: exSx(0) - 30, y: exSy(exerciseConfig.maxC) + 84, fill: "#132536", "font-size": 22, "font-weight": 700, transform: `rotate(-90 ${exSx(0) - 30} ${exSy(exerciseConfig.maxC) + 84})` });
      labelC.textContent = "Bien C";
      svg.appendChild(labelC);

      if (options.showBudgetLine || options.showExact) {
        svg.appendChild(svgEl("path", {
          d: `M ${exSx(0)} ${exSy(4)} L ${exSx(6)} ${exSy(0)}`,
          fill: "none",
          stroke: options.showExact ? "#176b52" : "#b6483b",
          "stroke-width": options.showExact ? 5 : 4,
          "stroke-linecap": "round"
        }));
      }

      if (options.showIntercepts) {
        drawExercisePoint(svg, { b: 0, c: 4, label: "(0,4)", color: "#176b52", dx: 12, dy: -12 });
        drawExercisePoint(svg, { b: 6, c: 0, label: "(6,0)", color: "#c98c2d", dx: -48, dy: -12 });
      }

      if (options.intercepts) {
        options.intercepts.forEach((point) => drawExercisePoint(svg, point));
      }

      if (options.curveLevels && options.curveReserve) {
        const paletteX = exerciseConfig.size + 18;
        const paletteY = exerciseConfig.margin;
        const paletteWidth = exerciseConfig.paletteWidth - 32;
        const paletteHeight = exerciseConfig.size - 2 * exerciseConfig.margin;
        svg.appendChild(svgEl("rect", {
          x: paletteX,
          y: paletteY,
          width: paletteWidth,
          height: paletteHeight,
          rx: 10,
          fill: "#f4f7ff",
          stroke: "#aebdff",
          "stroke-width": 1.5,
          "stroke-dasharray": "5 4",
          opacity: 0.96
        }));
        const reserveLabel = svgEl("text", {
          x: paletteX + 12,
          y: paletteY + 24,
          fill: "#3441a3",
          "font-size": 13,
          "font-weight": 700
        });
        reserveLabel.textContent = "Courbes";
        svg.appendChild(reserveLabel);
        const reserveLabel2 = svgEl("text", {
          x: paletteX + 12,
          y: paletteY + 41,
          fill: "#3441a3",
          "font-size": 13,
          "font-weight": 700
        });
        reserveLabel2.textContent = "d'indifférence";
        svg.appendChild(reserveLabel2);
        const hint = svgEl("text", {
          x: paletteX + 12,
          y: paletteY + 63,
          fill: "#5f6e77",
          "font-size": 11,
          "font-weight": 700
        });
        hint.textContent = "Ã  glisser";
        svg.appendChild(hint);
      }

      if (options.curveLevels) {
        options.curveLevels.forEach((level, index) => {
          const isCorrectCurve = options.correctCurve && Math.abs(level - exerciseConfig.tangentLevel) < 0.02;
          const isPlaced = !options.curveReserve || Boolean(options.curvePlaced?.[index]) || isCorrectCurve;
          if (isPlaced) {
            const curve = svgEl("path", {
              d: exerciseCurvePath(level),
              fill: "none",
              stroke: isCorrectCurve ? "#1737ff" : "#6c85ff",
              "stroke-width": isCorrectCurve ? 4 : 2.8,
              "stroke-linecap": "round",
              opacity: isCorrectCurve ? 0.95 : 0.72,
              "data-curve-index": String(index),
              "data-exercise-curve": String(index),
              style: "cursor: grab;"
            });
            svg.appendChild(curve);
          }

          if (options.curveReserve) {
            const paletteX = exerciseConfig.size + 38;
            const centerY = exerciseConfig.margin + 118 + index * 82;
            const paletteCurve = svgEl("path", {
              d: `M ${paletteX} ${centerY + 28} C ${paletteX + 16} ${centerY - 8}, ${paletteX + 56} ${centerY - 8}, ${paletteX + 84} ${centerY + 22}`,
              fill: "none",
              stroke: "#6c85ff",
              "stroke-width": 3,
              "stroke-linecap": "round",
              opacity: isPlaced ? 0.42 : 0.95,
              "data-curve-index": String(index),
              style: "cursor: grab;"
            });
            svg.appendChild(paletteCurve);
            const handle = svgEl("circle", {
              cx: paletteX + 84,
              cy: centerY + 22,
              r: 8,
              fill: "#1737ff",
              stroke: "white",
              "stroke-width": 3,
              opacity: isPlaced ? 0.48 : 0.95,
              "data-curve-index": String(index),
              "data-curve-handle": String(index),
              style: "cursor: grab;"
            });
            svg.appendChild(handle);
          }
        });
      }
      if (options.showOptimum) {
        drawExercisePoint(svg, { ...exerciseConfig.target, label: "P*", color: "#176b52", dx: 12, dy: -12 });
      }

      return svg;
    }

    function drawExercisePoint(svg, point) {
      svg.appendChild(svgEl("circle", {
        cx: exSx(point.b),
        cy: exSy(point.c),
        r: point.r || 7,
        fill: point.color || "#176b52",
        stroke: "white",
        "stroke-width": 3
      }));
      const label = svgEl("text", {
        x: exSx(point.b) + (point.dx ?? 10),
        y: exSy(point.c) + (point.dy ?? -10),
        fill: point.color || "#176b52",
        "font-size": point.fontSize || 16,
        "font-weight": 700
      });
      label.textContent = point.label;
      svg.appendChild(label);
    }

    function exerciseGraphClick(handler) {
      const svg = document.querySelector("#graphMount svg");
      svg.addEventListener("click", (event) => {
        const point = exercisePointFromEvent(svg, event);
        handler(point);
      });
    }

    function exercisePointFromEvent(svg, event) {
      const bounds = svg.getBoundingClientRect();
      const view = svg.viewBox.baseVal;
      const pixelX = view.x + ((event.clientX - bounds.left) / bounds.width) * view.width;
      const pixelY = view.y + ((event.clientY - bounds.top) / bounds.height) * view.height;
      return { b: exToUnitX(pixelX), c: exToUnitY(pixelY) };
    }

    function exercisePixelFromEvent(svg, event) {
      const bounds = svg.getBoundingClientRect();
      const view = svg.viewBox.baseVal;
      return {
        x: view.x + ((event.clientX - bounds.left) / bounds.width) * view.width,
        y: view.y + ((event.clientY - bounds.top) / bounds.height) * view.height
      };
    }

    function renderFinalExercise() {
      const phase = state.finalExercisePhase || 0;
      const challenge = phase === 0 ? "final-equation" : phase === 1 ? "final-intercepts" : phase === 2 ? `final-zones-${state.exerciseDrawMode || "choice"}` : phase === 3 ? "final-ci" : null;
      setChallenge(challenge);

      if (phase === 0) {
        renderExerciseEquation();
      } else if (phase === 1) {
        renderExerciseIntercepts();
      } else if (phase === 2) {
        renderExerciseZones();
      } else {
        renderExerciseCurve();
      }
    }

    function renderExerciseStatement(extra = "") {
      stage.innerHTML = `
        <div class="exercise-statement">
          <div class="banner">Exercice : choix sous contrainte</div>
          <div class="formula-card">
            <p>Un consommateur dispose d'un revenu de 120 euros qu'il peut consacrer à l'achat de deux biens : le bien B et le bien C.</p>
            <p>Le prix d'une unité de bien B est de 20 euros et le prix d'une unité de bien C est de 30 euros.</p>
          </div>
        </div>
      `;
    }

    function renderExerciseEquation() {
      if (!state.exerciseTokens) state.exerciseTokens = [];
      renderExerciseStatement();
      const tokens = ["10", "20", "30", "B", "C", "sqrtB", "sqrtC", "×", "+"];
      interaction.innerHTML = `
        <div class="formula-card">
          <p>Construisez l'équation de la contrainte budgétaire.</p>
          <div class="token-build" id="tokenBuild">
            ${state.exerciseTokens.map((token) => `<span class="token-slot">${tokenLabel(token)}</span>`).join("")}
            <span class="token-slot">≤ 120</span>
          </div>
        </div>
        <p class="choice-prompt">Choisissez les éléments utiles dans la palette.</p>
        <div class="token-palette">
          ${tokens.map((token) => `<button data-token="${token}">${tokenLabel(token)}</button>`).join("")}
        </div>
        <div class="small-actions">
          <button data-action="clear">Effacer</button>
          <button class="primary" data-action="check">Vérifier</button>
        </div>
      `;
      interaction.querySelectorAll("[data-token]").forEach((button) => {
        button.addEventListener("click", () => {
          state.exerciseTokens.push(button.dataset.token);
          renderExerciseEquation();
        });
      });
      interaction.querySelector("[data-action='clear']").addEventListener("click", () => {
        state.exerciseTokens = [];
        renderExerciseEquation();
      });
      interaction.querySelector("[data-action='check']").addEventListener("click", () => {
        if (isValidExerciseConstraint(state.exerciseTokens)) {
          state.finalExercisePhase = 1;
          setFeedback("Exact. La contrainte est bien p<sub>B</sub>B + p<sub>C</sub>C ≤ R, ici 20B + 30C ≤ 120.");
          renderFinalExercise();
        } else {
          setFeedback("Pas encore. Pour chaque bien, il faut multiplier le prix par la quantité, puis additionner les deux dépenses.", "error");
        }
      });
    }

    function renderExerciseIntercepts() {
      if (!state.exerciseIntercepts) state.exerciseIntercepts = [];
      const showLine = state.exerciseIntercepts.length >= 2;
      setStageWithGraph(
        "Tracer la droite de budget",
        drawExerciseGraph({ intercepts: state.exerciseIntercepts, showBudgetLine: showLine })
      );
      interaction.innerHTML = `
        <div class="formula-card" style="margin-bottom:10px">
          <p style="margin:0">R = 120 €&nbsp;&nbsp;·&nbsp;&nbsp;p<sub>B</sub> = 20 €&nbsp;&nbsp;·&nbsp;&nbsp;p<sub>C</sub> = 30 €</p>
        </div>
        <p class="choice-prompt">Cliquez sur les deux paniers extrêmes de la droite de budget.</p>
        ${state.exerciseShowNote ? `<div class="note-box">Si B = 0, tout le revenu sert à acheter C : C = 120 / 30 = 4.<br>Si C = 0, tout le revenu sert à acheter B : B = 120 / 20 = 6.<br>Deux points suffisent pour tracer la droite.</div>` : ""}
        <div class="small-actions">
          <button data-action="note">${state.exerciseShowNote ? "Masquer l'aide" : "Voir comment faire"}</button>
          <button data-action="reset">Recommencer</button>
        </div>
      `;
      interaction.querySelector("[data-action='note']").addEventListener("click", () => {
        state.exerciseShowNote = !state.exerciseShowNote;
        renderExerciseIntercepts();
      });
      interaction.querySelector("[data-action='reset']").addEventListener("click", () => {
        state.exerciseIntercepts = [];
        renderExerciseIntercepts();
      });
      exerciseGraphClick((point) => {
        const targets = [
          { b: 0, c: 4, label: "(0,4)", color: "#176b52", dx: 12, dy: -12 },
          { b: 6, c: 0, label: "(6,0)", color: "#c98c2d", dx: -48, dy: -12 }
        ];
        const target = targets.find((candidate) => Math.hypot(point.b - candidate.b, point.c - candidate.c) <= 0.35);
        if (!target) {
          setFeedback("Pas encore. Cherchez les paniers où le consommateur achète un seul bien : seulement C, puis seulement B.", "error");
          return;
        }
        const already = state.exerciseIntercepts.some((saved) => Math.hypot(saved.b - target.b, saved.c - target.c) <= 0.05);
        if (!already) state.exerciseIntercepts.push(target);
        if (state.exerciseIntercepts.length >= 2) {
          state.finalExercisePhase = 2;
          setFeedback("Exact. Avec deux points, une seule droite est possible : c'est la droite de budget.");
          renderFinalExercise();
        } else {
          setFeedback("Bien. Il reste l'autre panier extrême à placer.");
          renderExerciseIntercepts();
        }
      });
    }

    function renderExerciseZones() {
      if (!state.exerciseZoneStatus) {
        state.exerciseZoneStatus = { accessible: false, inaccessible: false, exact: false };
      }
      const done = state.exerciseZoneStatus.accessible && state.exerciseZoneStatus.inaccessible && state.exerciseZoneStatus.exact;
      if (done) {
        state.finalExercisePhase = 3;
        setFeedback("Exact. Nous pouvons maintenant ajouter les préférences et chercher le panier choisi.");
        renderFinalExercise();
        return;
      }
      setStageWithGraph(
        "Identifier les ensembles",
        drawExerciseGraph({
          showBudgetLine: true,
          showAccessible: state.exerciseZoneStatus.accessible,
          showInaccessible: state.exerciseZoneStatus.inaccessible,
          showExact: state.exerciseZoneStatus.exact
        })
      );
      interaction.innerHTML = `
        <div class="formula-card" style="margin-bottom:10px">
          <p style="margin:0">R = 120 €&nbsp;&nbsp;·&nbsp;&nbsp;p<sub>B</sub> = 20 €&nbsp;&nbsp;·&nbsp;&nbsp;p<sub>C</sub> = 30 €</p>
        </div>
        <p class="choice-prompt">Tracez successivement les paniers accessibles, les paniers inaccessibles et les paniers qui utilisent exactement tout le revenu.</p>
        <div class="button-row">
          <button data-mode="accessible">Paniers accessibles</button>
          <button data-mode="inaccessible">Paniers inaccessibles</button>
          <button data-mode="exact">Tout le revenu</button>
        </div>
        ${state.exerciseShowDrawNote ? `<div class="note-box">Choisissez une zone, puis tracez grossièrement. Sous la droite : accessible. Au-dessus : inaccessible. Sur la droite : tout le revenu est utilisé.</div>` : ""}
        <div class="small-actions">
          <button data-action="note">${state.exerciseShowDrawNote ? "Masquer l'aide" : "Voir comment faire"}</button>
        </div>
      `;
      interaction.querySelectorAll("[data-mode]").forEach((button) => {
        button.classList.toggle("primary", state.exerciseDrawMode === button.dataset.mode);
        button.disabled = Boolean(state.exerciseZoneStatus[button.dataset.mode]);
        button.addEventListener("click", () => {
          state.exerciseDrawMode = button.dataset.mode;
          renderExerciseZones();
        });
      });
      interaction.querySelector("[data-action='note']").addEventListener("click", () => {
        state.exerciseShowDrawNote = !state.exerciseShowDrawNote;
        renderExerciseZones();
      });
      if (state.exerciseDrawMode) {
        enableExerciseDrawing(state.exerciseDrawMode);
      }
    }

    function enableExerciseDrawing(mode) {
      const svg = document.querySelector("#graphMount svg");
      svg.classList.add("draw-mode");
      let drawing = false;
      let points = [];
      let path = null;
      svg.addEventListener("pointerdown", (event) => {
        drawing = true;
        svg.style.touchAction = "none";
        points = [exercisePointFromEvent(svg, event)];
        const pixel = exercisePixelFromEvent(svg, event);
        path = svgEl("path", {
          d: `M ${pixel.x.toFixed(1)} ${pixel.y.toFixed(1)}`,
          fill: "none",
          stroke: mode === "accessible" ? "#176b52" : mode === "inaccessible" ? "#b6483b" : "#1737ff",
          "stroke-width": 4,
          "stroke-linecap": "round",
          opacity: 0.74
        });
        svg.appendChild(path);
      });
      svg.addEventListener("pointermove", (event) => {
        if (!drawing) return;
        const point = exercisePointFromEvent(svg, event);
        points.push(point);
        const pixel = exercisePixelFromEvent(svg, event);
        path.setAttribute("d", `${path.getAttribute("d")} L ${pixel.x.toFixed(1)} ${pixel.y.toFixed(1)}`);
      });
      svg.addEventListener("pointerup", () => {
        if (!drawing) return;
        drawing = false;
        svg.style.touchAction = "";
        validateExerciseDrawing(mode, points);
      });
    }

    function validateExerciseDrawing(mode, points) {
      if (points.length < 2) {
        setFeedback("Il faut tracer un petit morceau de zone ou de droite pour que je puisse valider.", "error");
        return;
      }
      const ratios = points.map((point) => point.c - exerciseBudgetC(point.b));
      let valid = false;
      if (mode === "accessible") {
        valid = ratios.filter((value) => value <= 0.25).length / ratios.length > 0.78;
      } else if (mode === "inaccessible") {
        valid = ratios.filter((value) => value > 0.25).length / ratios.length > 0.7;
      } else {
        const nearLine = ratios.filter((value) => Math.abs(value) <= 0.25).length / ratios.length;
        const spread = Math.max(...points.map((point) => point.b)) - Math.min(...points.map((point) => point.b));
        valid = nearLine > 0.6 && spread > 0.7;
      }
      if (!valid) {
        setFeedback("Pas encore. La trace n'est pas dans la bonne région du graphique.", "error");
        return;
      }
      state.exerciseZoneStatus[mode] = true;
      state.exerciseDrawMode = null;
      const labels = { accessible: "les paniers accessibles", inaccessible: "les paniers inaccessibles", exact: "les paniers qui utilisent exactement le revenu" };
      setFeedback(`Exact. Vous avez identifié ${labels[mode]}.`);
      renderExerciseZones();
    }

    function renderExerciseCurve() {
      if (!state.exerciseCurveLevels) state.exerciseCurveLevels = [3.8, 7.8, 10.5];
      if (!state.exerciseCurvePlaced) state.exerciseCurvePlaced = state.exerciseCurveLevels.map(() => false);
      const done = state.answered.has("finalExerciseDone");
      setStageWithGraph(
        done ? "Panier préféré" : "Déterminer graphiquement le panier choisi",
        drawExerciseGraph({
          showBudgetLine: true,
          showAccessible: true,
          curveLevels: done ? [exerciseConfig.tangentLevel] : state.exerciseCurveLevels,
          correctCurve: done,
          showOptimum: done,
          curveReserve: !done,
          curvePlaced: state.exerciseCurvePlaced
        })
      );
      interaction.innerHTML = done
        ? `<div class="formula-card"><p>La courbe d'indifférence tangente à la droite de budget passe par le panier préféré. Ce panier est atteignable et aucun panier atteignable ne se trouve sur une courbe d'indifférence plus élevée.</p></div>`
        : `
          <div class="formula-card"><p>À partir de la contrainte budgétaire que vous avez représentée à la question précédente, utilisez les courbes d’indifférence fournies pour déterminer graphiquement le panier choisi par le consommateur.</p><p>Pour cela, déplacez les courbes d’indifférence jusqu’à identifier la courbe la plus élevée compatible avec l’ensemble budgétaire. Représentez clairement le panier optimal sur le graphique.</p></div>
          <div class="small-actions">
            <button class="primary" data-action="check">Vérifier</button>
          </div>
        `;
      if (done) return;
      enableExerciseCurveDrag();
      interaction.querySelector("[data-action='check']").addEventListener("click", () => {
        const placedLevels = state.exerciseCurveLevels.filter((_, index) => state.exerciseCurvePlaced[index]);
        if (!placedLevels.length) {
          setFeedback("Prenez d'abord une courbe d'indifférence dans la palette et placez-la sur le graphique.", "error");
          return;
        }
        const closestLevel = placedLevels.reduce((best, level) => (
          Math.abs(level - exerciseConfig.tangentLevel) < Math.abs(best - exerciseConfig.tangentLevel) ? level : best
        ), placedLevels[0]);
        const closest = Math.abs(closestLevel - exerciseConfig.tangentLevel);
        if (closest <= 0.35) {
          state.exerciseCurveLevels = [exerciseConfig.tangentLevel];
          state.exerciseCurvePlaced = [true];
          state.answered.add("finalExerciseDone");
          setFeedback("Exact. La CI tangente identifie le panier préféré, ici P* = (3,2).");
          renderExerciseCurve();
          updateNav();
        } else if (closestLevel < exerciseConfig.tangentLevel) {
          setFeedback("Pas encore. La courbe placée est trop basse : il existe une courbe d'indifférence atteignable plus élevée.", "error");
        } else {
          setFeedback("Pas encore. Cette courbe est trop haute : elle ne peut pas être atteinte avec le budget disponible.", "error");
        }
      });
    }

    function ensureExerciseCurve(svg, index) {
      let curve = svg.querySelector(`path[data-exercise-curve="${index}"]`);
      let hit = svg.querySelector(`path[data-curve-hit="${index}"]`);
      const d = exerciseCurvePath(state.exerciseCurveLevels[index]);
      if (!curve) {
        curve = svgEl("path", {
          d,
          fill: "none",
          stroke: "#6c85ff",
          "stroke-width": 2.8,
          "stroke-linecap": "round",
          opacity: 0.72,
          "data-exercise-curve": String(index),
          style: "cursor: grab;"
        });
        svg.appendChild(curve);
      }
      if (!hit) {
        hit = svgEl("path", {
          d,
          fill: "none",
          stroke: "rgba(0,0,0,0.01)",
          "stroke-width": 24,
          "pointer-events": "all",
          "data-curve-index": String(index),
          "data-curve-hit": String(index),
          style: "cursor: grab;"
        });
        svg.appendChild(hit);
      }
      return curve;
    }
    function enableExerciseCurveDrag() {
      const svg = document.querySelector("#graphMount svg");
      svg.style.touchAction = "none";
      let selected = null;
      svg.addEventListener("pointerdown", (event) => {
        const target = event.target.closest("[data-curve-index]");
        if (!target) return;
        event.preventDefault();
        selected = Number(target.dataset.curveIndex);
        state.exerciseCurvePlaced[selected] = true;
        svg.setPointerCapture(event.pointerId);
        ensureExerciseCurve(svg, selected);
      });
      svg.addEventListener("pointermove", (event) => {
        if (selected === null) return;
        const point = exercisePointFromEvent(svg, event);
        const level = Math.max(1.2, Math.min(13, point.b * point.c));
        state.exerciseCurveLevels[selected] = level;
        const curve = ensureExerciseCurve(svg, selected);
        const d = exerciseCurvePath(level);
        curve.setAttribute("d", d);
        const hit = svg.querySelector(`path[data-curve-hit="${selected}"]`);
        if (hit) hit.setAttribute("d", d);
      });
      svg.addEventListener("pointerup", () => {
        selected = null;
      });
    }

    function renderEndSlide() {
      stage.innerHTML = `
        <div class="context-diagram">
          <div class="context-box done">
            <div class="context-tag">Module 1 ✓</div>
            <div class="context-name">Préférences</div>
            <div class="context-sub">courbes d'indifférence</div>
          </div>
          <div class="context-op">+</div>
          <div class="context-box done">
            <div class="context-tag">Module 2 ✓</div>
            <div class="context-name">Budget</div>
            <div class="context-sub">droite de budget</div>
          </div>
          <div class="context-op">→</div>
          <div class="context-box done">
            <div class="context-tag">Module 3 ✓</div>
            <div class="context-name">Choix optimal</div>
            <div class="context-sub">point de tangence</div>
          </div>
        </div>
      `;
      interaction.innerHTML = `
        <div class="formula-card">
          <p>Vous avez complété les trois modules du programme du consommateur. Vous savez maintenant :</p>
          <ul style="margin: 10px 0 0 0; padding-left: 20px; line-height: 1.8;">
            <li>décrire les préférences à l'aide de courbes d'indifférence et du TMS</li>
            <li>définir l'ensemble budget et tracer la droite de budget</li>
            <li>trouver le panier optimal au point de tangence (TMS = p<sub>B</sub> / p<sub>C</sub>)</li>
          </ul>
        </div>
      `;
    }

    function update() {
      const current = steps[state.step];
      sequenceTitle.textContent = stepLabels[state.step] || `Diapositive ${state.step + 1}`;
      narration.innerHTML = current.text;
      interaction.dataset.titleless = "";
      feedback.textContent = "";
      renderProgressStrip();
      current.render();
      interactionTitle.style.display = current.gate ? "" : "none";
      updateNav();
    }

    function updateNav() {
      const current = steps[state.step];
      backButton.disabled = state.step === 0;
      nextButton.disabled = Boolean(current.gate && !current.gate());
      updateActionFocus();
    }

    function openNavPanel() {
      navPanelItems.innerHTML = steps.map((_, i) => {
        const label = stepLabels[i] || `Diapositive ${i + 1}`;
        return `<button class="nav-panel-item${i === state.step ? " nav-current" : ""}" data-step="${i}">${i + 1}. ${label}</button>`;
      }).join("");
      navPanelItems.querySelectorAll("[data-step]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.step = Number(btn.dataset.step);
          update();
          closeNavPanel();
        });
      });
      navPanel.style.display = "block";
      navBackdrop.style.display = "block";
    }

    function closeNavPanel() {
      navPanel.style.display = "none";
      navBackdrop.style.display = "none";
    }

    navJumpButton.addEventListener("click", () => {
      navPanel.style.display === "none" ? openNavPanel() : closeNavPanel();
    });
    navBackdrop.addEventListener("click", closeNavPanel);

    devSkipButton.addEventListener("click", () => {
      if (state.step < steps.length - 1) {
        state.step += 1;
        update();
      }
    });

    backButton.addEventListener("click", () => {
      if (state.step > 0) {
        state.step -= 1;
        update();
      }
    });

    nextButton.addEventListener("click", () => {
      const current = steps[state.step];
      if (current.gate && !current.gate()) return;
      if (state.step < steps.length - 1) {
        state.step += 1;
        update();
      }
    });

    update();
  </script>
</body>
</html>
