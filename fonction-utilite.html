      return String(value)
        .replace(/\(([^()]+)\)\^\(([^()]+)\)/g, "($1)<sup>$2</sup>")
        .replace(/\(([^()]+)\)\^(\d+)/g, "($1)<sup>$2</sup>")

        .replace(/p_C/g, "p<sub>C</sub>")
        .replace(/UM_B/g, "UM<sub>B</sub>")
        .replace(/UM_C/g, "UM<sub>C</sub>")
        .replace(/lambda/g, "λ");

      const chain = visibleSteps.map(s => `

        controls.querySelector("[data-action='check']").addEventListener("click", () => {
          const bStar = normalized("#cdBStarInput");
          const cStar = normalized("#cdCStarInput");
          const bOk = ["r/(3p_b)", "r/3p_b", "r/(3pb)", "r/3pb"].includes(bStar);
          const cOk = ["2r/(3p_c)", "2r/3p_c", "2r/(3pc)", "2r/3pc"].includes(cStar);
          if (bOk && cOk) {
            showLocal("Exact. Le budget se répartit pour un tiers sur B et deux tiers sur C.", "ok", true);
          } else {
            showLocal("Pas encore. Remplacez C par 2(p_B/p_C)B dans p_BB + p_CC = R. Vous obtenez 3p_BB = R.", "error");
          }
        });
      }
    }

    function utilityPracticeData(kind) {
      if (kind === "quasilinear") {
        return {
          name: "quasi-linéaire",
          utilityHtml: "B+C<sup>1/2</sup>",
          utilityText: "B + C^(1/2)",
          lagrangianHtml: "B+C<sup>1/2</sup> + λ(R - p<sub>B</sub>B - p<sub>C</sub>C)",
          lagrangianNeedles: ["b+c^(1/2)", "λ", "r", "-p_bb", "-p_cc"],
          umb: "1",
          umc: "(1/2)C^(-1/2)",
          tms: "2C^(1/2)",
          relation: "C = (p_B/(2p_C))^2",
          bStar: "R/p_B - p_B/(4p_C)",
          cStar: "p_B^2/(4p_C^2)",
          summary: "Si p_B < 2(Rp_C)^(1/2), C* = p_B^2/(4p_C^2) et B* = R/p_B - p_B/(4p_C). Sinon, la solution est en coin : B*=0 et C*=R/p_C.",
          summaryHtml: `
            <div class="piecewise-display">
              <div class="piecewise-function">
                <span class="formula">B*(p<sub>B</sub>,p<sub>C</sub>,R)=</span>
                <span class="piecewise-brace">{</span>
                <div class="piecewise-cases">
                  <span class="piecewise-value formula">R/p<sub>B</sub> - p<sub>B</sub>/(4p<sub>C</sub>)</span>
                  <span class="piecewise-condition">si <span class="formula">p<sub>B</sub> &lt; 2(Rp<sub>C</sub>)<sup>1/2</sup></span></span>
                  <span class="piecewise-value formula">0</span>
                  <span class="piecewise-condition">si <span class="formula">p<sub>B</sub> &ge; 2(Rp<sub>C</sub>)<sup>1/2</sup></span></span>
                </div>
              </div>
              <div class="piecewise-function">
                <span class="formula">C*(p<sub>B</sub>,p<sub>C</sub>,R)=</span>
                <span class="piecewise-brace">{</span>
                <div class="piecewise-cases">
                  <span class="piecewise-value formula">p<sub>B</sub><sup>2</sup>/(4p<sub>C</sub><sup>2</sup>)</span>
                  <span class="piecewise-condition">si <span class="formula">p<sub>B</sub> &lt; 2(Rp<sub>C</sub>)<sup>1/2</sup></span></span>
                  <span class="piecewise-value formula">R/p<sub>C</sub></span>
                  <span class="piecewise-condition">si <span class="formula">p<sub>B</sub> &ge; 2(Rp<sub>C</sub>)<sup>1/2</sup></span></span>
                </div>
              </div>
            </div>`
        };
      }
      return {
        name: "racines séparées",
        utilityHtml: "B<sup>1/2</sup>+C<sup>1/2</sup>",
        utilityText: "B^(1/2) + C^(1/2)",
        lagrangianHtml: "B<sup>1/2</sup>+C<sup>1/2</sup> + λ(R - p<sub>B</sub>B - p<sub>C</sub>C)",
        lagrangianNeedles: ["b^(1/2)+c^(1/2)", "λ", "r", "-p_bb", "-p_cc"],
        umb: "(1/2)B^(-1/2)",
        umc: "(1/2)C^(-1/2)",
        tms: "(C/B)^(1/2)",
        relation: "C = (p_B/p_C)^2 B",
        bStar: "R p_C/(p_B(p_B+p_C))",
        cStar: "R p_B/(p_C(p_B+p_C))",
        summary: "B* = Rp_C/[p_B(p_B+p_C)] et C* = Rp_B/[p_C(p_B+p_C)]."
      };
    }

    function renderUtilityPractice() {
      const screen = screens[state.phase];
      const data = utilityPracticeData(screen.practiceKind);
      const step = screen.practiceStep;
      const basePieces = [
        ["B", "B"], ["C", "C"], ["R", "R"], ["p_B", "p<sub>B</sub>"], ["p_C", "p<sub>C</sub>"],
        ["λ", "λ"], ["+", "+"], ["-", "-"], ["/", "/"], ["*", "×"], ["^", "^"], ["(", "("], [")", ")"],
        ["1/2", "1/2"], ["2", "2"], ["4", "4"], ["0", "0"], [">=", "≥"]
      ];
      const specialPieces = screen.practiceKind === "quasilinear"
        ? [["C^(1/2)", "C<sup>1/2</sup>"], ["C^(-1/2)", "C<sup>-1/2</sup>"], ["p_B/(2p_C)", "p<sub>B</sub>/(2p<sub>C</sub>)"], ["(R p_C)^(1/2)", "(Rp<sub>C</sub>)<sup>1/2</sup>"]]
        : [["B^(1/2)", "B<sup>1/2</sup>"], ["C^(1/2)", "C<sup>1/2</sup>"], ["B^(-1/2)", "B<sup>-1/2</sup>"], ["C^(-1/2)", "C<sup>-1/2</sup>"], ["(p_B/p_C)^2", "(p<sub>B</sub>/p<sub>C</sub>)<sup>2</sup>"]];
      const palette = () => `
        <div class="button-row token-palette">
          ${specialPieces.concat(basePieces).map(([piece, label]) => `<button data-up-piece="${piece}">${label}</button>`).join("")}
        </div>`;
      const nav = (showNext = false) => `
        <div class="button-row">
          <button data-action="back">Retour</button>
          ${showNext ? `<button class="primary" data-action="next">Suite</button>` : ""}
        </div>`;

      if (step === "intro") {
        controls.innerHTML = `
          <div class="exercise-block">
            <p><strong>À retenir avant de calculer</strong></p>
            <p>On cherche toujours les demandes <span class="formula">B*(p<sub>B</sub>,p<sub>C</sub>,R)</span> et <span class="formula">C*(p<sub>B</sub>,p<sub>C</sub>,R)</span>.</p>
            <p>Les inconnues intermédiaires <span class="formula">B</span>, <span class="formula">C</span> et <span class="formula">λ</span> doivent disparaître du résultat final.</p>
          </div>
          ${nav(true)}`;
      } else if (step === "summary") {
        controls.innerHTML = `
          <div class="exercise-block compact-summary-block">
            <p><strong>Correction ${data.name}</strong></p>
            <p><span class="formula">u(B,C)=${data.utilityHtml}</span></p>
            <p><span class="formula">UM<sub>B</sub> = ${mathHtml(data.umb)}</span></p>
            <p><span class="formula">UM<sub>C</sub> = ${mathHtml(data.umc)}</span></p>
            <p><span class="formula">TMS = ${mathHtml(data.tms)}</span></p>
            <p><span class="formula">${mathHtml(data.relation)}</span></p>
            <p><span class="formula">B* = ${mathHtml(data.bStar)}</span></p>
            <p><span class="formula">C* = ${mathHtml(data.cStar)}</span></p>
            ${data.summaryHtml || `<p>${mathHtml(data.summary)}</p>`}
          </div>
          <div class="button-row"><button data-action="restart">Recommencer</button></div>`;
      } else {
        const labels = {
          lagrangian: "Construisez le lagrangien",
          marginals: "Calculez les utilités marginales",
          foc: "Écrivez les conditions du premier ordre",
          tangency: "Calculez UM_B/UM_C et la relation entre C et B",
          solve: "Trouvez les demandes optimales",
          corner: "Vérifiez si la solution intérieure est possible",
          piecewise: "Écrivez la condition et la demande par morceaux"
        };
        const fields = {
          lagrangian: [["upLInput", "𝓛(B,C,λ) ="]],
          marginals: [["upUmbInput", "UM_B ="], ["upUmcInput", "UM_C ="]],
          foc: [["upFocBInput", "∂𝓛/∂B ="], ["upFocCInput", "∂𝓛/∂C ="], ["upFocLambdaInput", "∂𝓛/∂λ ="]],
          tangency: [["upTmsInput", "UM_B/UM_C ="], ["upRelationInput", "C ="]],
          solve: [["upBStarInput", "B* ="], ["upCStarInput", "C* ="]],
          corner: state.quasilinearCornerStep === 1
            ? [["upInteriorBInput", "B* ="], ["upInteriorCInput", "C* ="], ["upCostInput", "Dépense ="]]
            : state.quasilinearCornerStep === 2
              ? [["upInteriorBInput", "B* ="], ["upInteriorCInput", "C* ="]]
              : [["upCornerBInput", "B consommé ="], ["upCornerCInput", "C consommé ="], ["upCornerCostInput", "Dépense ="]],
            piecewise: [["upConditionInput", "Condition intérieure : p<sub>B</sub> <"], ["upPieceBInteriorInput", "Si elle est vérifiée, B* ="], ["upPieceCInteriorInput", "Si elle est vérifiée, C* ="], ["upPieceBCornerInput", "Sinon, B* ="], ["upPieceCCornerInput", "Sinon, C* ="]]
        }[step];
        const reminder = {
          lagrangian: `
            <p>Fonction d'utilité : <span class="formula">u(B,C)=${data.utilityHtml}</span></p>
            <p>Contrainte : <span class="formula">p<sub>B</sub>B+p<sub>C</sub>C=R</span></p>`,
          marginals: `<p>Fonction d'utilité à dériver : <span class="formula">u(B,C)=${data.utilityHtml}</span></p>`,
          foc: `<p>Lagrangien à dériver : <span class="formula">𝓛(B,C,λ) = ${data.lagrangianHtml}</span></p>`,
          tangency: `<p>Utilités marginales calculées : <span class="formula">UM<sub>B</sub> = ${mathHtml(data.umb)}</span> et <span class="formula">UM<sub>C</sub> = ${mathHtml(data.umc)}</span></p>`
        }[step] || "";
        controls.innerHTML = `
          <div class="exercise-block">
            <p><strong>${mathHtml(labels[step])}</strong></p>
            ${reminder}
            ${step === "corner" ? `
              ${state.quasilinearCornerStep === 1 ? `
                <p>Premier test : <span class="formula">p<sub>B</sub>=1</span>, <span class="formula">p<sub>C</sub>=1</span>, <span class="formula">R=2</span>.</p>
                <p>Appliquez les formules intérieures et calculez combien coûte ce panier.</p>
              ` : state.quasilinearCornerStep === 2 ? `
                <p>Deuxième test : <span class="formula">p<sub>B</sub>=4</span>, <span class="formula">p<sub>C</sub>=1</span>, <span class="formula">R=2</span>.</p>
                <p>Appliquez encore les formules intérieures. La valeur obtenue pour <span class="formula">B*</span> a-t-elle un sens ?</p>
              ` : `
                <p>Comme la demande intérieure de <span class="formula">B</span> est négative, la solution intérieure n'est pas faisable.</p>
                <p>On est dans une solution en coin : le consommateur choisit <span class="formula">B=0</span> et dépense tout son revenu en <span class="formula">C</span>.</p>
              `}
            ` : ""}
            ${step === "piecewise" ? `
              <p>Indice : partez de <span class="formula">R/p<sub>B</sub> - p<sub>B</sub>/(4p<sub>C</sub>) &ge; 0</span>, puis isolez <span class="formula">p<sub>B</sub></span>.</p>
              <p>Si cette condition échoue, la solution est en coin : <span class="formula">B*=0</span> et tout le revenu est dépensé en <span class="formula">C</span>.</p>
            ` : ""}
            ${fields.map(([id, label]) => `
              <div class="lagrangian-answer-row">
                <span class="formula">${mathHtml(label)}</span>
                <input class="wide-expression-input" id="${id}" autocomplete="off">
              </div>
            `).join("")}
            ${step === "corner" ? "" : palette()}
            <div class="button-row">${step === "corner" ? "" : `<button data-action="clear">Effacer</button>`}<button class="primary" data-action="check">Vérifier</button></div>
            <div class="feedback inline-feedback" id="upFeedback"></div>

      controls.querySelector("[data-action='restart']")?.addEventListener("click", reset);
      let activeInput = controls.querySelector("input");
      controls.querySelectorAll("input").forEach((input) => input.addEventListener("focus", () => { activeInput = input; }));
      controls.querySelectorAll("[data-up-piece]").forEach((button) => button.addEventListener("click", () => {
        if (!activeInput) return;
        activeInput.value = `${activeInput.value}${activeInput.value ? " " : ""}${button.dataset.upPiece}`;
        activeInput.focus();
      }));
      controls.querySelector("[data-action='clear']")?.addEventListener("click", () => {
        controls.querySelectorAll("input").forEach((input) => { input.value = ""; });
        controls.querySelector("input")?.focus();
      });
      const box = controls.querySelector("#upFeedback");
      const show = (message, type = "ok", revealNext = false) => {
        if (!box) return;
        box.style.display = "block";
        box.classList.toggle("error", type === "error");
        box.innerHTML = mathHtml(message);
        setFeedback("");
        if (revealNext) {
          const navRow = controls.lastElementChild;
          if (!navRow.querySelector("[data-action='next']")) {
            navRow.insertAdjacentHTML("beforeend", `<button class="primary" data-action="next">Suite</button>`);
            navRow.querySelector("[data-action='next']").addEventListener("click", () => next());
          }
        }
      };
      const norm = (id) => normalizeAnswer(controls.querySelector(id)?.value || "").replace(/lambda/g, "λ").replace(/\*/g, "");
      const containsAll = (value, items) => items.every((item) => value.includes(item));
      controls.querySelector("[data-action='check']")?.addEventListener("click", () => {
        if (step === "lagrangian") {
          const v = norm("#upLInput");
          const ok = containsAll(v, data.lagrangianNeedles);
          show(ok ? "Exact. Passons aux utilités marginales." : "Pas encore. Le lagrangien doit contenir l'utilité plus λ fois le revenu restant : R - p_BB - p_CC.", ok ? "ok" : "error", ok);
        } else if (step === "marginals") {
          const umb = norm("#upUmbInput");
          const umc = norm("#upUmcInput");
          const ok = screen.practiceKind === "quasilinear"
            ? (umb === "1" && containsAll(umc, ["1/2", "c^(-1/2)"]))
            : (containsAll(umb, ["1/2", "b^(-1/2)"]) && containsAll(umc, ["1/2", "c^(-1/2)"]));
          show(ok ? "Exact. Ces utilités marginales permettent d'écrire les conditions du premier ordre." : "Pas encore. Appliquez la règle de puissance au bien dérivé et gardez l'autre bien constant.", ok ? "ok" : "error", ok);
        } else if (step === "foc") {
          const b = norm("#upFocBInput");
          const c = norm("#upFocCInput");
          const l = norm("#upFocLambdaInput");
          const bOk = screen.practiceKind === "quasilinear" ? (b.includes("1") && (b.includes("-λp_b") || b.includes("-λpb"))) : (containsAll(b, ["1/2", "b^(-1/2)"]) && (b.includes("-λp_b") || b.includes("-λpb")));
          const cOk = screen.practiceKind === "quasilinear" ? (containsAll(c, ["1/2", "c^(-1/2)"]) && (c.includes("-λp_c") || c.includes("-λpc"))) : (containsAll(c, ["1/2", "c^(-1/2)"]) && (c.includes("-λp_c") || c.includes("-λpc")));
          const lOk = containsAll(l, ["r"]) && (l.includes("-p_bb") || l.includes("-pbb")) && (l.includes("-p_cc") || l.includes("-pcc"));
          const ok = bOk && cOk && lOk;
          show(ok ? "Exact. On peut maintenant réécrire les deux premières conditions pour éliminer λ." : "Pas encore. Les deux premières conditions sont UM - λp = 0. La troisième redonne R - p_BB - p_CC = 0.", ok ? "ok" : "error", ok);
        } else if (step === "tangency") {
          const tms = norm("#upTmsInput");
          const rel = norm("#upRelationInput");
          const ok = screen.practiceKind === "quasilinear"
            ? ((tms.includes("2") && tms.includes("c^(1/2)")) && (rel.includes("p_b") && rel.includes("2p_c") && (rel.includes("^2") || rel.includes(")^2"))))
            : ((tms.includes("c/b") || containsAll(tms, ["c", "b", "1/2"])) && rel.includes("(p_b/p_c)^2"));
          show(ok ? "Exact. En réécrivant les deux premières conditions puis en les divisant, on élimine λ et on obtient la relation utile pour la contrainte budgétaire." : "Pas encore. Réécrivez les deux conditions comme UM_B = λp_B et UM_C = λp_C, puis divisez-les pour obtenir UM_B/UM_C = p_B/p_C.", ok ? "ok" : "error", ok);
        } else if (step === "solve") {
          const b = norm("#upBStarInput");
          const c = norm("#upCStarInput");
          const ok = screen.practiceKind === "quasilinear"
            ? (b.includes("r/p_b") && b.includes("p_b/(4p_c)") && c.includes("p_b^2/(4p_c^2)"))
            : (b.includes("rp_c") && b.includes("p_b(p_b+p_c)") && c.includes("rp_b") && c.includes("p_c(p_b+p_c)"));
          show(ok ? "Exact. Vous avez obtenu les demandes optimales." : "Pas encore. Remplacez la relation de tangence dans la contrainte budgétaire, puis isolez la première quantité.", ok ? "ok" : "error", ok);
        } else if (step === "corner") {
          if (state.quasilinearCornerStep === 1) {
            const b = parseNumber(controls.querySelector("#upInteriorBInput")?.value);
            const c = parseNumber(controls.querySelector("#upInteriorCInput")?.value);
            const cost = parseNumber(controls.querySelector("#upCostInput")?.value);
            if (Math.abs(b - 1.75) <= 0.05 && Math.abs(c - 0.25) <= 0.05 && Math.abs(cost - 2) <= 0.05) {
              state.quasilinearCornerStep = 2;
              show("Exact. Ici la solution intérieure est faisable : B*=1,75, C*=0,25 et la dépense vaut bien 2. Essayons maintenant un autre prix.", "ok");
              update();
            } else {
              show("Pas encore. Avec p_B=1, p_C=1, R=2 : B*=2 - 1/4 = 1,75 et C*=1/4. Le coût est 1×1,75 + 1×0,25 = 2.", "error");
            }
          } else if (state.quasilinearCornerStep === 2) {
            const b = parseNumber(controls.querySelector("#upInteriorBInput")?.value);
            const c = parseNumber(controls.querySelector("#upInteriorCInput")?.value);
            if (Math.abs(b + 0.5) <= 0.05 && Math.abs(c - 4) <= 0.05) {
              state.quasilinearCornerStep = 3;
              show("Vous avez bien remplacé les valeurs dans les demandes intérieures : on obtient B*=-0,5 et C*=4. Mais il y a un problème : une quantité négative de B n'a pas de sens. On doit donc chercher une solution en coin.", "ok");
              update();
            } else {
              show("Avec p_B=4, p_C=1, R=2, remplacez simplement dans les demandes intérieures : B*=2/4 - 4/4 = -0,5 et C*=16/4 = 4. Ce n'est pas une faute de calcul : c'est justement ce résultat qui révèle le problème.", "ok");
            }
          } else {
            const b = parseNumber(controls.querySelector("#upCornerBInput")?.value);
            const c = parseNumber(controls.querySelector("#upCornerCInput")?.value);
            const cost = parseNumber(controls.querySelector("#upCornerCostInput")?.value);
            if (Math.abs(b) <= 0.05 && Math.abs(c - 2) <= 0.05 && Math.abs(cost - 2) <= 0.05) {
              show("Excellent. Vous avez directement compris la logique de la solution en coin : B=0 et C=R/p_C=2. Les quelques questions qui suivent seront presque triviales pour vous : elles consistent surtout à généraliser cette idée.", "ok", true);
            } else if (Math.abs(c - 4) <= 0.05) {
              show("Attention : C=4 coûterait 4 avec p_C=1, alors que le revenu est seulement R=2. En coin, si B=0, la contrainte donne C=R/p_C=2.", "error");
            } else {
              show("Pas encore. En solution en coin, B=0. Avec p_C=1 et R=2, la contrainte budgétaire donne C=2 et la dépense vaut 2.", "error");
            }
          }
        } else if (step === "piecewise") {
          const condition = norm("#upConditionInput").replace(/≥/g, ">=");
          const bInterior = norm("#upPieceBInteriorInput");
          const cInterior = norm("#upPieceCInteriorInput");
          const bCorner = norm("#upPieceBCornerInput");
          const cCorner = norm("#upPieceCCornerInput");
          const conditionOk = condition.includes("2(rp_c)^(1/2)") || condition.includes("2(rpc)^(1/2)") || condition.includes("2sqrt(rp_c)") || condition.includes("2sqrt(rpc)") || condition.includes("sqrt(4rp_c)") || condition.includes("sqrt(4rpc)") || condition.includes("p_b<2") || condition.includes("pb<2") || condition.includes("p_b<=2") || condition.includes("pb<=2") || condition.includes("4rp_c>=p_b^2") || condition.includes("4rpc>=pb^2") || condition.includes("r>=p_b^2/(4p_c)") || condition.includes("r>=pb^2/(4pc)");
          const bInteriorOk = bInterior.includes("r/p_b") && bInterior.includes("p_b/(4p_c)");
          const cInteriorOk = cInterior.includes("p_b^2/(4p_c^2)") || cInterior.includes("pb^2/(4pc^2)");
          const bCornerOk = bCorner === "0";
          const cCornerOk = cCorner.includes("r/p_c") || cCorner.includes("r/pc");
          if (conditionOk && bInteriorOk && cInteriorOk && bCornerOk && cCornerOk) {
            show("Exact. La demande quasi-linéaire est bien une demande par morceaux : solution intérieure si p_B < 2(Rp_C)^(1/2), sinon solution en coin avec B*=0 et C*=R/p_C.", "ok", true);
          } else if (!conditionOk) {
            show("Pas encore. Travaillez sur p_B : la condition vient de B* >= 0, donc R/p_B - p_B/(4p_C) >= 0, puis p_B^2 <= 4Rp_C, donc p_B < 2(Rp_C)^(1/2) pour une solution intérieure stricte.", "error");
          } else {
            show("La condition est bonne. Complétez maintenant les deux morceaux : à l'intérieur, B*=R/p_B - p_B/(4p_C) et C*=p_B^2/(4p_C^2). En coin, B*=0 et C*=R/p_C.", "error");
          }
        }
      });
    }

            <li>Calculer les utilités marginales UM<sub>B</sub> et UM<sub>C</sub></li>
            <li>En déduire le TMS = UM<sub>B</sub> / UM<sub>C</sub></li>
            <li>Résoudre le programme du consommateur par substitution</li>
            <li>Construire et exploiter le lagrangien</li>
          </ul>
        </div>
      `;
      controls.innerHTML = `<div class="button-row"><button data-action="restart">Recommencer</button></div>`;
      controls.querySelector("[data-action='restart']").addEventListener("click", reset);
    }

    function renderRestart() {
      controls.innerHTML = `<div class="button-row"><button data-action="restart">Recommencer</button></div>`;
      controls.querySelector("[data-action='restart']").addEventListener("click", reset);
    }

    function renderControls() {
      const interactive = screens[state.phase].interactive;
      if (interactive === "sameUtilityButtons") return renderSameUtilityButtons();
      if (interactive === "functionMachine") return renderFunctionMachine();
      if (interactive === "scoreBaskets") return renderScoreBaskets();
      if (interactive === "ordinalButtons") return renderOrdinalButtons();
      if (interactive === "welfareExercise") return renderWelfareExercise();
      if (interactive === "buildCI") return renderBuildCIControls();
      if (interactive === "compareCI") return renderCompareCIControls();
      if (interactive === "marginalFormulaInputs") return renderMarginalFormulaInputs();
      if (interactive === "marginalDemo") return renderMarginalDemoControls();
      if (interactive === "tmsExample") return renderTmsExample();
      if (interactive === "tmsFormulaExercise") return renderTmsFormulaExercise();
      if (interactive === "tmsExplore") return renderTmsExploreControls();
      if (interactive === "derivationSteps") return renderDerivationSteps();
      if (interactive === "demandCalcReveal") return renderDemandCalcReveal();
      if (interactive === "demandReveal") return renderDemandRevealControls();
      if (interactive === "substitutionB") return renderSubstitutionB();
      if (interactive === "substitutionOptimum") return renderSubstitutionOptimum();
      if (interactive === "lagrangianExercise") return renderLagrangianExercise();
      if (interactive === "cobbApplication") return renderCobbApplicationControls();
      if (interactive === "focCobbExercise") return renderFocCobbExercise();
      if (interactive === "finalClick") {
        controls.innerHTML = `<div class="button-row"><button data-action="back">Retour</button><button data-action="clear">Effacer le point</button></div>`;
        controls.querySelector("[data-action='back']").addEventListener("click", previous);
        controls.querySelector("[data-action='clear']").addEventListener("click", () => {
          state.finalGuess = null;
          setFeedback("Cliquez sur le point de tangence.");
          update();
        });
        return;
      }
      if (interactive === "marginalInputs") return renderMarginalInputs();
      if (interactive === "finalTms") return renderFinalTms();
      if (interactive === "conditionInput") return renderConditionInput();
      if (interactive === "solveInputs") return renderSolveInputs();
      if (interactive === "cdPractice") return renderCdPractice();
      if (interactive === "utilityPractice") return renderUtilityPractice();
      if (interactive === "restart") return renderRestart();
      if (interactive === "endSlide") return renderEndSlide();
      renderDefaultControls();
    }

    function renderJumpSelect() {
      jumpSelect.innerHTML = screens.map((screen, index) => `<option value="${index}">${sections[screen.sectionIndex]} - ${screen.title}</option>`).join("");
      jumpSelect.addEventListener("change", () => {
        state.phase = Number(jumpSelect.value);
        if (state.phase > 6 && state.ciPoints.length < 3) {
          state.ciPoints = [{ b: 2, c: 6 }, { b: 3, c: 4 }, { b: 6, c: 2 }];
        }
        if (screens[state.phase].interactive === "ordinalButtons") {
          state.ordinalStep = 1;
        }
        if (screens[state.phase].interactive === "marginalFormulaInputs") {
          state.marginalFormulaStep = 1;
        }
        if (screens[state.phase].interactive === "substitutionB") {
          state.substitutionStep = 1;
        }
        if (screens[state.phase].interactive === "substitutionOptimum") {
          state.substitutionOptimumSolved = false;
        }
        if (screens[state.phase].interactive === "derivationSteps") {
          state.derivationStep = 1;
        }
        if (screens[state.phase].interactive === "demandCalcReveal") {
          state.demandCalcStep = 1;
        }
        if (screens[state.phase].interactive === "demandReveal") {
          state.demandStep = 1;
        }
        if (screens[state.phase].practiceStep === "corner") {
          state.quasilinearCornerStep = 1;
        }
        setFeedback("Écran chargé pour vérification rapide.");
        update();
      });
    }

    function renderTemporarySkip() {
      const screen = screens[state.phase];
      if (!screen.interactive || screen.interactive === "restart") return;
      if (controls.querySelector("[data-action='next']") || controls.querySelector("[data-action='temp-skip']")) return;
      controls.insertAdjacentHTML("beforeend", `
        <div class="button-row">
          <button class="temporary-skip" data-action="temp-skip">Passer (temp)</button>
        </div>`);
      controls.querySelector("[data-action='temp-skip']").addEventListener("click", () => {
        if (screen.interactive === "utilityPractice" && screen.practiceStep === "corner" && state.quasilinearCornerStep < 3) {
          state.quasilinearCornerStep += 1;
          update();
          return;
        }
        next();
      });
    }

    function renderCoverPage() {
      app.classList.add("first-slide");
      app.classList.remove("no-visual");
      app.classList.remove("full-statement", "wide-controls", "lower-formula", "takeaway-slide", "side-controls");
      statement.innerHTML = `
        <div class="cover-page">
          <div class="cover-author">Auteur : Tanguy van Ypersele · © Tous droits réservés<br>Programmation effectuée à l'aide de l'IA.</div>
          <div class="cover-title">Fonction d'utilité</div>
          <div class="cover-subtitle">Microéconomie 1 — du graphique au calcul</div>
          <p>Dans ce module, vous allez passer de la représentation graphique des préférences à leur expression mathématique à l'aide d'une fonction d'utilité.</p>
          <p>Vous verrez comment calculer les demandes optimales avec deux méthodes : la substitution et le lagrangien.</p>
        </div>
      `;
      controls.innerHTML = `<button class="primary btn-start" id="coverStartBtn" type="button">Commencer →</button>`;
      feedback.textContent = "";
      graphWrap.innerHTML = "";
      legend.innerHTML = "";
      document.getElementById("coverStartBtn").addEventListener("click", () => {
        state.phase = 0;
        setFeedback("Repartons du graphique du chapitre précédent.");
        update();
      });
    }

    function reset() {
      state.phase = -1;
      state.ciPoints = [];
      state.finalGuess = null;
      state.functionMachineScore = null;
      state.ordinalStep = 1;
      state.marginalFormulaStep = 1;
      state.tmsExplorePoint = null;
      state.substitutionStep = 1;
      state.substitutionOptimumSolved = false;
      state.demandStep = 1;
      state.welfareExerciseAnswer = null;
      state.welfareExerciseChecked = false;
      state.quasilinearCornerStep = 1;
      state.scoreRows = {};
      setFeedback("");
      update();
    }

    function update() {
      if (state.phase === -1) {
        renderCoverPage();
        return;
      }
      const screen = screens[state.phase];
      app.classList.toggle("first-slide", false);
      app.classList.toggle("no-visual", !hasVisual(screen));
      app.classList.toggle("full-statement", Boolean(screen.fullStatement));
      app.classList.toggle("wide-controls", Boolean(screen.wideControls));
      app.classList.toggle("lower-formula", Boolean(screen.lowerFormula));
      app.classList.toggle("takeaway-slide", Boolean(screen.takeawaySlide));
      app.classList.toggle("side-controls", Boolean(screen.sideControls));
      jumpSelect.value = String(state.phase);
      graphTitle.textContent = screen.title;
      statement.innerHTML = `<p><span class="formula">${sections[screen.sectionIndex]}</span></p>${screen.html}`;
      updateProgress();
      updateLegend();
      renderControls();
      renderTemporarySkip();
      drawGraph();
    }

    renderJumpSelect();
    update();
  </script>
</body>
</html>
