<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fonction d'utilité</title>
  <style>
    :root {
      --paper: #f8f5ed;
      --panel: #fffdf8;
      --ink: #132536;
      --muted: #66747d;
      --line: #e4e2dc;
      --green: #176b52;
      --blue: #2156c5;
      --red: #b6483b;
      --gold: #c98c2d;
      --violet: #6d4bc2;
      --soft: #edf3f0;
      --button: #e8edf0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.34;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(360px, 38%) 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .app.no-visual {
      grid-template-columns: minmax(0, 1fr);
      max-width: 1180px;
      margin: 0 auto;
    }

    .progress-strip {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      align-items: stretch;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 253, 248, 0.94);
      box-shadow: 0 10px 26px rgba(19, 37, 54, 0.04);
    }

    .progress-strip::-webkit-scrollbar { display: none; }

    .progress-step {
      flex: 1 1 0;
      min-width: 108px;
      padding: 6px 9px;
      border: 1px solid #d6ded9;
      border-radius: 8px;
      background: #fbfaf5;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .progress-step.done {
      color: var(--green);
      background: #edf6f2;
    }

    .progress-step.current {
      color: white;
      background: var(--green);
      border-color: var(--green);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(19, 37, 54, 0.06);
      min-height: 0;
      overflow: hidden;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app.no-visual .side {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.85fr);
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      align-content: start;
      gap: 12px;
    }

    .app.no-visual .side h1,
    .app.no-visual .side .course-credit,
    .app.no-visual .side .jump-nav {
      grid-column: 1 / -1;
    }

    .app.no-visual .statement {
      grid-column: 1;
      font-size: 20px;
      line-height: 1.36;
      align-self: start;
    }

    .app.no-visual .controls {
      grid-column: 2;
      grid-row: 4;
      align-self: start;
    }

    .app.no-visual.wide-controls .side {
      grid-template-columns: minmax(0, 0.92fr) minmax(390px, 1.08fr);
    }

    .app.no-visual.lower-formula .formula-hero {
      margin-top: 74px;
    }

    .app.no-visual .feedback {
      grid-column: 1 / -1;
    }

    .app.no-visual.takeaway-slide .side {
      grid-template-columns: minmax(0, 1fr);
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
    }

    .app.no-visual.takeaway-slide .statement {
      grid-column: 1;
      font-size: 19px;
      line-height: 1.42;
    }

    .app.no-visual.takeaway-slide .ordinal-takeaway {
      font-size: inherit;
      line-height: inherit;
      padding: 18px 20px;
    }

    .app.no-visual.takeaway-slide .controls {
      grid-column: 1;
      grid-row: auto;
      min-height: 0;
      overflow: auto;
    }

    .app.no-visual.full-statement .side {
      grid-template-columns: minmax(0, 1fr) max-content;
    }

    .app.no-visual.full-statement .statement {
      grid-column: 1;
      font-size: 16px;
      line-height: 1.24;
      padding: 9px 11px;
    }

    .app.no-visual.full-statement .controls {
      grid-column: 1 / -1;
      grid-row: auto;
      align-self: start;
    }

    .app.no-visual.full-statement .button-row {
      justify-content: flex-end;
      flex-wrap: nowrap;
    }

    .app.no-visual.full-statement .statement p {
      margin-bottom: 5px;
    }

    .app.no-visual.full-statement .statement ul {
      margin: 2px 0 4px 18px;
      padding: 0;
    }

    .app.no-visual.full-statement .statement li {
      margin: 0 0 3px;
    }

    .app.no-visual.full-statement .formula {
      padding: 1px 5px;
      border-radius: 6px;
    }

    .app.no-visual.full-statement.side-controls .side {
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.82fr);
    }

    .app.no-visual.full-statement.side-controls.wide-controls .side {
      grid-template-columns: minmax(260px, 0.62fr) minmax(520px, 1.38fr);
    }

    .app.no-visual.full-statement.side-controls .statement {
      grid-row: 4;
      align-self: start;
    }

    .app.no-visual.full-statement.side-controls .controls {
      grid-column: 2;
      grid-row: 4;
      align-self: start;
      min-height: 0;
      max-height: 100%;
      overflow: auto;
      padding-right: 4px;
    }

    .app.no-visual.full-statement.side-controls .button-row {
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .definition-bubble {
      margin: 8px 0;
      padding: 12px 14px;
      border: 1px solid #cadbd3;
      border-left: 5px solid var(--green);
      border-radius: 10px;
      background: #f6fbf8;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
      font-size: inherit;
      line-height: inherit;
    }

    .definition-bubble p {
      margin-bottom: 5px;
    }

    .definition-bubble .formula {
      background: #fffefa;
      font-size: inherit;
    }

    .ordinal-takeaway {
      border-color: #d6d6e8;
      border-left-color: var(--violet);
      background: #fbf9ff;
      font-size: 15px;
      line-height: 1.25;
    }

    .ordinal-takeaway p {
      margin-bottom: 7px;
    }

    .ordinal-demo {
      margin: 8px 0;
      display: grid;
      grid-template-columns: minmax(220px, 0.9fr) minmax(240px, 1fr);
      gap: 10px;
      align-items: center;
    }

    .ordinal-demo svg {
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
    }

    .ordinal-demo ul {
      margin: 0;
      padding-left: 18px;
    }

    .feedback:empty,
    .app.no-visual.full-statement .feedback {
      display: none;
    }

    .app.no-visual .main {
      display: none;
    }

    h1, h2 {
      margin: 0;
      color: #5f6e77;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 23px;
      line-height: 1.05;
    }

    .course-credit {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .course-credit br {
      display: none;
    }

    .app:not(.first-slide) .side h1,
    .app:not(.first-slide) .side .course-credit {
      display: none;
    }

    .jump-nav select {
      width: 100%;
      min-width: 0;
      border: 1px solid #cfd8dc;
      border-radius: 10px;
      padding: 8px 10px;
      background: white;
      color: var(--ink);
      font: 700 15px Georgia, "Times New Roman", serif;
    }

    .statement,
    .feedback,
    .hint-box {
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffefa;
      overflow: auto;
    }

    .statement {
      min-height: 0;
      flex: 0 1 auto;
      font-size: 17px;
      line-height: 1.3;
    }

    .statement p,
    .feedback p,
    .hint-box p { margin: 0 0 6px; }
    .statement p:last-child,
    .feedback p:last-child,
    .hint-box p:last-child { margin-bottom: 0; }

    .feedback {
      min-height: 46px;
      border-color: #d3ded9;
      background: #f7fbf8;
      color: var(--green);
      font-weight: 700;
      font-size: 15px;
      line-height: 1.28;
    }

    .feedback.error {
      border-color: #ecd0c9;
      background: #fff6f3;
      color: var(--red);
    }

    .controls {
      display: grid;
      gap: 8px;
    }

    .button-row,
    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 8px 13px;
      min-height: 44px;
      color: var(--ink);
      background: var(--button);
      font: 700 15px Georgia, "Times New Roman", serif;
      cursor: pointer;
    }

    button.primary {
      background: var(--green);
      color: white;
    }

    button.temporary-skip {
      background: #fff3c4;
      border: 1px solid #d7b957;
      color: #5a4310;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    input {
      width: 112px;
      border: 1px solid #cfd8dc;
      border-radius: 9px;
      padding: 8px 10px;
      min-height: 44px;
      background: white;
      color: var(--ink);
      font: 700 15px Georgia, "Times New Roman", serif;
    }

    input.mini-input {
      width: 58px;
      padding: 6px 8px;
    }

    input.exp-input {
      width: 52px;
      padding: 2px 4px;
      font-size: 11px;
      line-height: 1;
      min-height: 0;
      height: 22px;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      border: 1px solid #cfd8dc;
      border-radius: 9px;
      padding: 9px 10px;
      background: white;
      color: var(--ink);
      font: 15px Georgia, "Times New Roman", serif;
      resize: vertical;
    }

    label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    .power-answer {
      display: grid;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fffefa;
    }

    .power-answer-title {
      color: var(--ink);
      font-weight: 700;
    }

    .power-term {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink);
      font-weight: 700;
    }

    .power-term sup {
      display: inline-flex;
      align-items: center;
      font-size: 0.7em;
      vertical-align: baseline;
      transform: translateY(-52%);
    }

    .exercise-block {
      padding: 12px 14px;
      border: 1px solid #cadbd3;
      border-radius: 10px;
      background: #f7fbf8;
      display: grid;
      gap: 14px;
    }

    .app.no-visual.full-statement.side-controls .exercise-block {
      gap: 9px;
      padding: 10px 12px;
    }

    .welfare-exercise-controls {
      display: grid;
      gap: 10px;
    }

    .exercise-question {
      display: grid;
      gap: 7px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffefa;
    }

    .exercise-question-title {
      color: var(--ink);
      font-weight: 700;
    }

    .exercise-choice.selected {
      background: var(--green);
      color: white;
    }

    .exercise-correction {
      padding: 13px 15px;
      border: 1px solid #cadbd3;
      border-left: 5px solid var(--green);
      border-radius: 10px;
      background: #f6fbf8;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.3;
    }

    .exercise-correction p {
      margin: 0 0 7px;
    }

    .exercise-correction p:last-child {
      margin-bottom: 0;
    }

    .demand-cobb-block {
      width: min(100%, 760px);
      margin: 0 0 12px;
      padding: 12px 14px;
      border: 1px solid #cadbd3;
      border-left: 5px solid var(--green);
      border-radius: 10px;
      background: #f7fbf8;
    }

    .demand-cobb-block p {
      margin-bottom: 5px;
    }

    .foc-exercise {
      align-self: start;
      min-width: 360px;
    }

    .foc-line {
      display: grid;
      grid-template-columns: max-content minmax(170px, 1fr) max-content;
      gap: 8px;
      align-items: center;
    }

    .foc-line input {
      width: 100%;
      min-width: 0;
    }

    .cobb-application-block {
      gap: 6px;
      padding: 10px 12px;
      line-height: 1.18;
    }

    .cobb-application-block p {
      margin: 0 0 4px;
    }

    .cobb-application-block .formula {
      padding: 2px 5px;
      font-size: 0.95em;
    }

    .compact-summary-block {
      gap: 5px;
      padding: 10px 12px;
      line-height: 1.14;
      font-size: 14px;
    }

    .compact-summary-block p {
      margin: 0 0 3px;
    }

    .compact-summary-block .formula {
      padding: 2px 5px;
      font-size: 0.93em;
    }

    .piecewise-display {
      display: grid;
      gap: 8px;
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.16;
    }

    .piecewise-function {
      display: grid;
      grid-template-columns: max-content max-content 1fr;
      gap: 8px;
      align-items: start;
      padding: 7px 8px;
      border: 1px solid #dbe5e0;
      border-radius: 8px;
      background: #fffefa;
    }

    .piecewise-brace {
      font-size: 56px;
      line-height: 0.78;
      font-weight: 400;
      color: var(--ink);
      transform: translateY(2px);
    }

    .piecewise-cases {
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 12px;
      row-gap: 6px;
    }

    .piecewise-value,
    .piecewise-condition {
      white-space: nowrap;
    }

    .exercise-block .inline-feedback {
      display: none;
      min-height: 0;
      width: 100%;
      font-size: 15px;
      line-height: 1.25;
    }

    .lagrangian-answer-row {
      display: grid;
      grid-template-columns: max-content minmax(260px, 1fr);
      gap: 10px;
      align-items: center;
    }

    .lagrangian-answer-row .formula {
      font-size: 18px;
      white-space: nowrap;
    }

    .lagrangian-answer-row input {
      width: 100%;
      min-width: 0;
    }

    .wide-expression-input {
      width: 100%;
      min-width: min(100%, 520px);
    }

    .token-palette {
      align-content: flex-start;
    }

    .app.no-visual.full-statement.side-controls .token-palette {
      max-height: 110px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .app.no-visual.full-statement.side-controls .token-palette button {
      padding: 6px 9px;
      font-size: 14px;
    }

    .formula {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 7px;
      background: #f2f5f3;
      border: 1px solid #d9e2de;
      color: var(--ink);
      font-weight: 700;
      white-space: nowrap;
      max-width: 100%;
    }

    .math-frac {
      display: inline-grid;
      grid-template-rows: auto auto;
      align-items: center;
      justify-items: center;
      vertical-align: middle;
      line-height: 1.05;
      margin: 0 2px;
    }

    .math-frac > span:first-child {
      border-bottom: 1px solid currentColor;
      padding: 0 3px 2px;
    }

    .math-frac > span:last-child {
      padding: 2px 3px 0;
    }

    .app.no-visual .formula {
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .formula-hero {
      display: block;
      width: 100%;
      padding: 22px 24px;
      border: 1px solid #d9e2de;
      border-radius: 12px;
      background: #f7fbf8;
      color: var(--ink);
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 700;
      text-align: center;
      line-height: 1.12;
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: #fffefa;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .score-table th,
    .score-table td {
      padding: 5px 7px;
      border-bottom: 1px solid #ece7dd;
      text-align: left;
    }

    .score-table tr:last-child td {
      border-bottom: 0;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
    }

    .graph-title {
      color: #5f6e77;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .graph-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
    }

    svg {
      width: min(760px, 100%, 78vh);
      height: auto;
      border: 1px solid #d5e0dc;
      border-radius: 10px;
      background: #fbfaf5;
      touch-action: none;
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 24px;
      height: 5px;
      border-radius: 999px;
      background: var(--green);
    }

    /* ── Méthode par substitution : chaîne de dérivation ── */
    .derivation-chain {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px;
      background: #f7fbf8;
      border: 1px solid #d9e2de;
      border-radius: 10px;
    }

    .dc-step {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .dc-step .dc-reason {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      white-space: nowrap;
    }

    .dc-conclusion {
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid #d9e2de;
      font-size: 16px;
      font-weight: 700;
    }

    .dc-block {
      padding: 10px 14px;
      border-left: 3px solid var(--green);
      background: #f7fbf8;
      border-radius: 0 8px 8px 0;
    }

    .dc-block + .dc-block {
      margin-top: 8px;
    }

    .dc-block .dc-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 5px;
    }

    .dc-block p {
      margin: 3px 0;
      font-size: 15px;
    }

    .dc-result {
      font-weight: 700;
      color: var(--green);
    }

    /* ── Utilitées marginales ── */
    .marginal-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .symbol-palette {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #eef2ff;
      border: 1px solid #c4cef5;
      border-radius: 10px;
    }

    .symbol-palette .palette-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      margin-right: 4px;
    }

    .symbol-palette button {
      font-size: 16px;
      padding: 5px 14px;
      min-height: 36px;
      border-radius: 8px;
      background: white;
      border: 1px solid #c4cef5;
      color: var(--blue);
      font-weight: 700;
    }

    .symbol-palette button:hover {
      background: #e0e8ff;
    }

    .formula-hero.compact {
      padding: 14px 20px;
      font-size: clamp(18px, 2.8vw, 28px);
    }

    /* ── Cover page ── */
    .cover-page { display: flex; flex-direction: column; gap: 12px; }
    .cover-author { font-size: 12px; color: var(--muted); }
    .cover-title { font-size: 1.5em; font-weight: 700; color: var(--ink); }
    .cover-subtitle { font-size: 1em; color: var(--muted); font-style: italic; margin-top: -4px; }
    .btn-start { justify-self: start; margin-top: 4px; padding: 12px 32px; font-size: 1.05em; }

    /* ── End slide ── */
    .end-slide { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 28px 20px; min-height: 100%; }
    .context-diagram { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .context-box { width: 150px; border-radius: 14px; padding: 16px 12px; text-align: center; border: 2px solid var(--line); background: #fbfaf5; }
    .context-box.done { border-color: #a8d4c2; background: #edf6f2; }
    .context-box.current { border-color: var(--green); background: #fff; box-shadow: 0 0 0 4px rgba(23,107,82,.12), 0 8px 24px rgba(23,107,82,.14); }
    .context-box.upcoming { opacity: 0.45; }
    .context-tag { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
    .context-box.done .context-tag, .context-box.current .context-tag { color: var(--green); }
    .context-name { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
    .context-sub { font-size: 12px; color: var(--muted); font-style: italic; }
    .context-op { font-size: 26px; color: var(--muted); font-weight: 300; }

<body>
  <div class="app">
    <div class="progress-strip" id="progress"></div>

    <aside class="panel side">
      <h1>Fonction d'utilité</h1>
      <div class="course-credit">Auteur : Tanguy van Ypersele - Tous droits réservés<br>Programmation effectuée à l'aide de l'IA.</div>
      <div class="jump-nav">
        <select id="jumpSelect" aria-label="Aller à une partie"></select>
      </div>
      <div class="statement" id="statement"></div>
      <div class="controls" id="controls"></div>
      <div class="feedback" id="feedback">Repartons du graphique du chapitre précédent.</div>
    </aside>

    <main class="panel main">
      <div class="graph-title" id="graphTitle">Des préférences aux fonctions d'utilité</div>
      <div class="graph-wrap" id="graphWrap"></div>
      <div class="legend" id="legend"></div>
    </main>
  </div>

  <script>
    const config = {
      size: 560,
      margin: 64,
      maxB: 12,
      maxC: 10,
      income: 120,
      pB: 10,
      pC: 20
    };

    const sections = [
      "1. Du graphique au calcul",
      "2. Fonction d'utilité : classer les paniers",
      "3. Courbes d'indifférence comme niveaux d'utilité",
      "4. Utilité marginale et calcul du TMS",
      "5. Programme du consommateur",
      "6. Méthode par substitution",
      "7. Le Lagrangien"
    ];

    const screens = [
      { title: "Rappel graphique", sectionIndex: 0, mode: "recap", html: `
        <p>Nous savons déjà déterminer graphiquement le choix optimal du consommateur.</p>
        <p>Le graphique représente un problème de choix entre deux biens, B et C. Le consommateur dispose d’un revenu donné, et chaque bien a un prix : pB pour le bien B et pC pour le bien C.</p>
        <p>Ces prix et ce revenu déterminent l’ensemble budgétaire : c’est l’ensemble de tous les paniers que le consommateur peut acheter. Un panier appartient à cet ensemble lorsqu’il respecte la contrainte de budget.</p>
        <p>Le consommateur aimerait atteindre des paniers situés sur des courbes d’indifférence plus élevées, car ils sont préférés. Mais les paniers préférés qui se trouvent au-dessus de la contrainte budgétaire ne sont pas accessibles : ils coûtent plus cher que son revenu.</p>
        <p>Le consommateur choisit donc le meilleur panier parmi ceux qui lui sont accessibles. À l’optimum, la courbe d’indifférence est tangente à la contrainte budgétaire.</p>
        <p>Cette approche graphique est un outil très puissant pour analyser les choix dans un univers à deux biens. Mais, dans la réalité, nos décisions de consommation portent souvent sur un très grand nombre de biens.</p>
        <p>Nous allons donc introduire les fonctions d’utilité, qui permettent de représenter les préférences de manière plus formelle et d’analyser le choix du consommateur dans des contextes plus généraux.</p>` },
      { title: "Pourquoi une fonction ?", sectionIndex: 0, mode: "formula", fullStatement: true, html: `
        <p>Pour aller au-delà du cas de deux biens, nous allons représenter les préférences à l’aide d’une fonction.</p>
        <p>Une fonction d’utilité est une fonction qui représente les préférences d’un consommateur sur l’ensemble des paniers de biens possibles.</p>
        <p>Chaque panier est décrit par les quantités consommées de chaque bien :</p>
        <p><span class="formula">x = (x<sub>1</sub>, x<sub>2</sub>, x<sub>3</sub>, ..., x<sub>n</sub>)</span></p>
        <p>où :</p>
        <ul>
          <li><span class="formula">x<sub>1</sub></span> représente la quantité du bien 1,</li>
          <li><span class="formula">x<sub>2</sub></span> la quantité du bien 2,</li>
          <li><span class="formula">...</span></li>
          <li><span class="formula">x<sub>n</sub></span> la quantité du bien n.</li>
        </ul>
        <p>La fonction d’utilité associe alors un nombre réel à chaque panier :</p>
        <p><span class="formula">u : X → R</span></p>
        <p><span class="formula">x ↦ u(x)</span></p>
        <p>où :</p>
        <ul>
          <li><span class="formula">X</span> est l’ensemble des paniers possibles,</li>
          <li><span class="formula">R</span> désigne l’ensemble des nombres réels.</li>
        </ul>
        <p>L’idée essentielle est que ce nombre permet de classer les paniers.</p>
        <p>À retenir : les fonctions d’utilité permettent d’analyser les choix du consommateur même lorsque les biens sont très nombreux.</p>` },
      { title: "Une fonction : entrée et score", sectionIndex: 1, mode: "formula", formula: "u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup>", interactive: "functionMachine", html: `
        <p>Commençons avec deux biens pour garder le lien avec le graphique.</p>
        <p>On donne une quantité de B et une quantité de C.</p>
        <p>La fonction calcule un score.</p>
        <p>Ici, on utilise une Cobb-Douglas avec les exposants 1/2 et 1/2 :</p>
        <p><span class="formula">u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup></span></p>
        <p>Sur la droite, la fonction vous permet d’introduire les paniers que vous voulez : vous obtiendrez alors le score de chaque panier.</p>` },
      { title: "Définition formelle", sectionIndex: 1, mode: "formula", fullStatement: true, html: `
        <p>L’idée essentielle est que la fonction d’utilité représente exactement les préférences du consommateur.</p>
        <p>Ainsi, si le consommateur préfère le panier <span class="formula">x</span> au panier <span class="formula">y</span>, alors la fonction attribue une utilité plus élevée à <span class="formula">x</span> :</p>
        <p><span class="formula">x ≻ y ⇒ u(x) > u(y)</span></p>
        <p>Mais la réciproque doit également être vraie : si la fonction attribue une utilité plus élevée à <span class="formula">x</span>, alors cela signifie que le consommateur préfère effectivement <span class="formula">x</span> à <span class="formula">y</span> :</p>
        <p><span class="formula">u(x) > u(y) ⇒ x ≻ y</span></p>
        <div class="definition-bubble">
          <p>Autrement dit, la fonction d’utilité ne fait pas qu’être cohérente avec les préférences : elle les représente entièrement.</p>
          <p>On peut donc écrire :</p>
          <p><span class="formula">x ≻ y ⟺ u(x) > u(y)</span></p>
          <p>et, de même,</p>
          <p><span class="formula">x ∼ y ⟺ u(x) = u(y)</span></p>
        </div>
        <p>À retenir : une fonction d’utilité est une manière de traduire les préférences du consommateur en nombres afin de pouvoir classer les paniers.</p>` },
      { title: "Utilité ordinale", sectionIndex: 1, mode: "formula", formula: "v = 10u", interactive: "ordinalButtons", html: `
        <p>L'utilité classe les paniers.</p>
        <p>Elle ne mesure pas le bonheur.</p>
        <p>En effet, beaucoup de fonctions d'utilité différentes peuvent représenter les mêmes préférences.</p>` },
      { title: "À retenir", sectionIndex: 1, mode: "formula", takeawaySlide: true, html: `
        <div class="definition-bubble ordinal-takeaway">
          <p><strong>À retenir : les fonctions d'utilité sont ordinales</strong></p>
          <p>Une fonction d'utilité sert uniquement à classer les paniers de consommation.</p>
          <p>Si un panier reçoit une utilité plus élevée qu'un autre, cela signifie simplement qu'il est préféré.</p>
          <p>En revanche, la valeur absolue de l'utilité n'a aucune signification en elle-même. Dire qu'un panier a une utilité de 100 n'a pas plus de sens que dire qu'un autre a une utilité de 10, tant qu'on ne sait pas à quels paniers ces nombres correspondent.</p>
          <p>Seul le classement compte.</p>
          <p>C'est pourquoi il est également impossible de comparer directement les utilités de deux individus différents. Une utilité de 100 pour Alice et une utilité de 10 pour Bob ne permettent absolument pas de conclure qu'Alice est « dix fois plus satisfaite » que Bob.</p>
          <p>Les fonctions d'utilité permettent de comparer des paniers pour un même individu, mais pas de comparer le niveau de satisfaction entre individus.</p>
        </div>` },
      { title: "Exercice : réallocation", sectionIndex: 1, mode: "formula", takeawaySlide: true, interactive: "welfareExercise", html: `
        <p><strong>Exercice : une réallocation est-elle souhaitable ?</strong></p>
        <p>Deux consommateurs, Alice et Bob, consomment le même bien.</p>
        <p>On envisage de transférer une unité de ce bien d'Alice vers Bob.</p>
        <p>Les fonctions d'utilité utilisées par l'économiste indiquent que :</p>
        <ul>
          <li>Alice perd <span class="formula">0,001</span> unité d'utilité lorsqu'elle cède cette unité ;</li>
          <li>Bob gagne <span class="formula">1000</span> unités d'utilité lorsqu'il la reçoit.</li>
        </ul>` },
      { title: "Avantage de l'outil", sectionIndex: 1, mode: "formula", formula: "CI, TMS, choix optimal", takeawaySlide: true, html: `
        <p>La fonction d'utilité nous permet de calculer les trois objets du raisonnement graphique: les courbes d'indifférence, le TMS et le choix optimal.</p>` },
      { title: "Scores et classement", sectionIndex: 2, mode: "baskets", interactive: "scoreBaskets", html: `
        <p>Le graphique montre quatre paniers.</p>
        <p>Chaque panier a des coordonnées : une quantité de B et une quantité de C.</p>
        <p>À gauche, entrez ces coordonnées dans la fonction.</p>
        <p>Le tableau se remplit avec les scores.</p>
        <p>À retenir : le score permet de classer les paniers selon les préférences.</p>` },
      { title: "Construire une CI", sectionIndex: 2, mode: "buildCI", interactive: "buildCI", html: `
        <p>Une courbe d'indifférence garde le même niveau d'utilité.</p>
        <p>Ici, le niveau choisi est <span class="formula">√12</span>.</p>
        <p>Comme <span class="formula">u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup></span>, cela revient à chercher les paniers tels que <span class="formula">B<sup>1/2</sup>C<sup>1/2</sup>=√12</span>, c'est-à-dire la fonction <span class="formula">C=12/B</span>.</p>
        <p>Cliquez sur trois paniers différents de cette courbe.</p>` },
      { title: "Comparer les niveaux", sectionIndex: 2, mode: "compareCI", interactive: "compareCI", html: `
        <p>Chaque courbe correspond à un niveau d'utilité.</p>
        <p>Le graphique affiche trois courbes : <span class="formula">U=2</span>, <span class="formula">U=3</span> et <span class="formula">U=4</span>.</p>
        <p>À retenir : une courbe plus haute correspond à une utilité plus grande.</p>` },
      { title: "Utilités marginales", sectionIndex: 3, mode: "formula", formula: "UM_B = ∂u/∂B     UM_C = ∂u/∂C", interactive: "marginalFormulaInputs", fullStatement: true, sideControls: true, wideControls: true, html: `
        <p>Commençons par définir les utilités marginales.</p>
        <p>L'utilité marginale du bien B est la dérivée partielle de la fonction d'utilité par rapport à B :</p>
        <p><span class="formula">UM<sub>B</sub> = ∂u / ∂B</span></p>
        <p>L'utilité marginale du bien C est la dérivée partielle de la fonction d'utilité par rapport à C :</p>
        <p><span class="formula">UM<sub>C</sub> = ∂u / ∂C</span></p>` },
      { title: "Approximer une variation d'utilité", sectionIndex: 3, mode: "formula", formula: "ΔU ≈ ΔB × UM_B + ΔC × UM_C", fullStatement: true, sideControls: true, html: `
        <p>Une utilité marginale permet d'approximer l'effet d'une petite variation de quantité.</p>
        <p>Si on change seulement B de <span class="formula">ΔB</span>, alors la variation d'utilité est approximativement :</p>
        <p><span class="formula">ΔU ≈ ΔB × UM<sub>B</sub></span></p>
        <p>Si on change seulement C de <span class="formula">ΔC</span>, alors :</p>
        <p><span class="formula">ΔU ≈ ΔC × UM<sub>C</sub></span></p>
        <p>Si les deux biens changent en même temps, on additionne les deux effets :</p>
        <p><span class="formula">ΔU ≈ ΔB × UM<sub>B</sub> + ΔC × UM<sub>C</sub></span></p>` },
      { title: "Rappel graphique du TMS", sectionIndex: 3, mode: "tmsAnimation", html: `
        <p>Graphiquement, le TMS mesure combien de C le consommateur est prêt à abandonner pour obtenir un peu plus de B, tout en restant sur la même courbe d'indifférence.</p>
        <p>On augmente B de <span class="formula">ΔB</span>, puis on diminue C de <span class="formula">ΔC</span> pour revenir sur la même courbe.</p>
        <p>En valeur absolue, le TMS correspond au rapport <span class="formula">-ΔC / ΔB</span>.</p>` },
      { title: "Rester sur la même CI", sectionIndex: 3, mode: "tmsBalance", html: `
        <p>On part d'un panier qui donne un niveau d'utilité <span class="formula">U</span>.</p>
        <p>Une hausse de B augmente l'utilité d'environ <span class="formula">ΔB × UM<sub>B</sub></span>.</p>
        <p>Pour rester sur la même courbe d'indifférence, il faut réduire C afin de compenser exactement ce gain.</p>
        <p>La variation totale d'utilité doit donc être nulle :</p>
        <p><span class="formula">ΔU = ΔB × UM<sub>B</sub> + ΔC × UM<sub>C</sub> = 0</span></p>
        <p>En réarrangeant cette égalité, on obtient le taux auquel C doit varier quand B augmente :</p>
        <p><span class="formula">-ΔC / ΔB = UM<sub>B</sub> / UM<sub>C</sub></span></p>
        <p>Le TMS est donc :</p>
        <p><span class="formula">TMS = -ΔC / ΔB = UM<sub>B</sub> / UM<sub>C</sub></span></p>` },
      { title: "Exercice : calculer le TMS", sectionIndex: 3, mode: "formula", formula: "TMS = UM_B / UM_C", interactive: "tmsFormulaExercise", html: `
        <p>Vous connaissez maintenant les deux utilités marginales :</p>
        <p><span class="formula">UM<sub>B</sub> = (1/2)B<sup>-1/2</sup>C<sup>1/2</sup></span></p>
        <p><span class="formula">UM<sub>C</sub> = (1/2)B<sup>1/2</sup>C<sup>-1/2</sup></span></p>
        <p>Calculez le TMS.</p>` },
      { title: "Le TMS dépend du panier", sectionIndex: 3, mode: "tmsExplore", interactive: "tmsExplore", html: `
        <p>Le TMS n'est pas un nombre fixe : il dépend du panier où l'on se trouve.</p>
        <p>Cliquez sur un panier du graphique.</p>
        <p>La courbe d'indifférence passant par ce panier sera tracée, puis les valeurs de <span class="formula">UM<sub>B</sub></span>, <span class="formula">UM<sub>C</sub></span> et du TMS seront calculées à gauche.</p>` },
      { title: "Retour au choix du consommateur", sectionIndex: 3, mode: "recap", html: `
        <p>Revenons au choix optimal du consommateur avec la Cobb-Douglas <span class="formula">u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup></span>.</p>
        <p>Au panier choisi <span class="formula">E=(6 ; 3)</span>, deux conditions sont vérifiées :</p>
        <p><span class="formula">Condition 1 : p<sub>B</sub>B + p<sub>C</sub>C = R</span></p>
        <p>Ici : <span class="formula">10 × 6 + 20 × 3 = 120</span>. Le budget est entièrement dépensé.</p>
        <p><span class="formula">Condition 2 : TMS = p<sub>B</sub>/p<sub>C</sub></span></p>
        <p>Ici : <span class="formula">TMS = C/B = 3/6 = 0,5</span> et <span class="formula">p<sub>B</sub>/p<sub>C</sub> = 10/20 = 0,5</span>.</p>
        <p>Nous allons maintenant voir que le calcul mathématique permet d'obtenir exactement ces deux conditions.</p>` },
      { title: "Programme du consommateur", sectionIndex: 4, mode: "problem", html: `
        <p>Le consommateur choisit le panier qu'il préfère parmi les paniers accessibles.</p>
        <p>On écrit ce choix sous forme de programme :</p>
        <p><span class="formula">max u(B,C)</span></p>
        <p>sous la contrainte que <span class="formula">p<sub>B</sub>B + p<sub>C</sub>C &le; R</span>.</p>
        <p>À retenir : on cherche le meilleur panier dans le budget.</p>` },
      { title: "Budget saturé", sectionIndex: 4, mode: "problem", html: `
        <p>Si le consommateur aime avoir plus de biens, il ne garde pas de revenu inutilisé.</p>
        <p>Il dépense tout son budget.</p>
        <p>La contrainte devient une égalité :</p>
        <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span></p>
        <p>À retenir : l'optimum est sur la droite de budget.</p>` },
      { title: "Deux conditions", sectionIndex: 4, mode: "condition", html: `
        <p>Le point de tangence donne deux conditions.</p>
        <p>D'abord, le budget est dépensé :</p>
        <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span></p>
        <p>Ensuite, le TMS est égal au prix relatif :</p>
        <p><span class="formula">TMS = p<sub>B</sub>/p<sub>C</sub></span></p>
        <p>Dans notre exemple : <span class="formula">10B + 20C = 120</span> et <span class="formula">C/B = 10/20</span>.</p>` },
      { title: "Méthode par substitution", sectionIndex: 5, mode: "substitution", interactive: "substitutionB", html: `
        <p>Première méthode : utiliser la contrainte budgétaire.</p>
        <p>Rappelons-nous que lorsqu'on choisit B, on n'a plus le choix sur C.</p>
        <p>En effet, on sait que le consommateur va dépenser tout ce qui reste dans la consommation de C : la totalité du budget sera dépensée.</p>
        <p>Nous allons d'abord le faire dans le cas particulier, puis dans le cas général.</p>` },
      { title: "Une seule variable", sectionIndex: 5, mode: "substitution", html: `
        <p>On remplace maintenant C dans l'utilité.</p>
        <p>Dans le cas général, la contrainte donne :</p>
        <p><span class="formula">C = (R - p<sub>B</sub>B)/p<sub>C</sub></span></p>
        <p>La fonction d'utilité devient donc une fonction d'une seule variable :</p>
        <p><span class="formula">u(B) = u(B, (R - p<sub>B</sub>B)/p<sub>C</sub>)</span></p>
        <p>Dans notre exemple, cela donne <span class="formula">u(B) = B<sup>1/2</sup>(6 - B/2)<sup>1/2</sup></span>.</p>` },
      { title: "Maximiser u(B)", sectionIndex: 5, mode: "substitution", interactive: "substitutionOptimum", html: `
        <p>Il faut maintenant maximiser cette fonction de B.</p>
        <p><span class="formula">u(B) = B<sup>1/2</sup>(6 - B/2)<sup>1/2</sup></span>.</p>
        <p>Sur le graphique, cherchez la quantité de B qui donne l'utilité la plus élevée.</p>
        <p>Une fois cette quantité trouvée, nous verrons que la pente de la courbe est nulle au sommet.</p>` },
      { title: "Condition du maximum", sectionIndex: 5, mode: "substitution", interactive: "derivationSteps", html: `
        <p>Au sommet de la courbe <span class="formula">u(B)</span>, la pente est nulle.</p>
        <p>La règle de dérivation composée relie cette condition aux utilités marginales et aux prix.</p>` },
      { title: "Demandes de B et C", sectionIndex: 5, mode: "formula", fullStatement: true, sideControls: true, interactive: "demandCalcReveal", html: `
        <p>On applique les deux conditions à <span class="formula">u(B,C) = B<sup>1/2</sup>C<sup>1/2</sup></span>.</p>
        <p>Condition de tangence : <span class="formula">TMS = p<sub>B</sub>/p<sub>C</sub></span></p>
        <p>Contrainte saturée : <span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span></p>
        <p>Ces deux équations permettent de calculer les quantités optimales <span class="formula">B*</span> et <span class="formula">C*</span>.</p>` },
      { title: "Bilan de la substitution", sectionIndex: 5, mode: "formula", fullStatement: true, html: `
        <p>La méthode par substitution confirme que l'optimum satisfait deux conditions :</p>
        <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span> — le budget est entièrement dépensé.</p>
        <p><span class="formula">TMS = p<sub>B</sub>/p<sub>C</sub></span> — la pente de la courbe d'indifférence égale la pente de la droite de budget.</p>
        <p>Le calcul retrouve exactement le raisonnement graphique.</p>
        <p>Lorsque le problème comporte plusieurs variables ou plusieurs contraintes, la substitution devient vite lourde. On utilise alors le Lagrangien.</p>` },
      { title: "Pourquoi le Lagrangien ?", sectionIndex: 6, mode: "problem", html: `
        <p>Au XVIII<sup>e</sup> siècle, le mathématicien français Joseph-Louis Lagrange a développé une méthode permettant de maximiser une fonction lorsqu’une contrainte doit être respectée.</p>
        <p>C’est exactement notre problème ici : le consommateur cherche à maximiser sa satisfaction tout en respectant sa contrainte de budget.</p>
        <p>Notons ici que, pour que notre problème soit bien celui résolu par Lagrange, nous avons utilisé le fait que, puisqu'il y a non-satiété, le consommateur dépensera toujours la totalité de son budget.</p>
        <p>Le lagrangien combine donc ces deux éléments dans une même expression mathématique afin de trouver le meilleur panier possible sans dépasser le revenu disponible.</p>` },
      { title: "Construire le Lagrangien", sectionIndex: 6, mode: "lagrangian", interactive: "lagrangianExercise", fullStatement: true, sideControls: true, html: `
        <p>Il propose de transformer un problème compliqué en quelque chose de simple.</p>
        <p>Il construit ce que nous appelons aujourd'hui le lagrangien :</p>
        <p><span class="formula">𝓛(x<sub>1</sub>, x<sub>2</sub>, λ) = u(x<sub>1</sub>, x<sub>2</sub>) + λ(R - p<sub>1</sub>x<sub>1</sub> - p<sub>2</sub>x<sub>2</sub>)</span></p>
        <p>C'est une fonction qui est composée de la fonction d'utilité plus <span class="formula">λ</span> fois la contrainte budgétaire.</p>` },
      { title: "Conditions du premier ordre", sectionIndex: 6, mode: "derivatives", interactive: "focCobbExercise", fullStatement: true, sideControls: true, html: `
        <p>Lagrange montre que les valeurs qui satisfont le système d'équations suivant sont les quantités demandées et le multiplicateur de Lagrange, qui ne nous intéresse pas pour le moment.</p>
        <p>On part du lagrangien :</p>
        <p><span class="formula">𝓛(x<sub>1</sub>, x<sub>2</sub>, λ) = u(x<sub>1</sub>, x<sub>2</sub>) + λ(m - p<sub>1</sub>x<sub>1</sub> - p<sub>2</sub>x<sub>2</sub>)</span></p>
        <p>La solution optimale doit alors vérifier :</p>
        <div class="definition-bubble">
          <p><span class="formula"><span class="math-frac"><span>∂𝓛</span><span>∂x<sub>1</sub></span></span> = <span class="math-frac"><span>∂u</span><span>∂x<sub>1</sub></span></span> - λp<sub>1</sub> = 0</span></p>
          <p><span class="formula"><span class="math-frac"><span>∂𝓛</span><span>∂x<sub>2</sub></span></span> = <span class="math-frac"><span>∂u</span><span>∂x<sub>2</sub></span></span> - λp<sub>2</sub> = 0</span></p>
          <p><span class="formula"><span class="math-frac"><span>∂𝓛</span><span>∂λ</span></span> = m - p<sub>1</sub>x<sub>1</sub> - p<sub>2</sub>x<sub>2</sub> = 0</span></p>
        </div>` },
      { title: "Des conditions aux quantités", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cobbApplication", html: `
        <p>Les conditions du premier ordre obtenues à partir du lagrangien sont :</p>
        <p><span class="formula">∂𝓛/∂x<sub>1</sub> = 0</span>, <span class="formula">∂𝓛/∂x<sub>2</sub> = 0</span>, <span class="formula">∂𝓛/∂λ = 0</span>.</p>
        <p>Les deux premières conditions permettent de retrouver une condition de tangence.</p>
        <p>La troisième condition impose le respect de la contrainte budgétaire.</p>
        <p>Pour calculer les quantités optimales, il faut donc utiliser ces deux informations ensemble.</p>`,
        cobbHtml: `
          <p><strong>Application Cobb-Douglas</strong></p>
          <p><span class="formula">u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup></span></p>
          <p><span class="formula">p<sub>B</sub></span>, <span class="formula">p<sub>C</sub></span>, <span class="formula">R</span></p>
          <p>Objectif : retrouver <span class="formula">B*</span> et <span class="formula">C*</span>.</p>` },
      { title: "Les deux premières conditions", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cobbApplication", html: `
        <p>Les deux premières équations permettent d'éliminer le multiplicateur <span class="formula">λ</span>.</p>
        <p>En divisant l'une par l'autre, on obtient :</p>
        <p><span class="formula">UM<sub>1</sub>/UM<sub>2</sub> = p<sub>1</sub>/p<sub>2</sub></span>.</p>
        <p>Cette condition indique que, au panier optimal, le taux marginal de substitution est égal au rapport des prix :</p>
        <p><span class="formula">TMS = p<sub>1</sub>/p<sub>2</sub></span>.</p>
        <p>Elle fournit une première relation entre les quantités consommées.</p>`,
        cobbHtml: `
          <p><strong>Application Cobb-Douglas</strong></p>
          <p>Pour <span class="formula">u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup></span> :</p>
          <p><span class="formula">UM<sub>B</sub> = (1/2)B<sup>-1/2</sup>C<sup>1/2</sup></span></p>
          <p><span class="formula">UM<sub>C</sub> = (1/2)B<sup>1/2</sup>C<sup>-1/2</sup></span></p>
          <p>Donc :</p>
          <p><span class="formula">UM<sub>B</sub>/UM<sub>C</sub> = C/B</span></p>` },
      { title: "La tangence", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cobbApplication", html: `
        <p>La condition de tangence s'écrit :</p>
        <p><span class="formula">TMS(x<sub>1</sub>,x<sub>2</sub>) = p<sub>1</sub>/p<sub>2</sub></span>.</p>
        <p>Elle décrit le point où la courbe d'indifférence est tangente à la droite de budget.</p>
        <p>Mais cette équation seule ne suffit pas : elle donne une relation entre les deux quantités, pas encore les quantités elles-mêmes.</p>`,
        cobbHtml: `
          <p><strong>Application Cobb-Douglas</strong></p>
          <p>Comme <span class="formula">TMS = C/B</span>, la tangence donne :</p>
          <p><span class="formula">C/B = p<sub>B</sub>/p<sub>C</sub></span></p>
          <p>Donc on peut exprimer <span class="formula">C</span> en fonction de <span class="formula">B</span>.</p>`,
        cobbExercise: "tangencyC" },
      { title: "La troisième condition", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cobbApplication", html: `
        <p>La troisième condition du premier ordre est :</p>
        <p><span class="formula">∂𝓛/∂λ = m - p<sub>1</sub>x<sub>1</sub> - p<sub>2</sub>x<sub>2</sub> = 0</span>.</p>
        <p>Elle impose que la contrainte budgétaire soit satisfaite :</p>
        <p><span class="formula">p<sub>1</sub>x<sub>1</sub> + p<sub>2</sub>x<sub>2</sub> = m</span>.</p>
        <p>Autrement dit, le consommateur dépense exactement son revenu.</p>`,
        cobbHtml: `
          <p><strong>Application Cobb-Douglas</strong></p>
          <p>La troisième condition donne :</p>
          <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span></p>
          <p>Avec <span class="formula">C = (p<sub>B</sub>/p<sub>C</sub>)B</span>, on remplace dans la contrainte :</p>
          <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>(p<sub>B</sub>/p<sub>C</sub>)B = R</span></p>` },
      { title: "Résoudre le système", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cobbApplication", html: `
        <p>Pour déterminer les quantités optimales, on résout simultanément :</p>
        <p><span class="formula">TMS(x<sub>1</sub>,x<sub>2</sub>) = p<sub>1</sub>/p<sub>2</sub></span></p>
        <p><span class="formula">p<sub>1</sub>x<sub>1</sub> + p<sub>2</sub>x<sub>2</sub> = m</span></p>
        <p>La première équation décrit la tangence.</p>
        <p>La seconde garantit que le consommateur dépense exactement son revenu.</p>
        <div class="definition-bubble">
          <p>À retenir : les deux premières conditions permettent de retrouver la tangence, tandis que la troisième impose la contrainte budgétaire. Ensemble, elles permettent de calculer les quantités optimales.</p>
        </div>`,
        cobbHtml: `
          <p><strong>Application Cobb-Douglas</strong></p>
          <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>(p<sub>B</sub>/p<sub>C</sub>)B = R</span></p>
          <p><span class="formula">2p<sub>B</sub>B = R</span></p>
          <p><span class="formula">B* = R/(2p<sub>B</sub>)</span></p>
          <p>Puis :</p>
          <p><span class="formula">C* = R/(2p<sub>C</sub>)</span></p>
          <p>Le panier optimal est donc :</p>
          <p><span class="formula">(B*,C*) = (R/(2p<sub>B</sub>), R/(2p<sub>C</sub>))</span></p>`,
        cobbExercise: "cstarMethod" },
      { title: "Exercice : objectif", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "objective", html: `
        <p>On considère un consommateur dont les préférences sont représentées par la fonction d'utilité suivante :</p>
        <p><span class="formula">u(B,C)=B<sup>1/3</sup>C<sup>2/3</sup></span></p>
        <p>Le consommateur fait face aux prix <span class="formula">p<sub>B</sub></span> et <span class="formula">p<sub>C</sub></span>, et dispose d'un revenu <span class="formula">R</span>.</p>
        <p>Avant de calculer, il faut identifier précisément ce que l'on cherche.</p>` },
      { title: "Exercice : arguments des demandes", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "demandArguments", html: `
        <p>On cherche les demandes optimales <span class="formula">B*</span> et <span class="formula">C*</span>.</p>
        <p>Ces demandes sont des fonctions : elles donnent les quantités choisies lorsque les données économiques changent.</p>
        <p>Il faut donc distinguer les inconnues du problème et les données du problème.</p>` },
      { title: "Exercice : lagrangien", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "lagrangian", html: `
        <p>Le problème du consommateur est :</p>
        <p><span class="formula">max u(B,C)</span></p>
        <p>sous la contrainte <span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span>.</p>
        <p>Construisez le lagrangien associé.</p>` },
      { title: "Exercice : que dériver ?", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "derivativeTargets", html: `
        <p>Une fois le lagrangien construit, on obtient une fonction de trois variables :</p>
        <p><span class="formula">𝓛(B,C,λ) = B<sup>1/3</sup>C<sup>2/3</sup> + λ(R - p<sub>B</sub>B - p<sub>C</sub>C)</span></p>
        <p>Avant d'écrire les conditions du premier ordre, il faut identifier par rapport à quelles variables on doit dériver.</p>` },
      { title: "Exercice : utilités marginales", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "marginals", html: `
        <p>Pour écrire les deux premières conditions du premier ordre, il faut d'abord calculer les utilités marginales.</p>
        <p>On part de :</p>
        <p><span class="formula">u(B,C)=B<sup>1/3</sup>C<sup>2/3</sup></span></p>
        <p>Calculez <span class="formula">UM<sub>B</sub></span> et <span class="formula">UM<sub>C</sub></span>.</p>` },
      { title: "Exercice : conditions", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "foc", html: `
        <p>Une fois le lagrangien construit, on écrit les conditions du premier ordre.</p>
        <p>Il faut dériver par rapport à <span class="formula">B</span>, par rapport à <span class="formula">C</span>, puis par rapport à <span class="formula">λ</span>.</p>
        <p>La troisième condition redonne la contrainte budgétaire.</p>` },
      { title: "Exercice : tangence", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "tangency", html: `
        <p>Les deux premières conditions ne doivent pas être divisées sous la forme <span class="formula">UM - λp = 0</span>.</p>
        <p>On les réécrit d'abord :</p>
        <p><span class="formula">UM<sub>B</sub> = λp<sub>B</sub></span> et <span class="formula">UM<sub>C</sub> = λp<sub>C</sub></span>.</p>
        <p>On peut alors diviser l'une par l'autre pour éliminer <span class="formula">λ</span> :</p>
        <p><span class="formula">UM<sub>B</sub>/UM<sub>C</sub> = p<sub>B</sub>/p<sub>C</sub></span>.</p>
        <p>Pour cette fonction, calculez le rapport <span class="formula">UM<sub>B</sub>/UM<sub>C</sub></span>, puis exprimez <span class="formula">C</span> en fonction de <span class="formula">B</span>.</p>` },
      { title: "Exercice : résoudre", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "solve", html: `
        <p>Il reste à utiliser simultanément :</p>
        <p><span class="formula">C = 2(p<sub>B</sub>/p<sub>C</sub>)B</span></p>
        <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span></p>
        <p>Trouvez les demandes optimales <span class="formula">B*</span> et <span class="formula">C*</span>.</p>` },
      { title: "Bilan de l'exercice", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "summary", html: `
        <p>Pour <span class="formula">u(B,C)=B<sup>1/3</sup>C<sup>2/3</sup></span>, les exposants indiquent la part du revenu consacrée à chaque bien.</p>
        <p>On obtient :</p>
        <p><span class="formula">B* = R/(3p<sub>B</sub>)</span></p>
        <p><span class="formula">C* = 2R/(3p<sub>C</sub>)</span></p>
        <p>Cette structure pourra être réutilisée pour d'autres fonctions d'utilité.</p>` },
      { title: "Exercice : parts de revenu", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "cdPractice", practiceStep: "incomeShares", html: `
        <p>À partir des demandes Cobb-Douglas obtenues :</p>
        <p><span class="formula">B* = R/(3p<sub>B</sub>)</span> et <span class="formula">C* = 2R/(3p<sub>C</sub>)</span></p>
        <p>Calculez la part du revenu dépensée dans chaque bien.</p>
        <p>Demandez-vous ensuite ce que cela implique sur le type de biens.</p>` },
      { title: "Exercice : quasi-linéaire", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "intro", html: `
        <p>On reprend la même méthode avec une fonction quasi-linéaire :</p>
        <p><span class="formula">u(B,C)=B+C<sup>1/2</sup></span></p>
        <p>Le consommateur fait face aux prix <span class="formula">p<sub>B</sub></span> et <span class="formula">p<sub>C</sub></span>, et dispose d'un revenu <span class="formula">R</span>.</p>
        <p>On cherche les demandes optimales <span class="formula">B*(p<sub>B</sub>,p<sub>C</sub>,R)</span> et <span class="formula">C*(p<sub>B</sub>,p<sub>C</sub>,R)</span>.</p>` },
      { title: "Quasi-linéaire : lagrangien", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "lagrangian", html: `
        <p>Construisez le lagrangien associé au problème :</p>
        <p><span class="formula">max B+C<sup>1/2</sup></span></p>
        <p>sous la contrainte <span class="formula">p<sub>B</sub>B+p<sub>C</sub>C=R</span>.</p>` },
      { title: "Quasi-linéaire : utilités marginales", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "marginals", html: `
        <p>Calculez les deux utilités marginales.</p>
        <p><span class="formula">u(B,C)=B+C<sup>1/2</sup></span></p>` },
      { title: "Quasi-linéaire : conditions", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "foc", html: `
        <p>Écrivez les conditions du premier ordre.</p>
        <p>On garde la même logique : deux conditions pour les biens, puis la contrainte budgétaire.</p>` },
      { title: "Quasi-linéaire : tangence", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "tangency", html: `
        <p>Les deux premières conditions s'écrivent d'abord :</p>
        <p><span class="formula">UM<sub>B</sub> = λp<sub>B</sub></span> et <span class="formula">UM<sub>C</sub> = λp<sub>C</sub></span>.</p>
        <p>En divisant la première égalité par la deuxième, on élimine <span class="formula">λ</span> :</p>
        <p><span class="formula">UM<sub>B</sub>/UM<sub>C</sub> = p<sub>B</sub>/p<sub>C</sub></span>.</p>
        <p>Calculez le rapport <span class="formula">UM<sub>B</sub>/UM<sub>C</sub></span>, puis utilisez cette égalité.</p>` },
      { title: "Quasi-linéaire : résoudre", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "solve", html: `
        <p>Utilisez la relation obtenue par la tangence et la contrainte budgétaire.</p>
        <p>Dans le cas intérieur, trouvez <span class="formula">C*</span> puis <span class="formula">B*</span>.</p>` },
      { title: "Quasi-linéaire : solution en coin", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "corner", html: `
        <p>La solution intérieure obtenue doit encore être économiquement possible.</p>
        <p>Une demande ne peut pas être négative.</p>
        <p>Les formules intérieures calculées sont :</p>
        <p><span class="formula">B* = R/p<sub>B</sub> - p<sub>B</sub>/(4p<sub>C</sub>)</span></p>
        <p><span class="formula">C* = p<sub>B</sub><sup>2</sup>/(4p<sub>C</sub><sup>2</sup>)</span></p>
        <p>Nous allons les tester avec deux jeux de prix et de revenu.</p>` },
      { title: "Quasi-linéaire : demande par morceaux", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, wideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "piecewise", html: `
        <p>Il faut maintenant déterminer quand la solution intérieure est possible.</p>
        <p>La demande intérieure de <span class="formula">B</span> est :</p>
        <p><span class="formula">B* = R/p<sub>B</sub> - p<sub>B</sub>/(4p<sub>C</sub>)</span></p>
        <p>Une solution intérieure exige <span class="formula">B* &ge; 0</span>.</p>
        <p>Déduisez la condition sur les prix et le revenu, puis écrivez la demande par morceaux.</p>` },
      { title: "Quasi-linéaire : bilan", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "quasilinear", practiceStep: "summary", html: `
        <p>Pour <span class="formula">u(B,C)=B+C<sup>1/2</sup></span>, la tangence donne une solution intérieure seulement si le revenu est assez élevé relativement aux prix.</p>
        <p>Sinon, la solution est en coin : le consommateur achète seulement le bien <span class="formula">C</span>.</p>` },
      { title: "Exercice : racines séparées", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "sqrtSum", practiceStep: "intro", html: `
        <p>On applique maintenant la même méthode à :</p>
        <p><span class="formula">u(B,C)=B<sup>1/2</sup>+C<sup>1/2</sup></span></p>
        <p>Le consommateur fait face aux prix <span class="formula">p<sub>B</sub></span> et <span class="formula">p<sub>C</sub></span>, et dispose d'un revenu <span class="formula">R</span>.</p>` },
      { title: "Racines séparées : lagrangien", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "sqrtSum", practiceStep: "lagrangian", html: `
        <p>Construisez le lagrangien associé au problème :</p>
        <p><span class="formula">max B<sup>1/2</sup>+C<sup>1/2</sup></span></p>
        <p>sous la contrainte <span class="formula">p<sub>B</sub>B+p<sub>C</sub>C=R</span>.</p>` },
      { title: "Racines séparées : utilités marginales", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "sqrtSum", practiceStep: "marginals", html: `
        <p>Calculez les deux utilités marginales.</p>
        <p><span class="formula">u(B,C)=B<sup>1/2</sup>+C<sup>1/2</sup></span></p>` },
      { title: "Racines séparées : conditions", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "sqrtSum", practiceStep: "foc", html: `
        <p>Écrivez les conditions du premier ordre.</p>
        <p>La dérivée par rapport à <span class="formula">λ</span> redonne toujours la contrainte budgétaire.</p>` },
      { title: "Racines séparées : tangence", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "sqrtSum", practiceStep: "tangency", html: `
        <p>Les deux premières conditions s'écrivent d'abord :</p>
        <p><span class="formula">UM<sub>B</sub> = λp<sub>B</sub></span> et <span class="formula">UM<sub>C</sub> = λp<sub>C</sub></span>.</p>
        <p>En divisant la première égalité par la deuxième, on élimine <span class="formula">λ</span> :</p>
        <p><span class="formula">UM<sub>B</sub>/UM<sub>C</sub> = p<sub>B</sub>/p<sub>C</sub></span>.</p>
        <p>Calculez le rapport <span class="formula">UM<sub>B</sub>/UM<sub>C</sub></span>, puis obtenez une relation entre <span class="formula">C</span> et <span class="formula">B</span>.</p>` },
      { title: "Racines séparées : résoudre", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "sqrtSum", practiceStep: "solve", html: `
        <p>Utilisez la relation issue de la tangence et la contrainte budgétaire.</p>
        <p>Trouvez les demandes optimales <span class="formula">B*</span> et <span class="formula">C*</span>.</p>` },
      { title: "Racines séparées : bilan", sectionIndex: 6, mode: "formula", fullStatement: true, sideControls: true, interactive: "utilityPractice", practiceKind: "sqrtSum", practiceStep: "summary", html: `
        <p>Pour <span class="formula">u(B,C)=B<sup>1/2</sup>+C<sup>1/2</sup></span>, la tangence donne une relation non linéaire entre les deux biens.</p>
        <p>La contrainte permet ensuite d'obtenir les demandes optimales.</p>` },
      { title: "Fin", sectionIndex: 6, mode: "endSlide", interactive: "endSlide", html: `

    ];

    const state = {

      substitutionStep: 1,
      substitutionOptimumSolved: false,

    const baskets = [

    function sx(b) {
      const inner = config.size - 2 * config.margin;
      return config.margin + (b / config.maxB) * inner;
    }

    function sy(c) {
      const inner = config.size - 2 * config.margin;
      return config.size - config.margin - (c / config.maxC) * inner;
    }

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function utility(point) {
      return Math.sqrt(point.b * point.c);
    }

    function productLevelFromUtility(level) {
      return level * level;
    }

    function optimum() {
      return { b: config.income / (2 * config.pB), c: config.income / (2 * config.pC) };
    }

    function tms(point) {
      return point.c / point.b;
    }

    function umbAt(point) {
      return 0.5 * Math.sqrt(point.c / point.b);
    }

    function umcAt(point) {
      return 0.5 * Math.sqrt(point.b / point.c);
    }

    function slopeCI(point) {
      return -point.c / point.b;
    }

    function parseNumber(value) {
      const text = String(value).trim().replace(",", ".").replace(/\s+/g, "");
      if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(text)) {
        const [num, den] = text.split("/").map(Number);
        return den === 0 ? NaN : num / den;
      }
      return Number(text);
    }

    function formatNumber(value) {
      if (Number.isInteger(value)) return String(value);
      return value.toFixed(2).replace(".", ",").replace(/,?0+$/, "");
    }

    function setFeedback(message = "", type = "ok", asHtml = false) {
      if (asHtml) feedback.innerHTML = message;
      else if (/[A-Z]_\w|p_\w|\^\(|\^[0-9]/.test(message)) feedback.innerHTML = mathHtml(message);
      else feedback.textContent = message;
      feedback.classList.toggle("error", type === "error");
    }

    function next(message = "") {
      state.phase = Math.min(screens.length - 1, state.phase + 1);
      setFeedback(message);
      update();
    }

    function previous() {
      state.phase = Math.max(-1, state.phase - 1);
      setFeedback(state.phase === -1 ? "" : "Retour à l'écran précédent.");
      update();

    function closeTo(point, target, tolerance = 0.75) {
      return Math.hypot(point.b - target.b, point.c - target.c) <= tolerance;
    }

    function unitFromEvent(svg, event) {
      const bounds = svg.getBoundingClientRect();
      const view = svg.viewBox.baseVal;
      const pixelX = view.x + ((event.clientX - bounds.left) / bounds.width) * view.width;
      const pixelY = view.y + ((event.clientY - bounds.top) / bounds.height) * view.height;
      const inner = config.size - 2 * config.margin;
      return {
        b: Math.max(0, Math.min(config.maxB, ((pixelX - config.margin) / inner) * config.maxB)),
        c: Math.max(0, Math.min(config.maxC, ((config.size - config.margin - pixelY) / inner) * config.maxC))
      };
    }

      for (let c = 0; c <= config.maxC; c += 1) {
        svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(c), x2: sx(config.maxB), y2: sy(c), stroke: "#d7e0e4", "stroke-width": 1 }));
      }
      svg.appendChild(svgEl("line", { x1: sx(0), y1: sy(0), x2: sx(config.maxB) + 16, y2: sy(0), stroke: "#132536", "stroke-width": 3 }));

      svg.appendChild(svgEl("polygon", { points: `${sx(config.maxB) + 16},${sy(0)} ${sx(config.maxB) + 3},${sy(0) - 7} ${sx(config.maxB) + 3},${sy(0) + 7}`, fill: "#132536" }));
      svg.appendChild(svgEl("polygon", { points: `${sx(0)},${sy(config.maxC) - 16} ${sx(0) - 7},${sy(config.maxC) - 3} ${sx(0) + 7},${sy(config.maxC) - 3}`, fill: "#132536" }));

      for (let b = 0; b <= config.maxB; b += 1) {

      labelC.textContent = "Bien C";
      svg.appendChild(labelC);
    }

    function drawPoint(svg, point, label, color, radius = 8) {
      svg.appendChild(svgEl("circle", { cx: sx(point.b), cy: sy(point.c), r: radius, fill: color, stroke: "white", "stroke-width": 3 }));
      if (label) {
        const text = svgEl("text", { x: sx(point.b) + 11, y: sy(point.c) - 10, fill: color, "font-size": 18, "font-weight": 700 });
        text.textContent = label;
        svg.appendChild(text);
      }
    }

    function ciPath(level) {
      const product = productLevelFromUtility(level);
      const points = [];
      for (let b = 0.32; b <= config.maxB; b += 0.04) {
        const c = product / b;
        if (c >= 0.22 && c <= config.maxC) {
          points.push(`${points.length ? "L" : "M"} ${sx(b).toFixed(1)} ${sy(c).toFixed(1)}`);
        }
      }
      return points.join(" ");
    }

    function drawCI(svg, level, color, width = 2, dash = "none", opacity = 0.82) {
      svg.appendChild(svgEl("path", { d: ciPath(level), fill: "none", stroke: color, "stroke-width": width, "stroke-linecap": "round", "stroke-dasharray": dash, opacity }));
    }

    function drawCIFamily(svg, options = {}) {
      const levels = options.many ? [1.8, 2.3, 2.8, 3.2, Math.sqrt(12), Math.sqrt(18), 5, 6.2, 7.2] : [2.4, 3, Math.sqrt(12), Math.sqrt(18), 5.3, 6.5];
      levels.forEach((u) => {
        const highlight = Math.abs(u - (options.highlight || Math.sqrt(18))) < 0.001;
        drawCI(svg, u, highlight ? "#176b52" : (u > 5 ? "#8a74cc" : "#7fae9e"), highlight ? 3 : 1.4, highlight ? "none" : "5 5", highlight ? 0.96 : 0.42);
      });
    }

    function drawBudget(svg) {
      const bMax = config.income / config.pB;
      const cMax = config.income / config.pC;
      svg.appendChild(svgEl("path", { d: `M ${sx(0)} ${sy(cMax)} L ${sx(bMax)} ${sy(0)}`, fill: "none", stroke: "#b6483b", "stroke-width": 4, "stroke-linecap": "round" }));
      const label = svgEl("text", { x: sx(7.7), y: sy(2.0), fill: "#b6483b", "font-size": 17, "font-weight": 700 });
      label.textContent = "10B + 20C = 120";
      svg.appendChild(label);
    }

    function drawTangent(svg, point, color = "#c98c2d") {
      const slope = slopeCI(point);
      const x1 = Math.max(0.4, point.b - 2.4);
      const x2 = Math.min(config.maxB - 0.4, point.b + 2.4);
      const y1 = point.c + slope * (x1 - point.b);
      const y2 = point.c + slope * (x2 - point.b);
      svg.appendChild(svgEl("line", { x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2), stroke: color, "stroke-width": 4, "stroke-linecap": "round" }));
    }

    function drawFormula(svg, text, subtext = "") {

      svg.appendChild(main);
      if (subtext) {

        svg.appendChild(small);
      }

    function drawSubstitution(svg) {
      const screen = screens[state.phase];

      const maxU = 4.5;
      const ux = (b) => x0 + (b / maxB) * width;

      const uOfB = (b) => Math.sqrt(Math.max(0, b * (6 - b / 2)));

      for (let b = 0; b <= maxB; b += 1) {
        svg.appendChild(svgEl("line", { x1: ux(b), y1: y0, x2: ux(b), y2: y0 - height, stroke: "#d7e0e4", "stroke-width": 1 }));

      for (let u = 0; u <= maxU; u += 1) {
        svg.appendChild(svgEl("line", { x1: x0, y1: uy(u), x2: x0 + width, y2: uy(u), stroke: "#d7e0e4", "stroke-width": 1 }));

      svg.appendChild(svgEl("line", { x1: x0, y1: y0, x2: x0 + width, y2: y0, stroke: "#66747d", "stroke-width": 2 }));
      svg.appendChild(svgEl("line", { x1: x0, y1: y0, x2: x0, y2: y0 - height, stroke: "#66747d", "stroke-width": 2 }));
      svg.appendChild(svgEl("path", { d: `M ${x0 + width} ${y0} l -12 -7 l 0 14 z`, fill: "#66747d" }));
      svg.appendChild(svgEl("path", { d: `M ${x0} ${y0 - height} l -7 12 l 14 0 z`, fill: "#66747d" }));

      let path = "";
      for (let b = 0; b <= maxB; b += 0.2) {
        const command = b === 0 ? "M" : "L";
        path += `${command} ${ux(b)} ${uy(uOfB(b))} `;
      }
      svg.appendChild(svgEl("path", { d: path, fill: "none", stroke: "#176b52", "stroke-width": 4, "stroke-linecap": "round" }));

      const title = svgEl("text", { x: x0, y: 90, fill: "#132536", "font-size": 22, "font-weight": 700 });

      svg.appendChild(axisB);

        const optU = uOfB(optB);
        svg.appendChild(svgEl("circle", { cx: ux(optB), cy: uy(optU), r: 8, fill: "#176b52", stroke: "white", "stroke-width": 3 }));
        svg.appendChild(svgEl("line", { x1: ux(optB) - 70, y1: uy(optU), x2: ux(optB) + 70, y2: uy(optU), stroke: "#c98c2d", "stroke-width": 4, "stroke-linecap": "round" }));

        maxLabel.textContent = "sommet : pente nulle";
        svg.appendChild(maxLabel);
        const bLabel = svgEl("text", { x: ux(optB) - 18, y: y0 + 28, fill: "#176b52", "font-size": 17, "font-weight": 700 });
        bLabel.textContent = "B*=6";

    function drawRecap(svg, showPoint = true) {
      drawCIFamily(svg, { highlight: Math.sqrt(18) });
      drawBudget(svg);
      if (showPoint) {
        const opt = optimum();
        drawPoint(svg, opt, "E", "#176b52", 9);
        drawTangent(svg, opt, "#c98c2d");
      }
    }

    function hasVisual(screen) {
      return ["recap", "clutter", "ci", "baskets", "buildCI", "compareCI", "marginalDemo", "tmsAnimation", "tmsBalance", "tmsExplore", "tmsMove", "tmsPoint", "problem", "condition", "substitution", "finalGraph", "endSlide"].includes(screen.mode);
    }

    function drawGraph() {
      const screen = screens[state.phase];
      if (!hasVisual(screen)) {
        graphWrap.innerHTML = "";
        return;
      }
      if (screen.mode === "endSlide") return;
      graphWrap.innerHTML = "";
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${config.size} ${config.size}`);
      svg.setAttribute("aria-label", "Graphique de fonction d'utilité");
      if (screen.mode !== "substitution") drawAxes(svg);

      if (screen.mode === "recap") drawRecap(svg);
      if (screen.mode === "clutter") {
        drawCIFamily(svg, { many: true, highlight: Math.sqrt(18) });
        drawBudget(svg);
        drawFormula(svg, "max u(B,C)", "sous contrainte budgétaire");
      }
      if (screen.mode === "ci") {
        drawCIFamily(svg, { highlight: Math.sqrt(18) });
        drawIsoLabels(svg);
      }
      if (screen.mode === "baskets") {
        baskets.forEach((basket) => {
          const label = screen.interactive === "scoreBaskets" ? `${basket.name} (${basket.b} ; ${basket.c})` : `${basket.name} : U=${formatNumber(utility(basket))}`;

        });
      }
      if (screen.mode === "buildCI") {
        drawCI(svg, Math.sqrt(12), "#176b52", 3);
        state.ciPoints.forEach((point) => drawPoint(svg, point, "BC=12", "#2156c5", 6));
        svg.addEventListener("click", (event) => handleBuildCIClick(svg, event));
      }
      if (screen.mode === "compareCI") {
        drawCompareCI(svg);
      }
      if (screen.mode === "marginalDemo") {
        drawMarginalDemo(svg);
      }
      if (screen.mode === "tmsAnimation") {
        drawTmsAnimation(svg);
      }
      if (screen.mode === "tmsBalance") {
        drawTmsBalance(svg);
      }
      if (screen.mode === "tmsExplore") {
        drawTmsExplore(svg);
        svg.addEventListener("click", (event) => handleTmsExploreClick(svg, event));
      }
      if (screen.mode === "substitution") {
        drawSubstitution(svg);
      }
      if (screen.mode === "tmsMove" || screen.mode === "tmsPoint") {
        drawCIFamily(svg, { highlight: Math.sqrt(18) });
        const point = { b: 4, c: 4.5 };
        drawPoint(svg, point, "X", "#2156c5");
        drawTangent(svg, point);
      }
      if (screen.mode === "problem" || screen.mode === "condition" || screen.mode === "finalGraph") {
        drawRecap(svg, !(screen.mode === "finalGraph" && screen.interactive === "finalClick"));
      }
      if (screen.mode === "finalGraph" && screen.interactive === "finalClick") {
        svg.addEventListener("click", (event) => handleFinalClick(svg, event));
        if (state.finalGuess) drawPoint(svg, state.finalGuess, "", "#b6483b", 6);
      }

      graphWrap.appendChild(svg);
    }

    function handleBuildCIClick(svg, event) {
      const point = unitFromEvent(svg, event);
      if (Math.abs(point.b * point.c - 12) > 0.9) {
        setFeedback("Ce point est trop loin de la courbe U=√12. Il faut que le produit BC soit proche de 12.", "error");
        return;
      }
      if (state.ciPoints.some((saved) => Math.hypot(saved.b - point.b, saved.c - point.c) < 1.1)) {
        setFeedback("Ce point est trop proche du précédent. Cherchez un autre panier sur la même courbe.", "error");
        return;
      }
      state.ciPoints.push(point);
      if (state.ciPoints.length >= 3) next("Bien. Ces paniers sont différents, mais ils gardent la même utilité : B^(1/2)C^(1/2) reste proche de √12.");
      else {
        setFeedback(`Point valide. Encore ${3 - state.ciPoints.length} point(s) à placer.`);
        update();
      }
    }

    function renderDemandRevealControls() {
      const target = document.querySelector("#demandRevealContent");
      const cobbBlock = `
        <div class="demand-cobb-block">
          <p><strong>Cas Cobb-Douglas</strong></p>
          <p><span class="formula">u(B,C)=B<sup>1/2</sup>C<sup>1/2</sup></span></p>
          <p>On sait que <span class="formula">TMS = C/B</span>.</p>
          <p>La condition optimale donne :</p>
          <p><span class="formula">C/B = p<sub>B</sub>/p<sub>C</sub></span></p>
          <p>Donc <span class="formula">C = (p<sub>B</sub>/p<sub>C</sub>)B</span>.</p>
          <p>On remplace dans la contrainte :</p>
          <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>C = R</span></p>
          <p><span class="formula">p<sub>B</sub>B + p<sub>C</sub>(p<sub>B</sub>/p<sub>C</sub>)B = R</span></p>
          <p><span class="formula">2p<sub>B</sub>B = R</span></p>
          <p><span class="formula">B* = R/(2p<sub>B</sub>)</span></p>
        </div>
      `;
      const blocks = [
        `
          <p>Avec la technique de substitution, on transforme le problème en une fonction d'une seule variable :</p>
          <p><span class="formula">u(B) = u(B, (R - p<sub>B</sub>B)/p<sub>C</sub>)</span></p>
        `,
        `
          <p>Quand B augmente, il y a deux effets : l'effet direct de B sur l'utilité, et l'effet indirect sur C, car la contrainte budgétaire impose que C diminue.</p>
          <p>Or <span class="formula">C(B) = (R - p<sub>B</sub>B)/p<sub>C</sub></span>, donc <span class="formula">dC/dB = -p<sub>B</sub>/p<sub>C</sub></span>.</p>
        `,
        `
          <p>La dérivée totale additionne les deux effets :</p>
          <p><span class="formula">du/dB = UM<sub>B</sub> + UM<sub>C</sub> × dC/dB</span></p>
          <p>Donc <span class="formula">du/dB = UM<sub>B</sub> - (p<sub>B</sub>/p<sub>C</sub>)UM<sub>C</sub></span>.</p>
          <p>Au maximum, cette dérivée est nulle, donc <span class="formula">UM<sub>B</sub>/UM<sub>C</sub> = p<sub>B</sub>/p<sub>C</sub></span>.</p>
          <p>Ce qui revient à dire que <span class="formula">TMS = p<sub>B</sub>/p<sub>C</sub></span>.</p>
        `,
        `
          <p>On vient donc de trouver la demande de B :</p>
          <p><span class="formula">B(p<sub>B</sub>, p<sub>C</sub>, R) = R / (2p<sub>B</sub>)</span></p>
          <p>Il faut maintenant trouver la demande de C.</p>
          <p>C'est plus facile, car on connaît B et la contrainte budgétaire donne :</p>
          <p><span class="formula">C = (R - p<sub>B</sub>B)/p<sub>C</sub></span></p>
          <p>En remplaçant <span class="formula">B = R/(2p<sub>B</sub>)</span>, on obtient :</p>
          <p><span class="formula">C(p<sub>B</sub>, p<sub>C</sub>, R) = R / (2p<sub>C</sub>)</span></p>
        `
      ];
      if (target) {
        let displayHTML = "";
        if (state.demandStep > blocks.length + 1) {
          displayHTML = "";
        } else if (state.demandStep > blocks.length) {
          displayHTML = cobbBlock;
        } else if (state.demandStep > 1) {
          displayHTML = blocks[state.demandStep - 2];
        }
        target.innerHTML = displayHTML;
      }
      const hasMore = state.demandStep <= blocks.length + 1;
      controls.innerHTML = `
        <div class="button-row">
          <button data-action="back">Retour</button>
          <button class="primary" data-action="more">${hasMore ? "Suite" : "Continuer"}</button>
        </div>`;
      controls.querySelector("[data-action='back']").addEventListener("click", previous);
      controls.querySelector("[data-action='more']").addEventListener("click", () => {
        if (hasMore) {
          state.demandStep += 1;
          setFeedback("");
          update();
        } else {
          next();
        }
      });
    }
