    function drawBudgetConstructionGraph() {
      const svg = drawBaseGraph([], { showCurves: false });
      const hasC = state.answered.has("constructCPoint");
      const hasB = state.answered.has("constructBPoint");
      const cPoint = { b: 0, c: 4 };
      const bPoint = { b: 6, c: 0 };

      if (hasC && hasB) {
        drawBudgetLineForValues(svg, 120, 20, 30, { stroke: "#b6483b", width: 4 });
      }

      [
        ...(hasC ? [{ point: cPoint, label: "4", color: "#176b52", dx: -24, dy: 6 }] : []),
        ...(hasB ? [{ point: bPoint, label: "6", color: "#c98c2d", dx: -4, dy: 28 }] : [])
      ].forEach(({ point, label, color, dx, dy }) => {
        svg.appendChild(svgEl("circle", {
          cx: sx(point.b),
          cy: sy(point.c),
          r: 8,
          fill: color,
          stroke: "white",
          "stroke-width": 3
        }));
        const text = svgEl("text", {
          x: sx(point.b) + dx,
          y: sy(point.c) + dy,
          fill: color,
          "font-size": 18,
          "font-weight": 700
        });
        text.textContent = label;
        svg.appendChild(text);
      });

      return svg;
    }

    function renderBudgetConstructionExercise() {
      const hasC = state.answered.has("constructCPoint");
      const hasB = state.answered.has("constructBPoint");
      const slopeDone = state.answered.has("constructSlope");
      const tradeoffBDone = state.answered.has("constructTradeoffB");
      const tradeoffCDone = state.answered.has("constructTradeoffC");
      if (hasC && hasB && slopeDone && tradeoffBDone && tradeoffCDone) {
        state.answered.add("constructedBudget");
      }

      setStageWithGraph(
        !(hasC && hasB)
          ? "Cliquez sur les deux points extrêmes de la droite de budget."
          : !slopeDone
          ? "Calculons d'abord la pente de cette droite de budget."
          : !tradeoffBDone
            ? "Interprétons la pente : combien de C sacrifier pour obtenir plus de B ?"
            : !tradeoffCDone
              ? "Retournons maintenant la question : combien de B sacrifier pour obtenir plus de C ?"
              : hasC && hasB
          ? "Les deux points sont placés : la droite de budget est construite."
          : "Cliquez sur les deux points extrêmes de la droite de budget.",
        drawBudgetConstructionGraph(),
        `<div class="formula-card">
          <p>Cas particulier : R = 120, p<sub>B</sub> = 20 et p<sub>C</sub> = 30.</p>
          <p>La contrainte est donc : 20B + 30C = 120.</p>
        </div>`
      );

      if (!(hasC && hasB)) {
        interaction.innerHTML = `
          <p class="choice-prompt">Placez les deux croisements avec les axes : le panier avec seulement du C et le panier avec seulement du B.</p>
          <p>Vous pouvez cliquer dans n'importe quel ordre.</p>
        `;
        const svg = document.querySelector("#graphMount svg");
        svg.addEventListener("click", (event) => {
          const bounds = svg.getBoundingClientRect();
          const unitX = toUnitX((event.clientX - bounds.left) * (config.size / bounds.width));
          const unitY = toUnitY((event.clientY - bounds.top) * (config.size / bounds.height));
          const nearC = Math.hypot(unitX - 0, unitY - 4) <= 0.75;
          const nearB = Math.hypot(unitX - 6, unitY - 0) <= 0.75;

          if (nearC) {
            state.answered.add("constructCPoint");
            setFeedback("Très bien : si B = 0, toute la dépense va dans C, donc C = 4.");
            renderBudgetConstructionExercise();
            updateNav();
          } else if (nearB) {
            state.answered.add("constructBPoint");
            setFeedback("Très bien : si C = 0, toute la dépense va dans B, donc B = 6.");
            renderBudgetConstructionExercise();
            updateNav();
          } else {
            setFeedback("Cherchez les interceptions : un point sur l'axe C et un point sur l'axe B.", "error");
          }
        });
        return;
      }

      if (!slopeDone) {
        interaction.innerHTML = `
          <p class="choice-prompt">Quelle est la pente de la droite de budget ?</p>
          <div class="button-row">
            <button data-answer="correct">-2/3</button>
            <button data-answer="wrong1">-3/2</button>
            <button data-answer="wrong2">2/3</button>
          </div>
        `;
        interaction.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.answer === "correct") {
              state.answered.add("constructSlope");
              setFeedback("Exact. La pente est -p<sub>B</sub>/p<sub>C</sub> = -20/30 = -2/3.");
              renderBudgetConstructionExercise();
              updateNav();
            } else {
              setFeedback("Pas encore. La pente de la droite de budget est -p<sub>B</sub>/p<sub>C</sub>.", "error");
            }
          });
        });
        return;
      }

      if (!tradeoffBDone) {
        interaction.innerHTML = `
          <p class="choice-prompt">Pour obtenir une unité supplémentaire de bien B, combien d'unités de bien C faut-il sacrifier ?</p>
          <div class="button-row">
            <button data-answer="correct">2/3 unité de C</button>
            <button data-answer="wrong1">3/2 unités de C</button>
            <button data-answer="wrong2">2 unités de C</button>
          </div>
        `;
        interaction.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.answer === "correct") {
              state.answered.add("constructTradeoffB");
              setFeedback("Exact. La valeur absolue de la pente est 2/3 : pour 1 unité de B en plus, il faut sacrifier 2/3 unité de C.");
              renderBudgetConstructionExercise();
              updateNav();
            } else {
              setFeedback("Pas encore. Utilisez la valeur absolue de la pente : p<sub>B</sub>/p<sub>C</sub> = 20/30.", "error");
            }
          });
        });
        return;
      }

      if (!tradeoffCDone) {
        interaction.innerHTML = `
          <p class="choice-prompt">Inversement, pour obtenir une unité supplémentaire de bien C, combien d'unités de bien B faut-il sacrifier ?</p>
          <div class="button-row">
            <button data-answer="wrong1">2/3 unité de B</button>
            <button data-answer="correct">3/2 unités de B</button>
            <button data-answer="wrong2">3 unités de B</button>
          </div>
        `;
        interaction.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.answer === "correct") {
              state.answered.add("constructTradeoffC");
              setFeedback("Exact. On inverse le rapport : p<sub>C</sub>/p<sub>B</sub> = 30/20 = 3/2. Pour 1 unité de C en plus, il faut sacrifier 1,5 unité de B.");
              renderBudgetConstructionExercise();
              updateNav();
            } else {
              setFeedback("Pas encore. Cette fois, on échange dans l'autre sens : il faut calculer p<sub>C</sub>/p<sub>B</sub>.", "error");
            }
          });
        });
        return;
      }

      if (hasC && hasB) {
        interaction.innerHTML = `
          <div class="formula-card">
            <p>Exact. Si B = 0, alors C = 120/30 = 4. Si C = 0, alors B = 120/20 = 6.</p>
            <p>La droite qui passe par ces deux points est la droite de budget.</p>
          </div>
        `;
        updateNav();
        return;
      }
    }

            <div class="context-name">Préférences</div>
            <div class="context-sub">courbes d'indifférence</div>
          </div>
          <div class="context-op">+</div>
          <div class="context-box done">
            <div class="context-tag">Module 2 ✓</div>
            <div class="context-name">Budget</div>
            <div class="context-sub">droite de budget</div>
          </div>
          <div class="context-op">→</div>
          <div class="context-box upcoming">
            <div class="context-tag">Exercice</div>
            <div class="context-name">Droite et choix</div>
            <div class="context-sub">construire & interpréter</div>
          </div>
          <div class="context-op">→</div>
          <div class="context-box upcoming">
            <div class="context-tag">Module 3</div>
            <div class="context-name">Choix optimal</div>
            <div class="context-sub">point de tangence</div>
          </div>
        </div>
      `;
      interaction.innerHTML = `
        <div class="formula-card cheatsheet">
          <p class="cheatsheet-title">Ce que vous savez maintenant</p>
          <div class="cheatsheet-row">
            <span class="cheatsheet-label">Module 1</span>
            <span class="cheatsheet-formula">Préférences → courbes d'indifférence, TMS</span>
          </div>
          <div class="cheatsheet-row">
            <span class="cheatsheet-label">Module 2</span>
            <span class="cheatsheet-formula">Budget → droite p<sub>B</sub>B + p<sub>C</sub>C = R, pente −p<sub>B</sub>/p<sub>C</sub></span>
          </div>
          <div class="cheatsheet-row">
            <span class="cheatsheet-label">Module 3</span>
            <span class="cheatsheet-formula">Choix optimal → tangence CI et droite de budget</span>
          </div>
        </div>
      `;
    }

    function update() {
      const current = steps[state.step];
      sequenceTitle.textContent = stepLabels[state.step] || `Diapositive ${state.step + 1}`;
      narration.innerHTML = current.text;
      feedback.textContent = "";
      interactionPanel.classList.remove("info-only");
      interactionPanel.classList.toggle("tall-exercise", !!current.tall);
      interactionPanel.style.display = "";
      renderProgressStrip();
      current.render();
      exerciceTitle.style.display = current.gate ? "" : "none";
      updateNav();
    }

    function updateNav() {
      const current = steps[state.step];
      backButton.disabled = state.step === 0;
      nextButton.disabled = Boolean(current.gate && !current.gate());
      updateActionFocus();
    }

    function openNavPanel() {
      navPanelItems.innerHTML = steps.map((_, i) => {
        const label = stepLabels[i] || `Diapositive ${i + 1}`;
        return `<button class="nav-panel-item${i === state.step ? " nav-current" : ""}" data-step="${i}">${i + 1}. ${label}</button>`;
      }).join("");
      navPanelItems.querySelectorAll("[data-step]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.step = Number(btn.dataset.step);
          update();
          closeNavPanel();
        });
      });
      navPanel.style.display = "block";
      navBackdrop.style.display = "block";
    }

    function closeNavPanel() {
      navPanel.style.display = "none";
      navBackdrop.style.display = "none";
    }

    navJumpButton.addEventListener("click", () => {
      navPanel.style.display === "none" ? openNavPanel() : closeNavPanel();
    });
    navBackdrop.addEventListener("click", closeNavPanel);

    devSkipButton.addEventListener("click", () => {
      if (state.step < steps.length - 1) {
        state.step += 1;
        update();
      }
    });

    backButton.addEventListener("click", () => {
      if (state.step > 0) {
        state.step -= 1;
        update();
      }
    });

    nextButton.addEventListener("click", () => {
      const current = steps[state.step];
      if (current.gate && !current.gate()) return;
      if (state.step < steps.length - 1) {
        state.step += 1;
        update();
      }
    });

    update();
  </script>
<button id="ttsToggle" type="button"></button>
<script>
(function(){
  const synth=window.speechSynthesis;
  let voice=null,enabled=localStorage.getItem('tts')!=='0';
  const pick=()=>{const fr=synth.getVoices().filter(v=>v.lang.startsWith('fr'));voice=fr.find(v=>/neural|online/i.test(v.name))||fr.find(v=>/denise|thomas|paul|hortense|amelie|juliette|marie|pierre/i.test(v.name))||fr[0]||null;};
  pick();synth.addEventListener('voiceschanged',pick);
  const speak=t=>{if(!enabled)return;synth.cancel();const s=(t||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();if(!s)return;const u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=0.88;u.pitch=1.05;if(voice)u.voice=voice;synth.speak(u);};
  const upd=()=>{const b=document.getElementById('ttsToggle');if(!b)return;b.classList.toggle('tts-active',enabled);const lbl=enabled?'Désactiver la voix':'Activer la voix';b.title=lbl;b.setAttribute('aria-label',lbl);b.innerHTML=enabled?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';};
  document.getElementById('ttsToggle').addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('tts',enabled?'1':'0');if(!enabled)synth.cancel();upd();});
  upd();
  const el=document.querySelector('#narration');
  if(el){let tid=0;new MutationObserver(()=>{clearTimeout(tid);tid=setTimeout(()=>{speak(el.innerText||'');},80);}).observe(el,{childList:true,subtree:true,characterData:true});}
})();
</script>
<div id="pgHUD"><span class="pg-sc">🏆 <span id="pgScore">0</span></span><span class="pg-sep">│</span><span class="pg-pr">⚡ <span id="pgPrec">0</span></span></div>
<div id="pgOverlay"></div>
<script>
(function(){
var MID='2';
var MODS=[{id:'1a',n:'Préférences'},{id:'2',n:'Contrainte de budget'},{id:'2b',n:'Exercice budget'},{id:'3',n:'Choix sous contrainte'},{id:'4',n:'Substitution & revenu'},{id:'5',n:'Typologies de biens'},{id:'6',n:"Fonction d'utilité"},{id:'7',n:'Demandes compensées'},{id:'8',n:'Choix intertemporel'}];
function ld(id){try{return JSON.parse(localStorage.getItem('prg_'+id)||'{}')}catch(e){return{}}}
function sv(id,d){try{localStorage.setItem('prg_'+id,JSON.stringify(d))}catch(e){}}
var sc=0,pr=0,tried=false;
function upd(){var a=document.getElementById('pgScore'),b=document.getElementById('pgPrec');if(a)a.textContent=sc;if(b)b.textContent=pr;}
var P={
  wrong:function(){tried=true;},
  correct:function(){sc++;if(!tried)pr++;tried=false;var d=ld(MID);d.score=Math.max(d.score||0,sc);d.prec=Math.max(d.prec||0,pr);d.seen=true;sv(MID,d);upd();},
  nav:function(){tried=false;}
};
(function(){var d=ld(MID);d.seen=true;sv(MID,d);})();
var st=(typeof state!=='undefined'&&state&&state.answered instanceof Set)?state:(typeof S!=='undefined'&&S&&S.answered instanceof Set)?S:null;
if(st){var _a=st.answered.add.bind(st.answered);st.answered.add=function(k){if(!st.answered.has(k))P.correct();return _a(k);};}
var fb=document.getElementById('feedback')||document.querySelector('.feedback');
if(fb){new MutationObserver(function(){if(fb.classList.contains('error')||fb.classList.contains('err'))P.wrong();}).observe(fb,{attributes:true,attributeFilter:['class']});}
var nr=document.querySelector('#narration,#statement,#narrationBox');
if(nr){var nt=0;new MutationObserver(function(){clearTimeout(nt);nt=setTimeout(function(){P.nav();},150);}).observe(nr,{childList:true,subtree:true,characterData:true});}
var others=MODS.filter(function(m){return m.id!==MID&&ld(m.id).seen;});
if(others.length){var ov=document.getElementById('pgOverlay');if(ov){
  var rows=others.map(function(m){var d=ld(m.id);return '<div class="pg-row"><span class="pg-mod-name">'+m.n+'</span><span class="pg-mod-pts"><span class="s">'+(d.score||0)+'</span> pts · <span class="p">'+(d.prec||0)+'</span> préc.</span></div>';}).join('');
  ov.innerHTML='<div class="pg-card"><h3>📊 Votre progression</h3>'+rows+'<button id="pgClose" class="primary" type="button" style="width:100%;margin-top:8px">Commencer →</button></div>';
  ov.style.display='flex';
  document.getElementById('pgClose').addEventListener('click',function(){ov.style.display='none';});
}}
upd();
})();
</script>
</body>
